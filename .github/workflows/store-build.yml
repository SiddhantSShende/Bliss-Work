name: Store Build (MSIX)

# On-demand build of the BlissWork Microsoft Store package (.appx) for the FIRST, manual
# submission to Partner Center. Run it from the Actions tab (Run workflow), then download the
# .appx artifact and drag it into Partner Center -> BlissWork -> Packages.
#
# Uploads the genuine, unrenamed .appx rather than relabeling it .msix. `.appx` and `.msix`
# are the same container format, and Partner Center's "MSIX or PWA app" product type accepts
# .appx directly, so renaming buys nothing while adding a small, needless risk that a validator
# treats the .msix extension as authoritative over the (still appx-schema) internal manifest.
#
# Never attempts to publish anywhere (--publish=never, plus build.appx.publish: null in
# package.json removes the publish target entirely) — electron-builder's implicit CI-detected
# publish logic can otherwise try to construct a GitHub publisher and fail on a missing
# GH_TOKEN even on a plain build, so both safeguards are kept even though this job never runs
# on a tag.
#
# The first submission MUST be done manually (Microsoft's msstore CI publish only works once the
# app is already live in the Store). After go-live, store-release.yml automates every update.

on:
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build .appx
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run build -w @taskboard/desktop

      # electron-builder's Store target is internally named `appx`; --win appx selects it even
      # though package.json's win.target only lists nsis (that stays for GitHub Releases .exe).
      - name: Package Store bundle (appx target)
        working-directory: apps/desktop
        run: npx --no-install electron-builder --win appx --publish=never

      - name: Upload .appx artifact
        uses: actions/upload-artifact@v4
        with:
          name: blisswork-appx
          path: apps/desktop/release/*.appx
          if-no-files-found: error
          retention-days: 14
