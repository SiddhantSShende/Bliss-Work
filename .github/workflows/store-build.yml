name: Store Build (MSIX)

# On-demand build of BlissWork's Microsoft Store package. Produces a downloadable
# .appx artifact you can drag into Partner Center → Packages, or sideload locally
# to test before Store certification.
#
# Uploads the genuine, unrenamed .appx rather than relabeling it .msix. They are
# the same underlying container format and Partner Center's "MSIX or PWA app"
# product type accepts .appx directly — renaming buys nothing and adds a small,
# needless risk that a validator second-guesses a .msix-named file whose
# internal manifest still declares itself appx-schema.
#
# This workflow ONLY packages — it never attempts to publish anywhere, so it
# cannot hit the "GitHub Personal Access Token is not set" failure that the
# publish-oriented store-release.yml can (electron-builder's implicit
# git-tag/CI-detected publish logic can still try to resolve a GitHub publisher
# even with --publish=never in some CI conditions; see apps/desktop/package.json's
# build.appx.publish: null, which removes the publish TARGET entirely for the
# appx build, making that failure mode structurally impossible regardless of
# the policy flag).
#
# Trigger: manually only (Actions → Store Build (MSIX) → Run workflow).

on:
  workflow_dispatch:

concurrency:
  group: store-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  build-appx:
    name: Build .appx (Microsoft Store)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build .appx package
        working-directory: apps/desktop
        run: npm run package:store

      - name: Upload .appx
        uses: actions/upload-artifact@v4
        with:
          name: blisswork-store-appx
          path: apps/desktop/release/*.appx
          if-no-files-found: error
          retention-days: 30
