name: Build Images

# Build (and optionally publish) container images for every service.
# Runs on push to main and on manual dispatch. Registry push is left commented
# out: it requires credentials wired up as repository/organization secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # packages: write   # ← uncomment when pushing to GitHub Container Registry.

env:
  # Registry to publish to once secrets/permissions are configured.
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All six service images. Each has a self-contained build context with
        # its own Dockerfile (see services/<name>/Dockerfile).
        service:
          - auth-svc
          - task-svc
          - email-worker
          - notification-svc
          - messaging-svc
          - ws-gateway
          - integrations-svc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ── Registry login (disabled until secrets exist) ──────────────────────
      # - name: Log in to the Container Registry
      #   uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          # Build only for now. Flip `push` to true (and enable the login step
          # plus `packages: write` permission above) to publish to the registry.
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
