name: Security (secrets, SAST rules, SBOM)

# Complements ci.yml (Trivy/grype/govulncheck/pip-audit/npm-audit) and codeql.yml
# with secret scanning, a rules-based SAST pass, and an SBOM artifact.
#
# Restored at the true repo root after being deleted (commit 6c0526f) rather than
# relocated when ci.yml/deploy-prod.yml/deploy-site.yml were moved here — GitHub
# never discovers workflows one directory too deep, so this had not run since.
# `Bliss-Work/` is a tracked subdirectory of this repo, not the repo root — the
# semgrep and sbom steps scope to it explicitly (see ci.yml's own comment on why
# `uses:` actions each need this in their own inputs, not a job-level
# `working-directory`, which only affects `run:` steps). gitleaks is
# deliberately NOT scoped to `Bliss-Work/` — it scans full git history across the
# whole checkout so a leak anywhere in the repo (this one included) is caught.
on:
  push:
    branches: [Prod-Sid]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so historical leaks are caught
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  semgrep:
    name: SAST rules (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.97.0
    defaults:
      run:
        working-directory: Bliss-Work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # p/ci is a curated security ruleset for Go/Python/JS/Dockerfiles/etc.
      # BLOCKING: semgrep ci exits non-zero on findings and now gates the build.
      # ONE rule is excluded, by id, with evidence — not a blanket downgrade.
      #
      # npm-missing-minimum-release-age fires on .npmrc even when the setting is
      # present at the value it recommends. Its body is Pro-only ("requires
      # login"), so the open engine we run here cannot evaluate the value and
      # reports it unconditionally: verified against `min-release-age = 7`,
      # `=14` and ` = 14` — all still flagged — and inline `nosemgrep` does not
      # suppress it either. The setting IS in place at the recommended 7 days
      # (.npmrc), so excluding the rule loses no protection; leaving it in would
      # only train people to ignore a red SAST job.
      #
      # Scoped to this rule id: every other rule, including all 200+ in p/ci and
      # p/secrets, still blocks. Drop this flag if the rule opens up or CI gains
      # a SEMGREP_APP_TOKEN.
      - run: >-
          semgrep ci --config p/ci --config p/secrets
          --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always() # upload the SARIF even when the scan failed the job
        with:
          sarif_file: Bliss-Work/semgrep.sarif
        continue-on-error: true # an upload-infra hiccup must not mask the result

  sbom:
    name: SBOM (syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: Bliss-Work
          format: spdx-json
          artifact-name: sbom.spdx.json
