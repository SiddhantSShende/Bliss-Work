name: CI

# ── Why this file lives at the repository root ───────────────────────────────
# Same reason as release.yml: GitHub Actions only reads `.github/workflows/` at
# the true repo root, and this monorepo's root holds Bliss-Work/ and
# Bliss-Website/ as siblings. This file used to sit in
# Bliss-Work/.github/workflows/ — one directory too deep — so it had never run
# once (`gh api .../actions/workflows/ci.yml` 404s). Every path below that was
# written assuming the checkout root IS Bliss-Work now needs an explicit prefix
# or the job-level `defaults.run.working-directory` below, because the checkout
# root here is the monorepo root, with Bliss-Work and Bliss-Website as siblings.
# `defaults.run.working-directory` only affects `run:` (shell) steps — action
# `with:` inputs (cache-dependency-path, docker build context, the golangci-lint
# working-directory) and `actions/upload-artifact`'s `path:` always resolve
# against the checkout root regardless, so those carry an explicit `Bliss-Work/`
# prefix instead.

on:
  push:
    branches: [Prod-Sid]
  pull_request:

# Cancel superseded in-flight runs for the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22.13.0"
  PYTHON_VERSION: "3.13"

defaults:
  run:
    working-directory: Bliss-Work

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # LINT — static analysis across all three language ecosystems.
  # ───────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint (Python · ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff==0.8.6"
      - name: ruff check
        run: |
          ruff check \
            services/auth-svc \
            services/task-svc \
            services/email-worker \
            services/integrations-svc \
            services/shared/kafka_security \
            services/shared/crypto \
            services/shared/tracing \
            services/shared/internal_auth
      - name: ruff format --check
        # Formatting drift is surfaced but does not fail the build (no repo
        # style config committed yet); flip to blocking once a style is agreed.
        continue-on-error: true
        run: |
          ruff format --check \
            services/auth-svc \
            services/task-svc \
            services/email-worker \
            services/integrations-svc \
            services/shared/kafka_security \
            services/shared/crypto \
            services/shared/tracing \
            services/shared/internal_auth

  lint-go:
    name: Lint (Go · golangci-lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway, shared/kafkaauth, shared/internalauth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Bliss-Work/services/${{ matrix.service }}/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: Bliss-Work/services/${{ matrix.service }}
          args: --timeout=5m
          # A run on this same branch reported a finding at a line number that
          # does not exist in the committed source at that commit (verified
          # directly against `git show <sha>:<file>` — off by exactly the
          # length of the fix's own diff, i.e. a stale result for the
          # pre-fix file). Disable the action's cache to rule it out rather
          # than land a second guess at the same nolint fix.
          skip-cache: true

  lint-js:
    name: Lint (JS/TS · eslint + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Bliss-Work/package-lock.json
      - run: npm ci
      - name: Typecheck (tsc) — all workspaces
        run: npm run typecheck --workspaces --if-present
      - name: ESLint
        # `npm run lint --workspaces` was a NO-OP: --workspaces excludes the
        # root, and no workspace defines a `lint` script — so this step checked
        # nothing for as long as it existed, while looking green.
        #
        # eslint.config.mjs at the root already covers every workspace (flat
        # config, own ignores), so run it directly. Blocking, because its
        # headline rule is react/no-danger — the guard that keeps
        # dangerouslySetInnerHTML out of the codebase. A non-blocking XSS guard
        # is not a guard.
        run: npm run lint
      - name: Check migration filenames and duplicated SQL blocks
        # Runs here rather than in each service's own suite because the rule is
        # ONE rule over seven migration directories in three languages — a copy
        # per service would be the duplication this very check exists to catch,
        # and the four services with no Go/pytest coverage of their migrations
        # would still be unguarded.
        #
        # No database and no npm install beyond what this job already did: it
        # only reads filenames and file contents.
        run: node scripts/check-migrations.mjs
      - name: Check UI locale catalogs against English
        # Every locale under packages/app/src/i18n/locales must mirror locales/en:
        # same files and keys, same {{placeholders}}/markup/URLs, and the plural
        # forms its language needs. Reads JSON only — no install needed beyond
        # this job's. See docs/I18N.md.
        run: node scripts/check-locales.mjs
      - name: Check no Office reader exists outside the Office Document Sandbox
        # DOC/DOCX/XLS/XLSX/PPT/PPTX are hostile input and may only be opened inside
        # services/doc-converter (an isolated LibreOffice container). Fails on any
        # Office-reading dependency, import or call anywhere else. Reads the tree only.
        run: node scripts/check-no-office-readers.mjs
      - name: Check Jenkinsfile image list against Dockerfiles and compose
        # Every image compose pulls must be built by the Jenkinsfile (else a
        # registry deploy's `compose pull` fails), and every Dockerfile COPY
        # source must be in that image's change-detection paths (else edits to
        # shared code ship a stale :latest). Reads files only.
        run: node scripts/check-jenkins-images.mjs
      - name: Check prod Alertmanager is not the dev sink
        # Prod must mount alertmanager.prod.yml and read its receiver URL from a
        # fail-closed secret file. Reads files only.
        run: node scripts/check-alertmanager-prod.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # MIGRATION BACKWARD-COMPATIBILITY — flags breaking schema changes in newly
  # added migration files (A9 in the scaling roadmap).
  #
  # Every service applies its own migrations/*.sql in filename order at process
  # boot (run_migrations() in Python, Store.Migrate in Go), and prod runs 2
  # replicas per HTTP service behind Caddy with a health-gated IN-PLACE restart
  # — so old and new code run CONCURRENTLY against the post-migration schema
  # during every rollout. A DROP COLUMN/TABLE, RENAME, or type-narrowing change
  # in a new migration breaks the old replica before it's even drained. Until
  # now that was enforced only by a human writing "this is additive" in a
  # deploy note. This is a separate job (not a lint-js step) because it needs
  # full git history to diff against the PR's base ref, which the other lint
  # steps don't.
  # ───────────────────────────────────────────────────────────────────────────
  migration-backcompat:
    name: Migration backward-compatibility lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — this job diffs against the PR's base ref
      - name: Check new migrations for backward-incompatible changes
        # No database and no npm install: it only reads filenames, file
        # contents, and `git diff` against the base ref. See
        # scripts/check-migration-backcompat.mjs for the risky-pattern list and
        # the `-- ACKNOWLEDGE-BREAKING: <reason>` override for an intentional
        # breaking change (same house style as scripts/audit-gate.mjs's
        # advisory allowlist: flag it, allow an explicit documented override,
        # never silently pass).
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-migration-backcompat.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD — compile the front-end bundles (web + desktop renderer).
  # ───────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (web + desktop)
    runs-on: ubuntu-latest
    # apps/web/vite.config.ts refuses a production build without every
    # VITE_*_BASE service URL set (see its requireServiceUrls plugin) — the
    # deliberate gate that turns "app throws on boot in the browser" into a
    # build-time failure instead. This job never publishes its output
    # anywhere, so CI-only placeholder values are fine; only their presence
    # is checked. Real values live in .env.prod on the VPS (see
    # .env.prod.example) and are supplied by web-builder at actual deploy time.
    env:
      VITE_AUTH_BASE: https://ci.invalid/api/auth
      VITE_TASK_BASE: https://ci.invalid/api/tasks
      VITE_NOTIFICATION_BASE: https://ci.invalid/api/notifications
      VITE_MESSAGING_BASE: https://ci.invalid/api/messaging
      VITE_INTEGRATIONS_BASE: https://ci.invalid/api/integrations
      VITE_TELEMETRY_BASE: https://ci.invalid/api/telemetry
      VITE_WS_URL: wss://ci.invalid/ws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Bliss-Work/package-lock.json
      - run: npm ci
      - run: npm run build -w @taskboard/web
      - run: npm run build -w @taskboard/desktop

      # The desktop app and the web app render the SAME packages/app, so they
      # should never differ in feature set — but they silently did for weeks
      # (the 0.1.0 installer had no Integrations, Mentions, Workspace apps or
      # Export Tasks while the web app had all four, and its updater could never
      # fetch a fix). Compare the built bundles, since that is what users run.
      - name: Check web/desktop bundle parity
        run: node scripts/check-bundle-parity.mjs

      # A `github` provider on this PRIVATE repo is unreadable by
      # electron-updater and fails silently at runtime — that is exactly how
      # 0.1.0 became permanently un-updatable. Catch it in the static config
      # here; release.yml re-checks the value actually baked into the artifact.
      # The website and the web app each keep their own hand-maintained copy of
      # the installer filenames, in separate repos, synced by nothing but a
      # comment. Pin the web app's copy to build.<os>.artifactName — the only
      # thing that decides what actually lands on the download host — so it can
      # neither 404 nor drift from the website's copy.
      - name: Check download links match what the desktop build produces
        run: node scripts/check-download-links.mjs

      - name: Check the desktop update feed is the generic VPS feed
        run: |
          node -e '
            const pkg = require("./apps/desktop/package.json");
            const pub = pkg.build?.publish?.[0] ?? {};
            const wantUrl = "https://communication.rnrtechs.com/downloads";
            if (pub.provider !== "generic" || pub.url !== wantUrl) {
              console.error(
                `apps/desktop/package.json build.publish must be ` +
                `{provider:"generic", url:"${wantUrl}"}, got ` + JSON.stringify(pub));
              process.exit(1);
            }
            console.log("✓ desktop publish config is the generic VPS feed");
          '

  # ───────────────────────────────────────────────────────────────────────────
  # TEST — unit/integration tests per ecosystem.
  # ───────────────────────────────────────────────────────────────────────────
  test-python:
    name: Test (Python · pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # telemetry-svc was MISSING from this list. Its unit suite existed and
        # had never run in CI once — so every change to it merged on the
        # strength of whoever remembered to run pytest locally, and ruff was the
        # only automated check it got. A test that does not run is not a test.
        #
        # Keep this in step with the directories under services/ that have a
        # pytest.ini; the pip-audit matrix below carries the same obligation.
        service: [auth-svc, task-svc, telemetry-svc, email-worker, integrations-svc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps (runtime + dev/test)
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (unit — BLOCKING; integration suites run via -m integration)
        # Unit suites are self-contained (no live Postgres/Kafka) and now GATE
        # the build. The `integration` marker selects the testcontainers suites,
        # which run in their own job with Docker available.
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: |
          . .venv/bin/activate
          pytest -m "not integration" --cov=app --cov-report=term-missing

  test-python-shared:
    # Each services/shared/<pkg> is its own local package (installed by every
    # service that needs it via a local path requirement, not copied), so its
    # own suite needs its own job — it has no app/ directory and
    # pytest --cov=app above would not reach it.
    name: Test (Python · shared ${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [kafka_security, crypto, tracing, internal_auth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps
        working-directory: Bliss-Work/services/shared/${{ matrix.pkg }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: pytest
        working-directory: Bliss-Work/services/shared/${{ matrix.pkg }}
        run: |
          . .venv/bin/activate
          pytest

  test-integration:
    name: Test (Python · integration / testcontainers)
    runs-on: ubuntu-latest
    # ubuntu-latest runners have Docker, so testcontainers spins a real Postgres.
    strategy:
      fail-fast: false
      matrix:
        # auth-svc: RLS isolation. integrations-svc: mentions API + claim→task
        # idempotency against a real Postgres. task-svc: the internal by-title
        # delete endpoint's org-scoping (see docs/AUTH_AUTHZ_REMEDIATION_PLAN.md
        # Phase 1). Extend as integration suites grow.
        service: [auth-svc, integrations-svc, task-svc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps (runtime + dev/test)
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest -m integration (real Postgres via testcontainers)
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: |
          . .venv/bin/activate
          pytest -m integration -p no:cacheprovider

  test-go:
    name: Test (Go · go test -race)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway, shared/kafkaauth, shared/internalauth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Bliss-Work/services/${{ matrix.service }}/go.sum
      - name: go build
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: go build ./...
      - name: go test -race
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: go test -race -count=1 ./...

  # ws-gateway presence against a REAL Redis.
  #
  # Split from the matrix above because it needs a service container and only
  # one service uses it. The tests skip themselves when REDIS_TEST_URL is unset,
  # so the matrix job stays a pure unit run — but presence correctness lives in
  # Redis semantics (ZADD's added-count, exclusive score bounds, TTLs), and a
  # fake would test this package's assumptions rather than Redis's behaviour.
  # Those assumptions are exactly what changed when presence stopped being a SET
  # and started expiring, which is the bug that had users showing online for
  # days after their gateway was killed.
  test-go-integration:
    name: Test (Go · ws-gateway presence vs Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Bliss-Work/services/ws-gateway/go.sum
      - name: go test -race (integration)
        working-directory: Bliss-Work/services/ws-gateway
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: go test -race -count=1 ./internal/store/ -run Integration -v

  # messaging-svc's object-store backend against a real S3 API.
  #
  # Same reasoning as the Redis job: what this code depends on is the SERVER's
  # behaviour — that a seek becomes a ranged GET, that a server-side copy commits
  # a content-addressed key, that a prefix delete erases exactly one org. A stub
  # would assert our beliefs about S3 rather than S3.
  test-go-s3:
    name: Test (Go · messaging-svc blobs vs MinIO)
    runs-on: ubuntu-latest
    # bitnami/minio was pulled from Docker Hub entirely (verified 2026-08-28:
    # `docker pull bitnami/minio:latest` and every other tag tried 404s —
    # Bitnami moved its catalog behind a paid tier) — not a flake, every run
    # failed the same way. Switched to the official minio/minio image, which
    # is still free, but as a manual `docker run` step rather than a
    # `services:` container: GitHub Actions' `services:` schema has no way to
    # override a container's command, and unlike bitnami's image, official
    # minio/minio does not run without one (`server /data`) — it just prints
    # usage and exits. It also has no MINIO_DEFAULT_BUCKETS equivalent, so the
    # bucket is created explicitly with the official minio/mc client instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Bliss-Work/services/messaging-svc/go.sum
      - name: Start MinIO
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live \
            || { echo "::error::MinIO never became healthy"; docker logs minio; exit 1; }
      - name: Create the test bucket
        run: |
          docker run --rm --network host minio/mc:latest \
            mb --ignore-existing minioadmin:minioadmin@http://127.0.0.1:9000/blisswork-test
      - name: go test -race (object store)
        working-directory: Bliss-Work/services/messaging-svc
        env:
          S3_TEST_ENDPOINT: 127.0.0.1:9000
          S3_TEST_BUCKET: blisswork-test
        run: go test -race -count=1 ./internal/blob/ -run S3Integration -v
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio

  # The Office Document Sandbox (Bliss-Work/services/doc-converter): the only
  # place an Office file is opened. Hostile input is EXPECTED, so this runs the
  # whole hostile suite against the real LibreOffice in the real image:
  # macro/link canaries with positive controls, renamed executables, corrupt and
  # truncated files, zip bombs, oversize input and output, timeouts, temp-file
  # destruction after every outcome, and the production container's isolation
  # (non-root, read-only, no capabilities, no route out of its internal network).
  test-doc-converter:
    name: Test (doc-converter · Office Document Sandbox)
    runs-on: ubuntu-latest
    env:
      FIXTURE_DIR: ${{ github.workspace }}/fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The sandbox supports exactly the shared preview-extension list
        working-directory: Bliss-Work/services/doc-converter
        run: python3 -m unittest tests.test_spec -v
      - name: Build the image
        run: docker build -f Bliss-Work/services/doc-converter/Dockerfile -t doc-converter:dev Bliss-Work
      - name: Generate fixtures with LibreOffice itself
        run: |
          mkdir -p "$FIXTURE_DIR" && chmod 777 "$FIXTURE_DIR"
          docker run --rm --tmpfs /tmp -v "$PWD/Bliss-Work/services/doc-converter/tests:/tests:ro" \
            -v "$FIXTURE_DIR:/fx" doc-converter:dev python /tests/make_fixtures.py /fx
      - name: In-image hostile-document tests (macros, links, hygiene)
        run: |
          docker run --rm --tmpfs /tmp:size=512m \
            -v "$PWD/Bliss-Work/services/doc-converter/tests:/app/tests:ro" -v "$FIXTURE_DIR:/fx:ro" \
            doc-converter:dev python -W ignore -m unittest tests.test_inimage -v
      - name: HTTP-level hostile-input tests against production-flag containers
        working-directory: Bliss-Work/services/doc-converter
        run: |
          run() { docker run -d --name "$1" --read-only --tmpfs /tmp:size=512m --cap-drop ALL \
                    --pids-limit 256 --memory 1g --cpus 1 -p "127.0.0.1:$2:9000" "${@:3}" doc-converter:dev; }
          run dc-test 19000
          run dc-tiny 19001 -e CONVERT_MAX_OUTPUT_BYTES=200
          run dc-short 19002 -e CONVERT_TIMEOUT_SECONDS=1
          run dc-one 19003 -e CONVERT_CONCURRENCY=1
          sleep 6
          CONVERTER_URL=http://127.0.0.1:19000 \
          CONVERTER_TINY_OUTPUT_URL=http://127.0.0.1:19001 \
          CONVERTER_SHORT_TIMEOUT_URL=http://127.0.0.1:19002 \
          CONVERTER_ONE_SLOT_URL=http://127.0.0.1:19003 \
            python3 -m unittest tests.test_server -v
      - name: Container isolation (identity, filesystem, network, limits)
        working-directory: Bliss-Work/services/doc-converter
        env:
          DOCKER: docker
        run: tests/security_check.sh
      - name: Cleanup
        if: always()
        run: docker rm -f dc-test dc-tiny dc-short dc-one >/dev/null 2>&1 || true

  test-js:
    name: Test (JS/TS · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Bliss-Work/package-lock.json
      - run: npm ci
      - name: vitest / npm test (all workspaces)
        run: npm test --workspaces --if-present

  # ───────────────────────────────────────────────────────────────────────────
  # SECURITY-SCAN — dependency + filesystem + image vulnerability scanning.
  # Non-blocking where appropriate, but always surfaced in the job log / SARIF.
  # ───────────────────────────────────────────────────────────────────────────
  security-trivy-fs:
    name: Security (Trivy · filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Bliss-Work
          trivyignores: Bliss-Work/.trivyignore
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # Uploading SARIF needs code scanning, which on a PRIVATE repo needs a paid
      # GitHub Code Security licence. Without one this step fails with "Code
      # scanning is not enabled for this repository" — and because it was
      # blocking, it failed the whole job, which failed CI, which is what made
      # Deploy Production and Release Desktop skip. A results-storage feature we
      # don't have a licence for must not gate shipping.
      #
      # The security signal is NOT lost: the blocking table scan below still
      # fails the build on any CRITICAL. This step only decides whether the
      # findings also land in the Security tab. Same posture as the semgrep
      # upload in security-extra.yml. Drop continue-on-error once a Code
      # Security licence is in place.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy filesystem scan (table, fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Bliss-Work
          trivyignores: Bliss-Work/.trivyignore
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security-trivy-image:
    name: Security (Trivy · image)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          [auth-svc, task-svc, email-worker, notification-svc, messaging-svc, ws-gateway, integrations-svc, doc-converter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Each service's Dockerfile COPYs sibling services/shared/* packages
          # with paths like `COPY services/shared/kafkaauth ...`, so it needs
          # the workspace root as context, not the service's own subdirectory
          # (that would put every sibling package outside the build context).
          context: Bliss-Work
          file: Bliss-Work/services/${{ matrix.service }}/Dockerfile
          load: true
          tags: taskboard/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: taskboard/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Surfaced but non-blocking — base-image CVEs shouldn't gate merges.
          exit-code: "0"

  security-go:
    name: Security (Go · govulncheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway, shared/kafkaauth, shared/internalauth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Bliss-Work/services/${{ matrix.service }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: govulncheck ./...

  security-python:
    name: Security (Python · pip-audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # telemetry-svc omitted here too, so its dependencies were never audited
        # for known vulnerabilities. It carries the same FastAPI/SQLAlchemy/
        # aiokafka stack as its siblings, so it was exposed to every advisory
        # they were — with nothing watching.
        service: [auth-svc, task-svc, telemetry-svc, email-worker, integrations-svc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"
      - name: pip-audit
        # requirements.txt has local path requirements like
        # `../shared/kafka_security`, resolved relative to pip's CWD, not to
        # the requirements file's own location — so this must run from inside
        # services/${{ matrix.service }} (matching the test-python job above),
        # not from the job's default Bliss-Work working directory.
        working-directory: Bliss-Work/services/${{ matrix.service }}
        run: pip-audit -r requirements.txt

  security-npm:
    name: Security (npm · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Bliss-Work/package-lock.json
      - run: npm ci
      - name: npm audit (high+, production deps)
        # Blocking, scoped to production deps, WITH a justified allowlist.
        #
        # Plain `npm audit --audit-level=high --omit=dev` is all-or-nothing:
        # either it blocks merges on advisories that have no fix and cannot be
        # exploited here, or someone makes it non-blocking and it stops
        # protecting anything. The gate fails on everything except a small set
        # of advisories, each recorded in scripts/audit-gate.mjs with a reason,
        # evidence that this app doesn't reach the vulnerable path, and a review
        # date. A NEW advisory always fails — the allowlist keys on the advisory
        # id, not the package.
        run: node scripts/audit-gate.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # HELM-LINT removed 2026-08-27: deploy/helm/taskboard was deleted from the
  # repo in commit 3bcc7778 (2026-08-24). This job used to degrade to a
  # ::warning:: and skip lint/template/kubeconform when the chart was absent
  # rather than fail, so its removal produced zero CI signal for weeks — that
  # silent-skip behavior is itself the reason to delete the job outright now
  # instead of leaving a permanent no-op. If a Helm chart is rebuilt (see
  # INFRASTRUCTURE.md's "Helm chart completed" update note, and Part B.1 of
  # the scaling roadmap), re-add this job WITHOUT the presence-check escape
  # hatch — a missing chart should fail the job, not skip it.
  # ───────────────────────────────────────────────────────────────────────────
  # E2E — full stack via docker compose, seeded, then the cross-org authz suite.
  # (Preserved from the original pipeline; gated behind cheaper checks.)
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (compose · seed · security-authz)
    runs-on: ubuntu-latest
    needs: [lint-js, test-go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Bliss-Work/package-lock.json
      - run: npm ci
      - run: cp .env.example .env && npm run gen:keys
      # auth-svc runs as uid 10001 and mounts ./keys read-only, but gen:keys
      # writes the private key 0600 owned by whoever ran it (uid 1001 on a
      # runner). The container therefore could not read its OWN signing key,
      # died in lifespan startup with PermissionError, never went healthy, and
      # took the whole compose stack — and this job — down with it.
      #
      # Chowning to the container user is what production already does (its
      # keypair is 0600 owned by 10001); loosening the mode instead would put a
      # world-readable private key in every developer's checkout.
      - name: Give the dev keypair to the container user (uid 10001)
        run: sudo chown -R 10001:10001 keys
      - run: docker compose up -d --build
      - run: bash scripts/wait-for.sh
      - run: npm run seed
      - name: Cross-org authorization regression
        run: npm run test:authz
      - name: Internal-service-secret identity regression
        run: npm run test:internal-token-identity
      - if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-logs
          path: Bliss-Work/compose-logs.txt
