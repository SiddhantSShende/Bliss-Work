name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-flight runs for the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # LINT — static analysis across all three language ecosystems.
  # ───────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint (Python · ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff==0.8.6"
      - name: ruff check
        run: |
          ruff check \
            services/auth-svc \
            services/task-svc \
            services/email-worker \
            services/integrations-svc
      - name: ruff format --check
        # Formatting drift is surfaced but does not fail the build (no repo
        # style config committed yet); flip to blocking once a style is agreed.
        continue-on-error: true
        run: |
          ruff format --check \
            services/auth-svc \
            services/task-svc \
            services/email-worker \
            services/integrations-svc

  lint-go:
    name: Lint (Go · golangci-lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: services/${{ matrix.service }}
          args: --timeout=5m

  lint-js:
    name: Lint (JS/TS · eslint + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc) — all workspaces
        run: npm run typecheck --workspaces --if-present
      - name: ESLint
        # `npm run lint --workspaces` was a NO-OP: --workspaces excludes the
        # root, and no workspace defines a `lint` script — so this step checked
        # nothing for as long as it existed, while looking green.
        #
        # eslint.config.mjs at the root already covers every workspace (flat
        # config, own ignores), so run it directly. Blocking, because its
        # headline rule is react/no-danger — the guard that keeps
        # dangerouslySetInnerHTML out of the codebase. A non-blocking XSS guard
        # is not a guard.
        run: npm run lint

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD — compile the front-end bundles (web + desktop renderer).
  # ───────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (web + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @taskboard/web
      - run: npm run build -w @taskboard/desktop

      # The desktop app and the web app render the SAME packages/app, so they
      # should never differ in feature set — but they silently did for weeks
      # (the 0.1.0 installer had no Integrations, Mentions, Workspace apps or
      # Export Tasks while the web app had all four, and its updater could never
      # fetch a fix). Compare the built bundles, since that is what users run.
      - name: Check web/desktop bundle parity
        run: node scripts/check-bundle-parity.mjs

      # A `github` provider on this PRIVATE repo is unreadable by
      # electron-updater and fails silently at runtime — that is exactly how
      # 0.1.0 became permanently un-updatable. Catch it in the static config
      # here; release.yml re-checks the value actually baked into the artifact.
      # The website and the web app each keep their own hand-maintained copy of
      # the installer filenames, in separate repos, synced by nothing but a
      # comment. Pin the web app's copy to build.<os>.artifactName — the only
      # thing that decides what actually lands on the download host — so it can
      # neither 404 nor drift from the website's copy.
      - name: Check download links match what the desktop build produces
        run: node scripts/check-download-links.mjs

      - name: Check the desktop update feed is the generic VPS feed
        run: |
          node -e '
            const pkg = require("./apps/desktop/package.json");
            const pub = pkg.build?.publish?.[0] ?? {};
            const wantUrl = "https://communication.rnrtechs.com/downloads";
            if (pub.provider !== "generic" || pub.url !== wantUrl) {
              console.error(
                `apps/desktop/package.json build.publish must be ` +
                `{provider:"generic", url:"${wantUrl}"}, got ` + JSON.stringify(pub));
              process.exit(1);
            }
            console.log("✓ desktop publish config is the generic VPS feed");
          '

  # ───────────────────────────────────────────────────────────────────────────
  # TEST — unit/integration tests per ecosystem.
  # ───────────────────────────────────────────────────────────────────────────
  test-python:
    name: Test (Python · pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-svc, task-svc, email-worker, integrations-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps (runtime + dev/test)
        working-directory: services/${{ matrix.service }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (unit — BLOCKING; integration suites run via -m integration)
        # Unit suites are self-contained (no live Postgres/Kafka) and now GATE
        # the build. The `integration` marker selects the testcontainers suites,
        # which run in their own job with Docker available.
        working-directory: services/${{ matrix.service }}
        run: |
          . .venv/bin/activate
          pytest -m "not integration" --cov=app --cov-report=term-missing

  test-integration:
    name: Test (Python · integration / testcontainers)
    runs-on: ubuntu-latest
    # ubuntu-latest runners have Docker, so testcontainers spins a real Postgres.
    strategy:
      fail-fast: false
      matrix:
        # auth-svc: RLS isolation. integrations-svc: mentions API + claim→task
        # idempotency against a real Postgres. Extend as integration suites grow.
        service: [auth-svc, integrations-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps (runtime + dev/test)
        working-directory: services/${{ matrix.service }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest -m integration (real Postgres via testcontainers)
        working-directory: services/${{ matrix.service }}
        run: |
          . .venv/bin/activate
          pytest -m integration -p no:cacheprovider

  test-go:
    name: Test (Go · go test -race)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: go build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      - name: go test -race
        working-directory: services/${{ matrix.service }}
        run: go test -race -count=1 ./...

  test-js:
    name: Test (JS/TS · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: vitest / npm test (all workspaces)
        run: npm test --workspaces --if-present

  # ───────────────────────────────────────────────────────────────────────────
  # SECURITY-SCAN — dependency + filesystem + image vulnerability scanning.
  # Non-blocking where appropriate, but always surfaced in the job log / SARIF.
  # ───────────────────────────────────────────────────────────────────────────
  security-trivy-fs:
    name: Security (Trivy · filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # Uploading SARIF needs code scanning, which on a PRIVATE repo needs a paid
      # GitHub Code Security licence. Without one this step fails with "Code
      # scanning is not enabled for this repository" — and because it was
      # blocking, it failed the whole job, which failed CI, which is what made
      # Deploy Production and Release Desktop skip. A results-storage feature we
      # don't have a licence for must not gate shipping.
      #
      # The security signal is NOT lost: the blocking table scan below still
      # fails the build on any CRITICAL. This step only decides whether the
      # findings also land in the Security tab. Same posture as the semgrep
      # upload in security-extra.yml. Drop continue-on-error once a Code
      # Security licence is in place.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy filesystem scan (table, fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security-trivy-image:
    name: Security (Trivy · image)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          [auth-svc, task-svc, email-worker, notification-svc, messaging-svc, ws-gateway, integrations-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: taskboard/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: taskboard/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Surfaced but non-blocking — base-image CVEs shouldn't gate merges.
          exit-code: "0"

  security-go:
    name: Security (Go · govulncheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: services/${{ matrix.service }}
        run: govulncheck ./...

  security-python:
    name: Security (Python · pip-audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-svc, task-svc, email-worker, integrations-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"
      - name: pip-audit
        run: pip-audit -r services/${{ matrix.service }}/requirements.txt

  security-npm:
    name: Security (npm · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high+, production deps)
        # Blocking, scoped to production deps, WITH a justified allowlist.
        #
        # Plain `npm audit --audit-level=high --omit=dev` is all-or-nothing:
        # either it blocks merges on advisories that have no fix and cannot be
        # exploited here, or someone makes it non-blocking and it stops
        # protecting anything. The gate fails on everything except a small set
        # of advisories, each recorded in scripts/audit-gate.mjs with a reason,
        # evidence that this app doesn't reach the vulnerable path, and a review
        # date. A NEW advisory always fails — the allowlist keys on the advisory
        # id, not the package.
        run: node scripts/audit-gate.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # HELM-LINT — chart linting, templating, and Kubernetes schema validation.
  # ───────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm (lint · template · kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3
      - name: Check chart presence
        id: chart
        run: |
          if [ -f deploy/helm/taskboard/Chart.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::deploy/helm/taskboard chart not found — skipping helm lint/template/kubeconform."
          fi
      - name: helm lint
        if: steps.chart.outputs.exists == 'true'
        run: helm lint deploy/helm/taskboard
      - name: helm template
        if: steps.chart.outputs.exists == 'true'
        run: helm template taskboard deploy/helm/taskboard > /tmp/rendered.yaml
      - name: Install kubeconform
        if: steps.chart.outputs.exists == 'true'
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: kubeconform (validate rendered manifests)
        if: steps.chart.outputs.exists == 'true'
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.30.0 /tmp/rendered.yaml

  # ───────────────────────────────────────────────────────────────────────────
  # E2E — full stack via docker compose, seeded, then the demo flow.
  # (Preserved from the original pipeline; gated behind cheaper checks.)
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (compose · seed · demo)
    runs-on: ubuntu-latest
    needs: [lint-js, test-go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.example .env && npm run gen:keys
      - run: docker compose up -d --build
      - run: bash scripts/wait-for.sh
      - run: npm run seed
      - run: npm run demo
      - if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-logs
          path: compose-logs.txt
