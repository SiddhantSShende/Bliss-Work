name: Release Desktop

# ── Why this file lives at the repository root ───────────────────────────────
# GitHub Actions only ever reads `.github/workflows/` at the TOP of the repo.
# This monorepo's top level holds Bliss-Work/ and Bliss-Website/ as siblings, and
# this file used to sit inside Bliss-Work/.github/workflows/ — one directory too
# deep for GitHub to ever discover it. It had never run: `gh api .../actions/
# workflows/release.yml` 404s, and every filename below that lives in the repo
# (scripts/…, apps/desktop/…) carries an explicit `Bliss-Work/` prefix, because
# checkout still clones from the true root and none of those paths exist there
# directly.
#
# Builds the BlissWork desktop installers on each platform's native runner,
# CODE-SIGNS them, publishes SHA-256 checksums, and deploys straight to our VPS
# download host (NOT GitHub Releases — the marketing site + web app link to
# https://communication.rnrtechs.com/downloads/<stable-name>).
#
# ── Auto-update ──────────────────────────────────────────────────────────────
# That same directory IS the electron-updater feed. `apps/desktop/package.json`
# declares `publish: { provider: generic, url: .../downloads }`, which
# electron-builder bakes into app-update.yml inside the package, and
# apps/desktop/src/main/updater.ts checks it on every launch.
#
# It must be a generic feed rather than GitHub Releases because this repo is
# PRIVATE — a GitHub feed would need a token embedded in the installer, where
# anyone can extract it.
#
# Two things are therefore load-bearing and easy to break silently:
#   1. The `latest*.yml` manifests MUST be uploaded alongside the installers.
#      Without them the feed 404s and auto-update never fires — no error, no
#      dialog, users simply stay on an old version forever. The `Verify update
#      manifests` step below fails the build rather than let that happen.
#   2. The Windows sha512 in latest.yml MUST be recomputed AFTER signing (see
#      `Regenerate the Windows update manifest`), because signing rewrites the
#      .exe and electron-updater verifies that hash before installing.
#
# ── Triggers ─────────────────────────────────────────────────────────────────
#   - every push to `Prod-Sid` (the production branch — see below) →
#     auto-publishes version 0.1.<run_number>
#   - a `v*` tag            → publishes that exact version
#   - manual dispatch       → 0.1.<run_number>
#
# This used to be `workflow_run: workflows: ["CI"]`, gated on CI passing first.
# `ci.yml` had the same undiscovered-location problem as this file — it had
# never run either — so a gate on it would never fire and no release would ever
# auto-publish. `ci.yml` and `deploy-prod.yml` are now registered at the repo
# root too (2026-08-28), but this stays a plain push trigger rather than
# reinstating the `workflow_run` gate: unlike `deploy-prod.yml` (which only ever
# deploys the current HEAD of Prod-Sid), gating the desktop release on CI would
# make its version number depend on which commit CI happened to be validating,
# not necessarily the one that triggered this run. Revisit if that gap matters.
#
# The branch is `Prod-Sid`, not `main`: this repository deploys from Prod-Sid
# (also its GitHub default branch, since 2026-08-28); `main` exists only as a
# stale first commit with no remote pushes. Update this if that ever changes.
#
# Every run also uploads the installers as workflow artifacts, so a dry run
# without secrets still produces (unsigned) builds you can inspect.
#
# ── Repository secrets ───────────────────────────────────────────────────────
# Windows signing (SSL.com eSigner — cloud, cross-platform; see apps/desktop/SIGNING.md):
#   ES_USERNAME  ES_PASSWORD  ES_CREDENTIAL_ID  ES_TOTP_SECRET
# macOS signing + notarization (Apple Developer ID):
#   MAC_CSC_LINK (base64 of the Developer ID Application .p12)   MAC_CSC_KEY_PASSWORD
#   APPLE_ID     APPLE_APP_SPECIFIC_PASSWORD     APPLE_TEAM_ID
# Deploy to the VPS (optional — skipped if unset):
#   VPS_HOST  VPS_USER  VPS_PATH (/home/ubuntu/BlissWork/downloads)
#   VPS_SSH_KEY (a private key whose public half is in the VPS user's authorized_keys)
#
# VPS_PATH must stay OUTSIDE any build output directory. It used to point into
# Bliss-Website/dist/downloads — but `dist/` is Vite build output and
# `npm run build` empties it, so every website rebuild silently deleted the whole
# installer set and update feed until the next release run.
#
# Any signing/deploy stage whose secrets are absent is SKIPPED, so this workflow
# is safe to run before you've bought a certificate. See docs/DEPLOY.md.

on:
  push:
    branches: [Prod-Sid]
    tags:
      - "v*"
  workflow_dispatch:

# Serialize: releases publish into a single shared directory on the VPS, so two
# concurrent rsyncs could interleave a manifest with another version's binary.
# Never cancel in flight for the same reason.
concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22.13.0"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Decide the version once, so all three platform builds agree on it. They must:
  # electron-updater compares the version in latest.yml against the running app,
  # and a mac build numbered differently from the Windows one would advertise a
  # different release under the same feed.
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Check the credentials BEFORE spending 40 minutes on three platform builds.
  # Deploy secrets are required for a real release: without them the run builds
  # everything and then dies at the very end (or worse, used to go green having
  # shipped nothing). Signing secrets are optional — absent, the installers are
  # built unsigned, which still works but warns on the user's machine, so say so
  # out loud rather than letting someone discover it from a SmartScreen dialog.
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight (secrets)
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
    steps:
      - name: Report and gate on required secrets
        run: |
          # Presence only — values are never printed.
          state() { [ -n "$1" ] && echo "✅ set" || echo "❌ **missing**"; }
          {
            echo "### Release credentials"
            echo ""
            echo "| Secret | Required | Status |"
            echo "|---|---|---|"
            echo "| VPS_HOST | yes — publishes to the download page | $(state "$VPS_HOST") |"
            echo "| VPS_USER | yes | $(state "$VPS_USER") |"
            echo "| VPS_PATH | yes | $(state "$VPS_PATH") |"
            echo "| VPS_SSH_KEY | yes | $(state "$VPS_SSH_KEY") |"
            echo "| MAC_CSC_LINK | no — unsigned mac build without it | $(state "$MAC_CSC_LINK") |"
            echo "| APPLE_ID | no — no notarization without it | $(state "$APPLE_ID") |"
            echo "| ES_USERNAME | no — unsigned Windows build without it | $(state "$ES_USERNAME") |"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=""
          for k in VPS_HOST VPS_USER VPS_PATH VPS_SSH_KEY; do
            [ -z "${!k}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required deploy secret(s):$missing"
            echo "Users download from the VPS. Without these the build cannot reach them."
            echo "Set them at Settings → Secrets and variables → Actions."
            exit 1
          fi
          [ -z "$MAC_CSC_LINK" ] && echo "::warning::MAC_CSC_LINK unset — the macOS build will be UNSIGNED (Gatekeeper will warn users)."
          [ -z "$ES_USERNAME" ] && echo "::warning::ES_USERNAME unset — the Windows build will be UNSIGNED (SmartScreen will warn users)."
          echo "Preflight OK — deploy credentials present."

  version:
    name: Resolve version
    needs: preflight
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `github.run_number` used to be the whole version formula: "monotonic
      # across the repo, so successive pushes always produce a strictly
      # increasing semver." That was true for run_number itself, but this
      # workflow had NEVER run before 2026-08-28 (see the file-location note
      # at the top) — meanwhile scripts/publish-desktop.sh / `make
      # desktop-release` had been publishing manually for weeks and had
      # already reached 0.1.22. The very first automated run started counting
      # from run_number≈12 and silently published 0.1.12 over the live 0.1.22
      # — a downgrade electron-updater will never offer to an already-updated
      # client, permanently stranding it. Verified against
      # downloads-backup/20260827T123710Z/latest.yml (version: 0.1.21, backed
      # up moments before that manual release wrote 0.1.22) and a client
      # report of running 0.1.22 while the feed had regressed to 0.1.13.
      #
      # Fix: ask the live feed itself, the same way `make desktop-release` /
      # scripts/build-desktop-container.sh already do via
      # scripts/next-desktop-version.mjs — read every latest*.yml that is
      # ACTUALLY published right now and bump the highest patch found, so
      # this path and the manual path share one strictly-increasing number
      # no matter which one published last.
      - name: Fetch the live update feed
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /tmp/live-feed
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST:$VPS_PATH/latest*.yml" /tmp/live-feed/
          rm -f ~/.ssh/id_deploy

      - id: v
        working-directory: Bliss-Work
        run: |
          # `push` now covers BOTH a tag push and an ordinary branch push (see
          # the trigger block above) — event_name alone no longer distinguishes
          # them, so check the ref itself.
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            # Tag push: v1.2.3 → 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node scripts/next-desktop-version.mjs /tmp/live-feed)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

  # ───────────────────────────────────────────────────────────────────────────
  # Build each OS on its native runner. macOS is signed + notarized in-place here
  # (electron-builder signs the .app during packaging); Windows is signed in the
  # `release` job below (CodeSignTool is cross-platform, so we sign on Linux).
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    # The npm workspace root is Bliss-Work/, not the checkout root — this repo
    # has Bliss-Work/ and Bliss-Website/ as siblings at the top. Applies to
    # every plain `run:` step below; a step with its OWN `working-directory:`
    # (Package installers; Verify update manifests) overrides rather than nests
    # under this, so those carry the `Bliss-Work/` prefix explicitly instead.
    defaults:
      run:
        working-directory: Bliss-Work
    # Mirrored into env, then checked as env.MAC_CSC_LINK below — matching the
    # convention already used by the preflight job and deploy-prod.yml/
    # deploy-site.yml. `secrets.*` directly inside a step `if:` is rejected by
    # GitHub's workflow schema validator (the whole run fails before any job
    # starts, with no logs — verified 2026-08-28).
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned rather than left to default to the branch tip: a push that
          # lands while this run is still building must not be silently picked
          # up mid-build — this run ships exactly the commit that triggered it.
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Bliss-Work/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - name: Install dependencies
        run: npm ci

      # Build-time only — deliberately NOT committed back. A version-bump commit
      # would retrigger CI, which would retrigger this workflow, forever.
      - name: Stamp version ${{ needs.version.outputs.version }}
        run: node scripts/set-desktop-version.mjs "${{ needs.version.outputs.version }}"

      - name: Build desktop bundle
        env:
          # Baked into the main bundle at build time (electron.vite.config.ts),
          # because a packaged app launched from the Dock or Start menu inherits
          # no shell environment. Optional: an empty value ships a build whose
          # location sharing falls back to the server's IP lookup rather than a
          # precise fix. See apps/desktop/src/main/geo-key.ts.
          TB_GOOGLE_API_KEY: ${{ secrets.TB_GOOGLE_API_KEY }}
        run: npm run build -w @taskboard/desktop

      # electron-builder's own cscLink resolution (app-builder-lib's
      # `chooseNotNull`) only checks `== null` — an env var that is SET but
      # empty ('') counts as "a cert was provided" exactly like a real one,
      # and it then tries to read that empty string as a certificate file
      # path, which resolves to the project directory itself and crashes with
      # "<projectDir> not a file". So CSC_LINK/CSC_KEY_PASSWORD must be
      # genuinely UNSET (not set to '') when there is no cert — which a
      # static `env:` map cannot express, since every branch of a `${{ }}`
      # expression still creates the key. Only export them here, in a step
      # that plainly does not run at all when the secret is absent.
      - name: Configure macOS signing credentials
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        env:
          CSC_LINK_VALUE: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          # Heredoc form (not `KEY=value`) because a base64 blob may be
          # multi-line depending on how it was generated (see SIGNING.md).
          {
            echo "CSC_LINK<<CSC_LINK_EOF"
            echo "$CSC_LINK_VALUE"
            echo "CSC_LINK_EOF"
            echo "CSC_KEY_PASSWORD<<CSC_KEY_PASSWORD_EOF"
            echo "$CSC_KEY_PASSWORD_VALUE"
            echo "CSC_KEY_PASSWORD_EOF"
          } >> "$GITHUB_ENV"

      - name: Package installers (mac signed + notarized here)
        # A step's own working-directory replaces the job default rather than
        # nesting under it, so this needs the full prefix.
        working-directory: Bliss-Work/apps/desktop
        env:
          # macOS Developer ID signing — scoped to the mac runner. When no cert
          # secret is present, CSC_IDENTITY_AUTO_DISCOVERY=false builds unsigned
          # instead of failing. The afterSign hook (build/notarize.cjs) notarizes
          # only when the APPLE_* creds are also set. CSC_LINK/CSC_KEY_PASSWORD
          # are NOT set here — see "Configure macOS signing credentials" above.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'macOS' && env.MAC_CSC_LINK != '') && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # `--publish never` is required, not merely cautious: the `generic`
        # provider is download-only, so electron-builder has nowhere to upload.
        # It still WRITES the latest*.yml manifests into release/, which is what
        # the next step checks and what the deploy step ships.
        run: npx --no-install electron-builder --publish never

      # Inspect what actually went in the box. The static publish config in
      # package.json was already correct when 0.1.0 shipped with a `github`
      # provider baked into its resources/app-update.yml — only an artifact-level
      # check catches that, and it is the single most expensive bug this project
      # has had (every 0.1.0 install is permanently un-updatable). Also verifies
      # installers are real binaries and, on Windows, that rcedit stamped our
      # icon instead of leaving the stock Electron atom.
      - name: Verify release artifacts (update feed, magic bytes, icon)
        shell: bash
        run: node scripts/check-release-artifacts.mjs apps/desktop/release

      # Fail loudly here rather than shipping a feed users can never read.
      - name: Verify update manifests exist
        shell: bash
        working-directory: Bliss-Work/apps/desktop/release
        run: |
          case "${{ runner.os }}" in
            Windows) EXPECT=latest.yml ;;
            macOS)   EXPECT=latest-mac.yml ;;
            Linux)   EXPECT=latest-linux.yml ;;
          esac
          if [ ! -f "$EXPECT" ]; then
            echo "::error::$EXPECT was not generated. Auto-update depends on it."
            echo "Check that apps/desktop/package.json still has a \`publish\` block —"
            echo "electron-builder only emits update manifests when one is configured."
            ls -la
            exit 1
          fi
          echo "--- $EXPECT ---"; cat "$EXPECT"

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          # latest*.yml and *.blockmap are part of the release, not incidental
          # build output: the manifests ARE the update feed, and the blockmaps
          # let electron-updater download only the changed bytes.
          #
          # upload-artifact resolves `path:` against $GITHUB_WORKSPACE (the
          # checkout root) regardless of any working-directory — it is a step
          # input, not a shell command — so these need the full prefix even
          # though the job default above covers every `run:` step.
          path: |
            Bliss-Work/apps/desktop/release/*.exe
            Bliss-Work/apps/desktop/release/*.dmg
            Bliss-Work/apps/desktop/release/*.AppImage
            Bliss-Work/apps/desktop/release/*.deb
            Bliss-Work/apps/desktop/release/*.zip
            Bliss-Work/apps/desktop/release/*.blockmap
            Bliss-Work/apps/desktop/release/latest*.yml
          if-no-files-found: ignore
          # Purely a hand-off to the "Sign Windows, checksum & deploy" job
          # later in this SAME run — nothing downloads it after that. These
          # installers are ~100-300MB each across 3 platforms, and 14 days of
          # them piling up across every push is what silently exhausted the
          # account's Actions storage quota (confirmed: "Artifact storage
          # quota has been hit" on 2026-09-02's run, ~31GB retained across
          # ~250 old artifacts) and made every "Upload installers" step fail,
          # taking the whole release down with it regardless of whether the
          # build itself succeeded.
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # Sign Windows (SSL.com eSigner — cross-platform, runs here on Linux), repair
  # the Windows update manifest, publish checksums, and deploy the signed set to
  # the VPS. Signing/deploy steps skip cleanly when their secrets are absent.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Sign Windows, checksum & deploy
    needs: [version, build]
    # `build` is fail-fast: false so a broken platform doesn't cancel the others
    # — but with a plain `needs:` this job is SKIPPED whenever any leg fails, so
    # one bad platform silently shipped NOTHING. That is what stranded /downloads
    # on the 0.1.1 build: the run went through the motions and never reached the
    # rsync, so the working platforms never published either.
    #
    # Each platform has its own update feed (latest.yml / latest-mac.yml /
    # latest-linux.yml), so publishing the platforms that DID build is safe: the
    # failed one keeps its previous manifest and its users simply stay where they
    # are. The "installers are real" and coverage checks below still refuse to
    # publish junk, and the summary names exactly which platforms shipped.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Surfaced from secrets so `if:` gates can test presence without exposing values.
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Collect installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      # SSL.com eSigner signs the .exe via its cloud HSM (no cert on disk).
      #
      # SECURITY TODO (blocking, before the first signed release): `@develop` is a
      # MUTABLE ref — whoever controls that branch controls a step that runs with
      # our signing credentials in scope. Replace it with a full commit SHA
      # (`sslcom/esigner-codesign@<40-char-sha>`) when signing is adopted. Inert
      # today only because the step is gated on ES_USERNAME being set.
      # Tracked in apps/desktop/SIGNING.md.
      - name: Sign Windows installer (SSL.com eSigner)
        if: env.ES_USERNAME != ''
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747 # develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/installers/BlissWork-windows-x64.exe
          override: "true"
          malware_block: "false"
          environment_name: PROD

      # Signing rewrote the .exe, so the sha512 electron-builder recorded on the
      # Windows runner now describes a file that no longer exists. electron-updater
      # verifies that hash post-download and would refuse to install every single
      # release. Recompute it against the signed binary.
      #
      # Unconditional: harmless when signing was skipped (it just recomputes the
      # same hash), and running it always means the signed and unsigned paths
      # can't diverge. latest-mac.yml / latest-linux.yml are untouched — those
      # binaries are never re-signed after packaging.
      - name: Regenerate the Windows update manifest
        run: |
          node Bliss-Work/scripts/regen-update-manifest.mjs \
            installers latest.yml BlissWork-windows-x64.exe

      # Which platforms actually made it here. With the `if:` above, a failed
      # platform no longer blocks the others — but that trade is only acceptable
      # if the partial release is STATED rather than passed off as complete.
      # Silence is what let a stale download page look healthy for a month.
      - name: Report platform coverage
        id: coverage
        working-directory: installers
        run: |
          shipped=""; missing=""
          check() { # $1 = label, $2 = glob
            # shellcheck disable=SC2086
            if compgen -G "$2" > /dev/null; then shipped="$shipped $1"; else missing="$missing $1"; fi
          }
          check windows 'BlissWork-windows-*.exe'
          check mac 'BlissWork-mac-*.dmg'
          check linux 'BlissWork-linux-*.AppImage'

          {
            echo "### Desktop release ${{ needs.version.outputs.version }}"
            echo ""
            echo "| Platform | Status |"
            echo "|---|---|"
            for p in windows mac linux; do
              case " $shipped " in *" $p "*) echo "| $p | ✅ shipped |";; *) echo "| $p | ❌ **build failed — previous version stays live** |";; esac
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$shipped" ]; then
            echo "::error::Every platform failed to build — there is nothing to publish."
            exit 1
          fi
          [ -n "$missing" ] && echo "::warning::Publishing a PARTIAL release. Failed platforms:$missing"
          echo "shipped=$shipped" >> "$GITHUB_OUTPUT"
          echo "Publishing:$shipped"

      # A real installer is tens of megabytes. Anything tiny is a placeholder, a
      # truncated upload, or an error page saved under the wrong name — and the
      # download page happily served 128-byte "placeholder" .dmg files for weeks
      # because nothing ever checked. Fail the release instead of publishing one.
      - name: Verify installers are real
        working-directory: installers
        run: |
          MIN_BYTES=$((5 * 1024 * 1024))
          bad=0
          # *.blockmap is a small (~100-200 KB) checksum manifest electron-builder
          # emits alongside each .zip/.dmg for delta updates — never itself an
          # installer, so it must not be held to the installer size floor.
          for f in BlissWork-*; do
            case "$f" in
              *.blockmap) continue ;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -lt "$MIN_BYTES" ]; then
              echo "::error file=$f::$f is only $size bytes — not a real installer"
              bad=1
            else
              printf '  ok  %-36s %s bytes\n' "$f" "$size"
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Generate SHA-256 checksums (over the SIGNED files)
        working-directory: installers
        run: |
          rm -f SHA256SUMS.txt
          sha256sum BlissWork-* > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Deploy to VPS
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_CMD="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"

          # Refuse a downgrade. scripts/next-desktop-version.mjs (the "Resolve
          # version" job above) derives the version purely by scanning
          # whatever latest*.yml is CURRENTLY live on $VPS_PATH — so if that
          # directory's history is ever lost between that job and this one, or
          # was already lost before this run started, this step would happily
          # overwrite a much newer live version with a lower one. electron-
          # updater then refuses to offer that "update" to anyone already
          # running the higher version, permanently freezing them until a
          # manual reinstall — this happened for real on 2026-09-08. Same
          # guard as scripts/publish-desktop.sh, for this path's own rsync.
          NEW_VERSION="${{ needs.version.outputs.version }}"
          LIVE_VERSION=$($SSH_CMD "$VPS_USER@$VPS_HOST" \
            "grep '^version:' $VPS_PATH/latest.yml 2>/dev/null | head -1" \
            | sed -E "s/version:[[:space:]]*['\"]?([0-9]+\.[0-9]+\.[0-9]+).*/\1/" || true)
          if [ -n "$LIVE_VERSION" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$NEW_VERSION" "$LIVE_VERSION" | sort -V | tail -1)
            if [ "$HIGHEST" = "$LIVE_VERSION" ] && [ "$NEW_VERSION" != "$LIVE_VERSION" ]; then
              echo "::error::refusing to deploy $NEW_VERSION — live feed is already at $LIVE_VERSION"
              exit 1
            fi
          fi

          # Installers first, manifests LAST. An app that polls mid-rsync then
          # reads the OLD manifest, which points at files that still exist —
          # rather than a new manifest pointing at a half-uploaded binary, which
          # would fail its hash check.
          rsync -avz --checksum -e "$SSH_CMD" --exclude='latest*.yml' \
            installers/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          rsync -avz --checksum -e "$SSH_CMD" --include='latest*.yml' --exclude='*' \
            installers/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          echo "Deployed ${{ needs.version.outputs.version }} to $VPS_USER@$VPS_HOST:$VPS_PATH"

      # A release that publishes NOTHING must not report success. Both the deploy
      # and the live-host verification below are gated on VPS_HOST, so with the
      # secret unset this workflow went green while shipping nothing at all —
      # which is how /downloads ended up hand-assembled and a month stale while
      # CI looked healthy the whole time.
      - name: Fail if a real release published nothing
        # `push` now covers both a tag push and a push to the production
        # branch — the only two triggers that mean "a real release", as
        # opposed to a workflow_dispatch dry run.
        if: env.VPS_HOST == '' && github.event_name == 'push'
        run: |
          echo "::error::VPS_HOST is not set, so this release deployed nothing."
          echo "Set the VPS_HOST / VPS_USER / VPS_PATH / VPS_SSH_KEY repository secrets."
          echo "Users download from the VPS — a build that never reaches it is not a release."
          exit 1

      # Everything above this point verifies CI's OWN artifacts. Nothing verified
      # that the live host actually serves them — which is how a 128-byte
      # placeholder .dmg sat on the download page for weeks. Check the real URLs
      # the website and the updater use, over the public internet, after upload.
      - name: Verify the live download host
        if: env.VPS_HOST != ''
        run: |
          set -euo pipefail
          BASE=https://communication.rnrtechs.com/downloads
          VERSION="${{ needs.version.outputs.version }}"
          fail=0

          # The updater feed must exist AND advertise the version we just shipped.
          # A stale-but-present latest.yml is the failure mode that looks fine.
          echo "--- $BASE/latest.yml ---"
          if ! curl -fsS "$BASE/latest.yml" | tee /tmp/latest.yml; then
            echo "::error::latest.yml is not reachable — auto-update is dead"
            fail=1
          elif ! grep -q "version: $VERSION" /tmp/latest.yml; then
            echo "::error::latest.yml does not advertise $VERSION"
            fail=1
          fi

          # Same treatment for the other two feeds: reachable is not enough, they
          # must advertise THIS version. All three disagreeing is what makes one
          # platform silently stop receiving updates.
          for m in latest-mac.yml latest-linux.yml; do
            echo "--- $BASE/$m ---"
            if ! curl -fsS "$BASE/$m" | tee "/tmp/$m"; then
              echo "::error::$m is not reachable"; fail=1
            elif ! grep -q "version: $VERSION" "/tmp/$m"; then
              echo "::error::$m does not advertise $VERSION"; fail=1
            fi
          done

          # electron-updater downloads the ZIP on macOS, never the dmg — the dmg
          # is only what the website hands a human. A missing zip means mac
          # auto-update 404s exactly the way Windows already did, so assert the
          # manifest names both architectures.
          for arch in arm64 x64; do
            grep -q "BlissWork-mac-$arch.zip" /tmp/latest-mac.yml \
              || { echo "::error::latest-mac.yml does not list BlissWork-mac-$arch.zip — mac auto-update will 404"; fail=1; }
          done

          # The site's "Verify checksums" link (DownloadProvider.tsx) points here.
          curl -fsS "$BASE/SHA256SUMS.txt" >/dev/null \
            || { echo "::error::SHA256SUMS.txt is not reachable"; fail=1; }

          # Content-Length over HTTP, so this catches a truncated upload or a
          # placeholder that never got overwritten — not just a local stat().
          MIN_BYTES=$((5 * 1024 * 1024))
          for f in BlissWork-windows-x64.exe \
                   BlissWork-mac-arm64.dmg BlissWork-mac-x64.dmg \
                   BlissWork-mac-arm64.zip BlissWork-mac-x64.zip \
                   BlissWork-linux-x64.AppImage BlissWork-linux-x64.deb; do
            len=$(curl -fsSI "$BASE/$f" \
                  | awk 'tolower($1)=="content-length:"{print $2+0}' | tail -1)
            if [ "${len:-0}" -lt "$MIN_BYTES" ]; then
              echo "::error::$f serves ${len:-0} bytes — not a real installer"
              fail=1
            else
              printf '  ok  %-34s %s bytes\n' "$f" "$len"
            fi
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "Live host is serving $VERSION."

      # Everything above checks communication.rnrtechs.com. The marketing site is
      # a SECOND download surface on a different host, with its own copy of the
      # filename list — so it can serve different (or missing) files while the
      # web app looks perfectly healthy. Check both hosts agree, byte for byte.
      - name: Verify the website and the web app offer the same installers
        if: env.VPS_HOST != ''
        run: node Bliss-Work/scripts/check-download-links.mjs --live

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Upload signed set as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blisswork-installers-signed
          path: installers/*
          if-no-files-found: warn
          # Kept a few days (not 14) for manual recovery if "Deploy to VPS"
          # above fails — see scripts/publish-desktop.sh's own header on that
          # path — without letting it pile up and re-exhaust the account's
          # Actions storage quota the way the per-OS artifact above did.
          retention-days: 3
