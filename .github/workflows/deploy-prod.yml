name: Deploy Production

# ── Why this file lives at the repository root ───────────────────────────────
# Same reason as release.yml: GitHub Actions only reads `.github/workflows/` at
# the true repo root, and this monorepo's root holds Bliss-Work/ and
# Bliss-Website/ as siblings. This file used to sit in
# Bliss-Work/.github/workflows/ — one directory too deep — so it had never
# fired even once. It needs no `working-directory:` fix beyond that: it never
# checks out the repo locally, it only SSHes into the VPS and runs `make
# prod-deploy` against whatever is already on disk at $VPS_REPO_DIR.
#
# Auto-deploys the web app + backend to the production VPS after CI passes on
# `Prod-Sid`. Push to Prod-Sid → CI runs → this fires → the site is live.
#
# All the logic lives in the Makefile's `prod-deploy` target (and the targets
# it's built from — prod-guard, prod-fetch, prod-health, prod-smoke,
# prod-rollback, prod-prune), in the repo, so a deploy is reviewable in a PR
# and reproducible by hand when GitHub is down. This workflow only carries the
# SSH key and calls it.
#
# `workflow_run` rather than a job inside ci.yml: this keeps the deploy out of
# the PR checks entirely (workflow_run never fires for pull_request events) and
# means a red CI run leaves the deploy job skipped, not failed.
#
# ── Repository secrets ───────────────────────────────────────────────────────
#   VPS_HOST     production host (also the download host; see release.yml)
#   VPS_USER     ssh user, e.g. ubuntu
#   VPS_SSH_KEY  private key whose public half is in that user's authorized_keys
#   VPS_REPO_DIR optional; defaults to /home/ubuntu/BlissWork/Bliss-Work
#
# With VPS_HOST unset the job exits cleanly without deploying, matching the
# convention in release.yml — the pipeline is safe to merge before the secrets
# exist. See docs/DEPLOY.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [Prod-Sid]
  workflow_dispatch:

# Never cancel a deploy in flight: a half-applied rollout is worse than a queued
# one. Later runs wait rather than interrupting.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual dispatch always runs; the CI-triggered path only on a green run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_REPO_DIR: ${{ secrets.VPS_REPO_DIR || '/home/ubuntu/BlissWork/Bliss-Work' }}
    steps:
      - name: Report what triggered this
        run: |
          echo "event:  ${{ github.event_name }}"
          echo "commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -z "$VPS_HOST" ]; then
            echo "::warning::VPS_HOST is not set — skipping deploy. See docs/DEPLOY.md."
          fi

      - name: Configure SSH
        if: env.VPS_HOST != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key so StrictHostKeyChecking=yes below is meaningful.
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: env.VPS_HOST != ''
        run: |
          # -T: no pty, so `make`'s output streams into the job log verbatim.
          # prod-deploy does its own locking, guarding and rollback.
          ssh -T -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "make -C '$VPS_REPO_DIR' prod-deploy"

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
