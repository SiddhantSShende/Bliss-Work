name: CodeQL

# Static application security testing (SAST) across all three languages.
# Buildless extraction (build-mode: none) so the multi-module Go layout and the
# Python/JS sources are scanned without a custom per-service build.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # security-extended adds higher-recall security queries beyond default.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
