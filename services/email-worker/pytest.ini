[pytest]
# Pure-logic unit tests for email-worker. They need no live SMTP/Kafka/DB/Redis:
# tests/conftest.py puts the service root on sys.path and (only when a runtime
# dep is genuinely missing) installs an inert stub so collection works locally.
# In CI, requirements.txt is installed and the real modules are used.
testpaths = tests
python_files = test_*.py
addopts = -q
