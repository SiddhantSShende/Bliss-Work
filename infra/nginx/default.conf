server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large desktop-installer downloads to stream through unbuffered.
    client_max_body_size 0;

    # ── Desktop app installers ───────────────────────────────────────────────
    # Served straight from our own VPS (NOT GitHub) so the web app's "Get the
    # App" button downloads through our server. The installer files are
    # bind-mounted read-only at /srv/downloads (see docker-compose.prod.yml).
    # `^~` makes this prefix win over the asset-regex location below, and having
    # its own block means a missing installer 404s here instead of falling back
    # to the SPA shell (which would hand the user an HTML file named *.exe).
    location ^~ /downloads/ {
        alias /srv/downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
