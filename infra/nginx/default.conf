server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
