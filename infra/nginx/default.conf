server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large desktop-installer downloads to stream through unbuffered.
    client_max_body_size 0;

    # ── Desktop app installers ───────────────────────────────────────────────
    # Served straight from our own VPS (NOT GitHub) so the web app's "Get the
    # App" button downloads through our server. The installer files are
    # bind-mounted read-only at /srv/downloads (see docker-compose.prod.yml).
    # `^~` makes this prefix win over the asset-regex location below, and having
    # its own block means a missing installer 404s here instead of falling back
    # to the SPA shell (which would hand the user an HTML file named *.exe).
    location ^~ /downloads/ {
        alias /srv/downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        autoindex off;
    }

    # ── electron-updater feed manifests ──────────────────────────────────────
    # The desktop app polls these on every launch to decide whether a newer
    # version exists (apps/desktop/src/main/updater.ts). The 1-hour cache above
    # is right for installers — they're immutable per version and re-fetching
    # 110 MB is the expensive part — but on the manifest it would keep every
    # user up to an hour behind a release, and any proxy in between longer.
    #
    # These are `=` exact matches on purpose: nginx evaluates exact locations
    # before prefix ones, so they take precedence over `^~ /downloads/` above.
    # A regex location could not — `^~` suppresses regex matching entirely.
    # The set is fixed (one per platform), so listing them is exhaustive.
    location = /downloads/latest.yml {
        alias /srv/downloads/latest.yml;
        default_type text/yaml;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /downloads/latest-mac.yml {
        alias /srv/downloads/latest-mac.yml;
        default_type text/yaml;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /downloads/latest-linux.yml {
        alias /srv/downloads/latest-linux.yml;
        default_type text/yaml;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the SPA entry point: it maps to the CURRENT content-hashed
    # asset chunks. It must NEVER be cached, or after a deploy a browser keeps
    # requesting the OLD chunk hashes (which no longer exist → 404 → broken app,
    # failed lazy imports like the xlsx export, cascading WS/token errors). Serve
    # it with no-cache so the browser always revalidates (cheap 304 via ETag) and
    # picks up new chunk hashes immediately. The hashed assets below stay
    # immutable — a new deploy just emits new filenames. The try_files fallback
    # above internally redirects to /index.html, so this exact-match block covers
    # every SPA route too.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
