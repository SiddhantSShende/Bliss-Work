# ─────────────────────────────────────────────────────────────────────────────
# Coraza base engine configuration for the Task-Board edge WAF.
# Derived from the upstream `coraza.conf-recommended`. Tune for this app, then
# flip SecRuleEngine to On.
# ─────────────────────────────────────────────────────────────────────────────

# START IN DETECTION-ONLY. Run real traffic through it, watch the logs for false
# positives, tune (see rules/99-tuning.conf), THEN set this to `On` to BLOCK.
# Values: On | DetectionOnly | Off
SecRuleEngine DetectionOnly

# Allow the WAF to inspect request bodies (JSON APIs + form posts).
SecRequestBodyAccess On
SecRequestBodyLimit 13107200          # 12.5 MB hard cap
SecRequestBodyNoFilesLimit 131072     # 128 KB for non-file bodies
SecRequestBodyLimitAction Reject

# Response-body inspection is OFF by default (cost + these are API/SPA responses).
SecResponseBodyAccess Off

# Treat application/json as inspectable so CRS can see API payloads.
SecRule REQUEST_HEADERS:Content-Type "(?:application(?:/soap\+|/)|text/)xml" \
  "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "application/json" \
  "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Fail closed if a body can't be parsed (malformed multipart, etc.).
SecRule REQBODY_ERROR "!@eq 0" \
  "id:200002,phase:2,t:none,deny,status:400,log,msg:'Failed to parse request body.'"

# Default action: log + (when SecRuleEngine On) block in phase 2.
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Audit log to stderr so it lands in `docker compose logs caddy`.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr

# Unicode handling.
SecUnicodeMapFile unicode.mapping 20127
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000
