# ─────────────────────────────────────────────────────────────────────────────
# Coraza base engine configuration for the Task-Board edge WAF.
# Derived from the upstream `coraza.conf-recommended`. SecRuleEngine is On
# (blocking) — add exclusions in rules/99-tuning.conf for any false positives.
# ─────────────────────────────────────────────────────────────────────────────

# BLOCKING. Matched OWASP-CRS rules (SQLi/XSS/traversal/protocol anomalies) are
# REJECTED. Watch the logs and add exclusions in rules/99-tuning.conf for any
# false positives; set back to DetectionOnly for a monitor-only rollback.
# Values: On | DetectionOnly | Off
SecRuleEngine On

# Allow the WAF to inspect request bodies (JSON APIs + form posts).
# NOTE: SecLang has NO inline comments — a trailing `# …` is parsed as part of
# the value, so every comment must be on its own line.
SecRequestBodyAccess On
# 12.5 MB hard cap on the request body.
SecRequestBodyLimit 13107200
# 128 KB cap for non-file (form/JSON) bodies.
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response-body inspection is OFF by default (cost + these are API/SPA responses).
SecResponseBodyAccess Off

# Treat application/json as inspectable so CRS can see API payloads.
SecRule REQUEST_HEADERS:Content-Type "(?:application(?:/soap\+|/)|text/)xml" \
  "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "application/json" \
  "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Fail closed if a body can't be parsed (malformed multipart, etc.).
SecRule REQBODY_ERROR "!@eq 0" \
  "id:200002,phase:2,t:none,deny,status:400,log,msg:'Failed to parse request body.'"

# NOTE: SecDefaultAction is intentionally NOT set here — the OWASP CRS sets it
# in REQUEST-901-INITIALIZATION, and coraza forbids defining it twice per phase.

# Audit log to stderr so it lands in `docker compose logs caddy`.
SecAuditEngine RelevantOnly
# Relevant = any 5xx, or any 4xx EXCEPT 404. coraza uses Go RE2 (no lookahead),
# so this is written without the `(?!404)` negative-lookahead form.
SecAuditLogRelevantStatus "^(5|4(0[0-35-9]|[1-9]))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr

# NOTE: SecUnicodeMapFile and SecPcreMatchLimit* are ModSecurity/PCRE-only
# directives that coraza (Go RE2) does not implement — omitted intentionally.
