# ─────────────────────────────────────────────────────────────────────────────
# OWASP CRS setup / tuning for the Task-Board edge.
# A trimmed `crs-setup.conf.example`. `load_owasp_crs` (in Caddyfile.waf) loads
# the CRS rule files themselves; this file only sets the CRS knobs that must be
# defined BEFORE those rules run.
# ─────────────────────────────────────────────────────────────────────────────

# ── Anomaly-scoring mode (CRS default & recommended) ──────────────────────────
# Each matching rule adds to an anomaly score; the request is blocked when the
# score crosses the threshold. Lower threshold = stricter. Start permissive
# while in DetectionOnly, then tighten.
SecAction \
  "id:900110,phase:1,pass,nolog,t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# ── Paranoia level ────────────────────────────────────────────────────────────
# PL1 = fewest false positives (recommended starting point). Raise to 2 once the
# baseline is clean and you want deeper coverage.
SecAction \
  "id:900000,phase:1,pass,nolog,t:none,\
   setvar:tx.blocking_paranoia_level=1,\
   setvar:tx.detection_paranoia_level=1"

# ── Sampling / enforcement ────────────────────────────────────────────────────
SecAction \
  "id:900400,phase:1,pass,nolog,t:none,\
   setvar:tx.sampling_percentage=100"

# ── Allowed HTTP methods / content types for a JSON API + SPA ─────────────────
SecAction \
  "id:900200,phase:1,pass,nolog,t:none,\
   setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"
SecAction \
  "id:900220,phase:1,pass,nolog,t:none,\
   setvar:'tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data| |text/plain|'"

# ── Early blocking: stop on the first rule that already exceeds threshold ──────
SecAction \
  "id:900120,phase:1,pass,nolog,t:none,\
   setvar:tx.early_blocking=1"
