{{/*
One Deployment per entry in .Values.services. Each pod runs a single service
container, pulls non-secret env from the ConfigMap and secret env from the
Secret, and (for HTTP services) gets liveness + readiness probes.
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskboard.svcLabels" (dict "root" $root "svc" $name) | nindent 4 }}
spec:
  {{- /* When the HPA owns this service, omit replicas so Helm upgrades don't
         fight the autoscaler by resetting the count. */}}
  {{- if not $svc.hpa.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "taskboard.svcLabels" (dict "root" $root "svc" $name) | nindent 8 }}
      annotations:
        # Roll pods when env content changes so config/secret edits take effect.
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- if not $root.Values.existingSecret }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
        {{- end }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- if $root.Values.topologySpread.enabled }}
      topologySpreadConstraints:
        # Spread replicas across zones first ...
        - maxSkew: {{ $root.Values.topologySpread.maxSkew }}
          topologyKey: {{ $root.Values.topologySpread.zoneTopologyKey }}
          whenUnsatisfiable: {{ $root.Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" $name) | nindent 14 }}
        # ... then across nodes within a zone.
        - maxSkew: {{ $root.Values.topologySpread.maxSkew }}
          topologyKey: {{ $root.Values.topologySpread.nodeTopologyKey }}
          whenUnsatisfiable: {{ $root.Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" $name) | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "taskboard.image" (dict "root" $root "image" $svc.image) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- if and $svc.http $svc.port }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "taskboard.configMapName" $root }}
            - secretRef:
                name: {{ include "taskboard.secretName" $root }}
          {{- if and $svc.http $svc.port }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/healthz" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $svc.readyPath | default "/readyz" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # Allow up to ~60s for a cold start (DB migrations / JWKS warm-up)
            # before liveness begins, so a slow boot is not killed.
            httpGet:
              path: {{ $svc.readyPath | default "/readyz" }}
              port: http
            periodSeconds: 5
            failureThreshold: 12
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: {{ $svc.readOnlyRootFilesystem | default false }}
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # A writable scratch dir so readOnlyRootFilesystem pods still have /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if and (eq $name "auth-svc") $root.Values.signingKeys.enabled }}
            - name: signing-keys
              mountPath: {{ $root.Values.signingKeys.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and (eq $name "auth-svc") $root.Values.signingKeys.enabled }}
        - name: signing-keys
          secret:
            secretName: {{ include "taskboard.keysSecretName" $root }}
            defaultMode: 0400
        {{- end }}
{{- end }}
