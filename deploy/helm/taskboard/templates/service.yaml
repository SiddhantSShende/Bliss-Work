{{/*
One ClusterIP Service per HTTP service. email-worker (http:false / port:null)
is skipped — it has no listener.
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.http $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskboard.svcLabels" (dict "root" $root "svc" $name) | nindent 4 }}
spec:
  type: ClusterIP
  {{- if eq $name "ws-gateway" }}
  # Sticky sessions: pin a client to one ws-gateway pod for the life of its
  # WebSocket so reconnect/backpressure state stays local. ClientIP affinity is
  # a coarse, in-cluster fallback — PREFERRED is an L7 ingress/mesh consistent
  # hash on the authenticated userId (e.g. nginx `hash $http_x_user_id`, Envoy
  # ring-hash), which survives NAT/shared-egress-IP clients that ClientIP can't
  # distinguish. See ingress.yaml for the websocket upgrade config.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  {{- end }}
  selector:
    {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
