{{/*
NetworkPolicy — PER-SERVICE LEAST PRIVILEGE.

Strategy:
  1. A default-deny baseline for BOTH ingress and egress across every pod in the
     release (empty podSelector). Nothing flows until a narrow allow re-opens it.
  2. Cluster-wide allows that apply to all release pods:
       - DNS egress (UDP/TCP 53) to kube-dns.
       - Egress to the EXTERNAL datastores (Postgres/Redis/Kafka/SMTP) by CIDR.
       - Egress to the in-cluster OpenTelemetry collector (OTLP gRPC).
       - Egress to auth-svc:8001 for JWKS (every service verifies JWTs).
       - Egress for the two real internal HTTP hops (→ messaging-svc).
  3. Per-HTTP-service ingress allowlists:
       - the ingress controller (configurable namespace/pod selector),
       - Prometheus scraping /metrics,
       - the in-namespace callers that actually reach this service.
     email-worker gets NO ingress policy — it runs no server.

The intra-cluster traffic graph this encodes:
  ingress-controller → auth/task/notification/messaging/ws-gateway (public APIs)
  ws-gateway         → messaging-svc:8004   (internal)
  task-svc           → messaging-svc:8004   (internal)
  email-worker       → auth-svc:8001        (internal + JWKS)
  ALL services       → auth-svc:8001        (JWKS .well-known)
  Prometheus         → every HTTP service   (/metrics)

REQUIRES a CNI that ENFORCES NetworkPolicy (Calico, Cilium, Antrea, ...). On a
CNI without enforcement these objects are silently inert.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- $np := .Values.networkPolicy -}}
# ─────────────────────────────────────────────────────────────────────────────
# 1. Default-deny baseline — applies to EVERY pod in the release. With no
#    ingress/egress rules and both policyTypes listed, all traffic is denied
#    until a more specific allow-policy below re-opens it. NetworkPolicies are
#    additive, so these never block what the allows permit.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskboard.fullname" . }}-default-deny
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  podSelector:
    # Scope to THIS release's pods (not every pod sharing the namespace).
    matchLabels:
      {{- include "taskboard.commonSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress/egress rules => deny all in both directions for these pods.
{{- if .Values.networkPolicy.allowDNS }}
---
# ─────────────────────────────────────────────────────────────────────────────
# 2a. DNS egress for all release pods. Without this, default-deny-egress breaks
#     name resolution (and therefore every outbound connection).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskboard.fullname" . }}-allow-dns-egress
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskboard.commonSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
---
# ─────────────────────────────────────────────────────────────────────────────
# 2b. Egress to the EXTERNAL datastores (Postgres / Redis / Kafka / SMTP).
#     These live OUTSIDE the cluster, so they are matched by CIDR + port — a pod
#     selector cannot target them. Applies to all release pods (any service may
#     hit Postgres/Redis; email-worker hits Kafka+SMTP; etc.).
#     SECURITY: the default CIDR is 0.0.0.0/0 so the chart works unconfigured —
#     pin networkPolicy.egress.<name>.cidr to your real managed-service ranges.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskboard.fullname" . }}-allow-datastore-egress
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskboard.commonSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- range $key := (list "postgres" "redis" "kafka" "smtp") }}
    {{- $store := index $np.egress $key }}
    {{- if $store.enabled }}
    # {{ $key }} (external)
    - to:
        - ipBlock:
            cidr: {{ $store.cidr | quote }}
      ports:
        {{- range $p := $store.ports }}
        - protocol: TCP
          port: {{ $p }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- if $np.otelCollector.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# 2c. Egress to the OpenTelemetry collector (OTLP gRPC). In-cluster by default,
#     matched by namespace/pod selector + port. For an out-of-cluster collector,
#     replace the `to` selector with an ipBlock like the datastores above.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskboard.fullname" . }}-allow-otel-egress
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskboard.commonSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml $np.otelCollector.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.otelCollector.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ $np.otelCollector.port }}
{{- end }}
---
# ─────────────────────────────────────────────────────────────────────────────
# 2d. Internal service-to-service EGRESS (the real hops in the traffic graph).
#     Kept as one egress policy attached to all release pods; the in-namespace
#     ingress allows on the target services (section 3) are what actually gate
#     these — both ends must permit the flow.
#       • all services → auth-svc:8001        (JWKS verification)
#       • ws-gateway   → messaging-svc:8004    (internal API)
#       • task-svc     → messaging-svc:8004    (internal API)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskboard.fullname" . }}-allow-internal-egress
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskboard.commonSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # → auth-svc JWKS (every service verifies JWTs against /.well-known/jwks.json)
    - to:
        - podSelector:
            matchLabels:
              {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" "auth-svc") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ (index $root.Values.services "auth-svc").port }}
    # → messaging-svc internal API (callers: ws-gateway, task-svc)
    - to:
        - podSelector:
            matchLabels:
              {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" "messaging-svc") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ (index $root.Values.services "messaging-svc").port }}
# ─────────────────────────────────────────────────────────────────────────────
# 3. Per-HTTP-service INGRESS allowlists. email-worker (http:false) is skipped —
#    it has no listener, so its default-deny ingress stays fully closed.
#    For each HTTP service we allow:
#      - the ingress controller (public API surface),
#      - Prometheus → /metrics,
#      - the specific in-namespace callers of that service.
# ─────────────────────────────────────────────────────────────────────────────
{{- range $name, $svc := $root.Values.services }}
{{- if and $svc.http $svc.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskboard.fullname" $root }}-allow-ingress-{{ $name }}
  labels:
    {{- include "taskboard.svcLabels" (dict "root" $root "svc" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" $name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # ── Ingress controller → this service's HTTP port (public API / WS upgrade).
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.ingressController.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ $svc.port }}
    {{- if $np.monitoring.enabled }}
    # ── Prometheus → /metrics on the HTTP port.
    - from:
        - namespaceSelector:
            {{- toYaml $np.monitoring.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.monitoring.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ $svc.port }}
    {{- end }}
    {{- /* In-namespace service-to-service callers of THIS service. */}}
    {{- if eq $name "auth-svc" }}
    # ── JWKS: every service in the release fetches auth-svc/.well-known/jwks.json,
    #    and email-worker calls auth-svc internal APIs. Allow any release pod.
    - from:
        - podSelector:
            matchLabels:
              {{- include "taskboard.commonSelectorLabels" $root | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $svc.port }}
    {{- else if eq $name "messaging-svc" }}
    # ── messaging-svc internal API callers: ws-gateway and task-svc only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" "ws-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" "task-svc") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $svc.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
