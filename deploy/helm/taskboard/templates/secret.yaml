{{/*
Secret environment (DB URLs, REDIS_URL, TB_INTERNAL_TOKEN, SMTP creds).
Mounted via envFrom in each Deployment.

PRODUCTION GUIDANCE — do NOT ship real secrets in values.yaml:
  * Set `existingSecret` to a Secret managed by the External Secrets Operator
    (syncs from AWS/GCP Secrets Manager, Vault, etc.) or by sealed-secrets, and
    this template is skipped entirely.
  * Or use a CSI secrets-store driver to mount provider secrets as a Secret.
The keys below MUST exist in whichever Secret you point services at.
*/}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.signingKeys.enabled (not .Values.signingKeys.existingKeysSecret) }}
---
{{/*
Ed25519 signing keys for auth-svc, mounted read-only at /keys. In prod, set
signingKeys.existingKeysSecret to an externally-managed Secret and leave
signingKeys.data empty so this is skipped.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.keysSecretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.signingKeys.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
