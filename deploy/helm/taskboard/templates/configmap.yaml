{{/*
Non-secret environment shared by every service. Mounted via envFrom in each
Deployment. Only put NON-sensitive values here — anything secret belongs in
templates/secret.yaml (or an external secret store).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.configMapName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
