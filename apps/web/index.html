<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy (defense-in-depth; message content is rendered as
      text, never via dangerouslySetInnerHTML). script-src 'self' blocks injected
      inline scripts. style-src allows 'unsafe-inline' because framer-motion /
      sonner set inline style attributes. connect-src permits the API/WS origins:
      https/wss in production and http/ws localhost in dev. object-src 'none' and
      frame-ancestors 'none' close clickjacking / plugin vectors.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BlissWork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
