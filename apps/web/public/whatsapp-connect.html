<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect WhatsApp Business — BlissWork</title>
    <!--
      A DELIBERATELY SEPARATE PAGE, not part of the app bundle.

      Meta's Embedded Signup needs their JavaScript SDK from connect.facebook.net.
      Loading that into the SPA would mean relaxing `script-src 'self'` on the
      authenticated origin — handing a third-party script full DOM access to
      every screen, including message content, for the sake of one button.

      So the SDK is quarantined here: a page with no session, no API access and
      nothing on it but the signup popup. It hands the resulting code back to the
      opener via postMessage, and the app — which does hold the session — is what
      calls our server. The main app's CSP is untouched; only this path gets the
      relaxed header (see infra/caddy/Caddyfile).

      The CSP below is this page's own, and is deliberately tight: Meta's origins
      and nothing else. No connect-src to our own API, because this page never
      talks to it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' https://connect.facebook.net; style-src 'unsafe-inline'; img-src 'self' data: https://*.facebook.com; connect-src https://graph.facebook.com https://*.facebook.com; frame-src https://www.facebook.com https://web.facebook.com; base-uri 'none'; form-action 'none'"
    />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fff; color: #1b1630;
      }
      @media (prefers-color-scheme: dark) { body { background: #17141f; color: #f2f0f7; } }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.05rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; opacity: .75; }
      button {
        font: inherit; font-weight: 600; cursor: pointer;
        padding: .6rem 1.1rem; border: 0; border-radius: .75rem;
        background: #25d366; color: #06281a;
      }
      button[disabled] { opacity: .5; cursor: default; }
      .err { color: #c0392b; margin-top: 1rem; }
      @media (prefers-color-scheme: dark) { .err { color: #ff8a80; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect your WhatsApp Business account</h1>
      <p id="sub">Sign in with the Meta account that owns your WhatsApp Business number.</p>
      <button id="go" disabled>Continue with WhatsApp</button>
      <div class="err" id="err" role="alert"></div>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var appId = params.get("appId") || "";
        var configId = params.get("configId") || "";
        var version = params.get("v") || "v21.0";
        var go = document.getElementById("go");
        var err = document.getElementById("err");

        // The opener told us where it lives; only ever post back to that exact
        // origin, and only if it is THIS origin. Without both checks a page
        // opened from anywhere could harvest the signup code.
        var parentOrigin = location.origin;

        function fail(message) {
          err.textContent = message;
          go.disabled = false;
        }

        function finish(payload) {
          if (!window.opener) return fail("This window was opened without a parent. Close it and try again from BlissWork.");
          window.opener.postMessage({ source: "blisswork-whatsapp", ...payload }, parentOrigin);
          window.close();
        }

        if (!appId || !configId) {
          fail("Missing signup configuration. Close this window and try again.");
          return;
        }

        // Meta posts the selected WABA / phone number as a window message during
        // the flow; the code itself comes back from FB.login. We need both, and
        // they arrive separately.
        var sessionInfo = {};
        window.addEventListener("message", function (e) {
          if (e.origin !== "https://www.facebook.com" && e.origin !== "https://web.facebook.com") return;
          try {
            var data = JSON.parse(e.data);
            if (data.type !== "WA_EMBEDDED_SIGNUP") return;
            if (data.event === "FINISH" || data.event === "FINISH_ONLY_WABA") {
              sessionInfo = data.data || {};
            } else if (data.event === "CANCEL") {
              fail("Signup was cancelled.");
            } else if (data.event === "ERROR") {
              fail((data.data && data.data.error_message) || "WhatsApp signup failed.");
            }
          } catch (_) {
            /* Meta also posts non-JSON messages; ignore them. */
          }
        });

        window.fbAsyncInit = function () {
          FB.init({ appId: appId, autoLogAppEvents: true, xfbml: false, version: version });
          go.disabled = false;
        };

        var s = document.createElement("script");
        s.src = "https://connect.facebook.net/en_US/sdk.js";
        s.async = true;
        s.defer = true;
        s.crossOrigin = "anonymous";
        s.onerror = function () { fail("Couldn't load WhatsApp signup. Check your connection and try again."); };
        document.head.appendChild(s);

        go.addEventListener("click", function () {
          err.textContent = "";
          go.disabled = true;
          FB.login(
            function (response) {
              var code = response && response.authResponse && response.authResponse.code;
              if (!code) return fail("Signup didn't complete. Please try again.");
              finish({
                code: code,
                wabaId: sessionInfo.waba_id || "",
                phoneNumberId: sessionInfo.phone_number_id || "",
              });
            },
            {
              config_id: configId,
              // Ask for a CODE, not an access token: the token exchange happens
              // server-side with our app secret, so no long-lived credential is
              // ever exposed to a browser.
              response_type: "code",
              override_default_response_type: true,
              extras: { setup: {}, featureType: "", sessionInfoVersion: "3" },
            }
          );
        });
      })();
    </script>
  </body>
</html>
