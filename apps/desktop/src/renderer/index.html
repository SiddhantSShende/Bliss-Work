<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy — kept at PARITY with apps/web/index.html, which
      was the stricter of the two. This copy previously omitted object-src,
      base-uri, form-action and font-src, making the desktop shell the weaker
      target of the pair despite running with more local privilege.

      connect-src stays NARROWER than the web app's on purpose: a packaged
      desktop build only ever talks to the hosted backend (or localhost in dev),
      so it names those origins explicitly rather than allowing https:/wss: at
      large. blob: is in img-src for locally previewed file transfers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://communication.rnrtechs.com; font-src 'self' data:; connect-src 'self' https://communication.rnrtechs.com wss://communication.rnrtechs.com http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BlissWork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
