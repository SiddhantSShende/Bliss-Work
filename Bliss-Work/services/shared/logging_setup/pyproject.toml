[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-logging-setup"
version = "0.1.0"
description = "structlog → stdout JSON bootstrap, shared across this repo's Python services."
requires-python = ">=3.13"
dependencies = ["structlog"]

[tool.setuptools]
py-modules = ["shared_logging_setup"]
