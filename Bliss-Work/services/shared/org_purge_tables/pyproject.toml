[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "org-purge-tables"
version = "0.1.0"
description = "Shared org.deleted table-wipe loop for this repo's Python services."
requires-python = ">=3.13"
dependencies = ["sqlalchemy"]

[tool.setuptools]
py-modules = ["org_purge_tables"]
