[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience"
version = "0.1.0"
description = "Shared retry/circuit-breaker helpers for this repo's Python services' cross-service HTTP calls."
requires-python = ">=3.13"
dependencies = ["httpx"]

[tool.setuptools]
py-modules = ["resilience"]
