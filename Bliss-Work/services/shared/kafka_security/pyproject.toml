[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-security"
version = "0.1.0"
description = "Kafka SASL/TLS config from the environment, shared across this repo's Python services."
requires-python = ">=3.13"

[tool.setuptools]
py-modules = ["kafka_security"]
