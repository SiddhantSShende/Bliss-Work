[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prune-events"
version = "0.1.0"
description = "Batched-delete retention runner for event-plumbing tables, shared across this repo's Python services."
requires-python = ">=3.13"
dependencies = ["sqlalchemy"]

[tool.setuptools]
py-modules = ["prune_events"]
