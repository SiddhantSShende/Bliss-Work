# ─────────────────────────────────────────────────────────────────────────────
# Task-Board Helm values — cloud-agnostic.
#
# Postgres, Redis and Kafka are NOT part of this chart. They are expected to be
# provided externally (a managed cloud service such as RDS / ElastiCache / MSK,
# or an in-cluster operator such as CloudNativePG / Strimzi). You wire them in
# via the `env` and `secrets` blocks below.
#
# SECRETS: Do NOT commit real secret values to this file. The `secrets` map here
# exists only so the chart renders and for throwaway dev clusters. In production,
# leave `secrets` empty and source `secretName` from an externally-managed Secret
# (External Secrets Operator, sealed-secrets, or a CSI driver). See secret.yaml.
# ─────────────────────────────────────────────────────────────────────────────

global:
  # Container image registry + tag applied to every service whose `image`
  # in the `services` map below is a bare repo/path (no registry, no tag).
  image:
    registry: ghcr.io/your-org/task-board
    tag: "0.1.0"
  imagePullPolicy: IfNotPresent
  # Image pull secrets (private registry). Names of pre-existing Secrets of type
  # kubernetes.io/dockerconfigjson.
  imagePullSecrets: []
  # e.g. - name: ghcr-pull-secret

# Namespace is intentionally NOT set here — install with `helm -n <ns>` so the
# same chart can target dev/stage/prod namespaces without edits.

# Common pod-level security context (defense in depth; container-level context
# is in deployment.yaml). All processes run as a non-root user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Spread replicas across availability zones (and then nodes) for HA. Honored by
# templates/deployment.yaml via topologySpreadConstraints.
topologySpread:
  enabled: true
  # ScheduleAnyway keeps the workload schedulable on a smaller / single-zone
  # cluster; switch to DoNotSchedule once you have >=2 well-stocked zones.
  whenUnsatisfiable: ScheduleAnyway
  maxSkew: 1
  zoneTopologyKey: topology.kubernetes.io/zone
  nodeTopologyKey: kubernetes.io/hostname

# ─────────────────────────────────────────────────────────────────────────────
# Per-service definitions. Templates `range` over this map.
#
#   image       repo/path (registry+tag from global.image are prepended unless
#               the value already contains a registry host or a tag).
#   port        container/Service port, or null for a service with no HTTP
#               listener (email-worker is a pure Kafka consumer).
#   http        whether the service serves HTTP. Drives Service / HPA / Ingress /
#               PDB / probes. email-worker is http:false.
#   replicas    baseline replica count (HPA overrides at runtime when enabled).
#   hpa         autoscaling bounds + CPU target %. enabled:false for workloads
#               you scale manually (e.g. a partition-bound consumer).
#   resources   requests/limits. requests must be set for HPA CPU% to be meaningful.
#   healthPath  liveness probe path.   readyPath   readiness probe path.
#   readOnlyRootFilesystem  per-service override (see note on auth-svc below).
# ─────────────────────────────────────────────────────────────────────────────
services:
  auth-svc:
    image: auth-svc
    port: 8001
    http: true
    replicas: 2
    hpa:
      enabled: true
      min: 2
      max: 6
      cpu: 70
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
    healthPath: /healthz
    readyPath: /readyz
    # auth-svc mounts signing keys read-only; it does not write to its own FS.
    readOnlyRootFilesystem: true

  task-svc:
    image: task-svc
    port: 8002
    http: true
    replicas: 2
    hpa:
      enabled: true
      min: 2
      max: 8
      cpu: 70
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true

  notification-svc:
    image: notification-svc
    port: 8003
    http: true
    replicas: 2
    hpa:
      enabled: true
      min: 2
      max: 6
      cpu: 70
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true

  # SCALES ONLY WITH OBJECT STORAGE. Read this before raising the replica count.
  #
  # messaging-svc can store attachment bytes two ways (MEDIA_BACKEND):
  #
  #   fs — a LOCAL filesystem. This chart mounts no volume for it, so two
  #        replicas have two empty, unshared disks: pod A accepts an upload,
  #        pod B serves the download and 404s it, per request, at random.
  #        SAFE ONLY AT replicas: 1.
  #   s3 — any S3-compatible bucket, shared by every pod. Safe to scale.
  #
  # The HPA below is therefore disabled BY DEFAULT and the floor is 1, because
  # the default backend is fs and a chart that ships a data-loss-shaped
  # configuration is worse than one that ships a slow but correct default.
  #
  # To scale: set MEDIA_BACKEND=s3 and the MEDIA_S3_* secrets, run
  # scripts/migrate-blobs-to-s3.sh FIRST (copying the bytes across; the flip
  # alone points a live deployment at an empty bucket), then raise replicas and
  # enable the HPA. No database change is needed — attachments.storage_path is
  # relative and both backends use the same layout.
  messaging-svc:
    image: messaging-svc
    port: 8004
    http: true
    replicas: 1
    hpa:
      # Flip to true ONLY once MEDIA_BACKEND=s3 (see above).
      enabled: false
      min: 2
      max: 8
      cpu: 70
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true

  ws-gateway:
    image: ws-gateway
    port: 8080
    http: true
    replicas: 3
    hpa:
      # WebSocket load is connection-bound, not CPU-bound: a socket costs memory
      # and two goroutines for as long as it is open and almost no CPU while
      # idle. CPU is therefore a coarse safety net here rather than the signal.
      enabled: true
      min: 3
      # ── Sizing the ceiling ────────────────────────────────────────────────
      # max is a CAPACITY statement, so derive it: at WS_MAX_CONNECTIONS=25000
      # a pod holds 25k sockets, so 60 pods is 1.5M concurrent — comfortably
      # over the 1M target with room for a rollout to double-schedule.
      #
      # This was 12, i.e. 300k sockets, which was quietly the fleet's real
      # ceiling regardless of how much cluster you gave it.
      #
      # ⚠️ RAISING THIS ALONE ACHIEVES NOTHING. Read the podMetric note below:
      # the autoscaler still only scales on CPU, and CPU is close to
      # uncorrelated with how full a gateway pod is, so the fleet will sit at
      # min while pods fill and start refusing connections. The pair of changes
      # is "raise max" AND "give it a metric that tracks sockets".
      #
      # It is also a connection-budget statement downstream: 60 gateway pods do
      # not touch Postgres, but they do heartbeat presence into Redis, which is
      # why the Redis tier has to be a cluster before this ceiling is real.
      max: 60
      cpu: 65
      # ── The metric that makes `max` reachable ─────────────────────────────
      #
      # Scale on live connections, because CPU cannot see the thing that fills
      # a gateway pod: a socket costs memory and two goroutines for as long as
      # it is open and almost no CPU while idle. On CPU alone the fleet sits at
      # `min` while pods fill and start refusing connections, so the ceiling
      # above is capacity that does not exist. The gateway exports
      # `ws_connections` — a GaugeFunc reading the live hub count at scrape
      # time — for exactly this.
      #
      # This block was COMMENTED OUT, which is why raising `max` to 60 achieved
      # nothing on its own. It is now on by default, because leaving the two
      # halves of one change in two different states is what produced the gap.
      #
      # ⚠️ REQUIRES the Prometheus Adapter (or a cloud custom-metrics adapter)
      # registered with custom.metrics.k8s.io, exposing `ws_connections` as a
      # Pods metric. The adapter rule needs to select the gateway's pods and
      # surface the gauge unchanged — no rate(), it is a level, not a counter.
      #
      # WITHOUT the adapter this degrades rather than breaking: templates/hpa.yaml
      # lists this ALONGSIDE cpu, and an HPA scales on whichever metric asks for
      # the most replicas, so an unavailable custom metric leaves CPU as the
      # floor and the behaviour is exactly what it is today. The autoscaler will
      # emit a FailedGetPodsMetric event, which is the intended signal that the
      # adapter is missing — set `enabled: false` here if you are deliberately
      # running without one and would rather not see it.
      podMetric:
        enabled: true
        name: ws_connections
        # WELL BELOW WS_MAX_CONNECTIONS. The cap is where a pod starts REFUSING
        # sockets; this is where it should be ASKING FOR HELP. 17500 against the
        # 25000 cap that sizes `max` above leaves a pod at 70% full when the
        # next one is requested — enough headroom for it to schedule, pass its
        # readiness probe and start accepting before the existing ones fill.
        #
        # MOVES WITH WS_MAX_CONNECTIONS. Raising the cap without raising this
        # wastes capacity; raising this without raising the cap means pods start
        # refusing connections before the autoscaler ever reacts.
        averageValue: "17500"
    # SIZE THIS WITH WS_MAX_CONNECTIONS BELOW, NOT INDEPENDENTLY.
    #
    # A websocket costs 64Ki here. MEASURED, not added up: a freshly restarted
    # gateway holding 4,000 idle sockets sat at 268.5 MB VmRSS against a 21.1 MB
    # baseline — 64,864 bytes marginal per socket — with go_memstats_sys_bytes
    # tracking RSS almost exactly. Reproduce with loadtest/ws-step.sh.
    #
    #   2Gi - 21Mi baseline = 2027Mi, less 20% GC headroom = 1622Mi,
    #   / 64Ki = ~25,900 sockets -> WS_MAX_CONNECTIONS=25000 below.
    #
    # The previous figure was ~40Ki, reasoned from the parts a socket was
    # believed to allocate (send channel + two goroutine stacks + buffers,
    # doubled for GC). The parts list was incomplete — the gateway runs 3.02
    # goroutines per connection, not two — so 2Gi was paired with a 50,000 cap
    # it could never reach. That is the SAME failure this comment already
    # records for 512Mi, one size up: the pod OOMs near 26k and the cap still
    # never fires. The two numbers are a pair — raise both or neither.
    #
    # The request stays modest because a freshly-scheduled pod holds no sockets;
    # it is the limit that has to cover a full one.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 2Gi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true
    # WS_ADVERTISE_ADDR is where other processes reach THIS pod's sockets, and
    # it matters in EITHER fan-out mode. delivery-svc needs it in routed mode,
    # but so do WebRTC signalling and presence in both: they route through the
    # same registry, so on a multi-pod fleet without it a call between two users
    # on different pods never connects. Hence it is set here unconditionally
    # rather than as part of the routed migration below.
    #
    # There is deliberately no default in the gateway itself — a pod advertising
    # an unreachable address looks healthy while silently attracting pushes that
    # never arrive.
    #
    # Two variables, not one: status.podIP yields a BARE IP and the address has
    # to be a base URL. Kubernetes expands $(POD_IP) in a later env entry, so
    # POD_IP must be declared first — the order of this list is significant.
    extraEnv:
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: WS_ADVERTISE_ADDR
        value: "http://$(POD_IP):8080"

  # ── Routed fan-out delivery ────────────────────────────────────────────────
  #
  # DISABLED BY DEFAULT (replicas: 0). It does nothing until ws-gateway is set
  # to WS_FANOUT_MODE=routed, and it is safe — but pointless — to run alongside
  # the broadcast path.
  #
  # WHAT IT FIXES. Each gateway pod subscribes to Kafka under a group id unique
  # to itself, so every pod receives every event on every fan-out topic and
  # discards the ones addressed to users it does not hold. Kafka egress and
  # replay-outbox writes scale with POD COUNT, not with traffic — so adding a
  # gateway pod adds load to Kafka and Redis rather than relieving it. That is
  # the ceiling on the whole real-time tier. This reads the stream once under a
  # shared consumer group and pushes each gateway only its own users.
  #
  # TO TURN IT ON:
  #   1. replicas: 1 here, deploy, confirm ws_push_sent_total climbs
  #   2. set WS_FANOUT_MODE=routed in ws-gateway's `env` (WS_ADVERTISE_ADDR is
  #      already set in its extraEnv above — it is needed in both modes)
  #   3. watch ws:fanout_discarded:ratio fall to zero
  # Both paths may run at once; delivery is idempotent and clients dedupe on
  # eventId, so there is no flag day.
  #
  # SCALE BY PARTITION COUNT, not by CPU. It is a Kafka consumer group member:
  # replicas beyond the partition count of the fan-out topics simply idle, and
  # CPU autoscaling a partition-bound consumer churns rebalances.
  delivery-svc:
    # Same image as ws-gateway, different binary — one module, one domain.
    image: ws-gateway
    command: ["/usr/local/bin/delivery-svc"]
    port: 8090
    http: true
    replicas: 0
    hpa:
      enabled: false
      min: 1
      max: 4
      cpu: 70
    resources:
      # Holds no sockets: a Kafka consumer and an HTTP client, sized for
      # throughput rather than connection count.
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 256Mi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true

  # telemetry-svc and integrations-svc were missing from this chart entirely —
  # no Deployment, Service, HPA, PDB, NetworkPolicy or ingress path. A Helm
  # deploy therefore ran the product with no activity record and no external
  # integrations at all, while the compose deployment had both. Every template
  # here ranges over .Values.services, so adding them is values-only.
  telemetry-svc:
    image: telemetry-svc
    port: 8006
    http: true
    replicas: 2
    hpa:
      enabled: true
      min: 2
      max: 6
      cpu: 70
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true

  integrations-svc:
    image: integrations-svc
    port: 8005
    http: true
    replicas: 2
    hpa:
      enabled: true
      min: 2
      max: 4
      cpu: 70
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true

  email-worker:
    image: email-worker
    # No HTTP port: pure Kafka consumer. No Service / Ingress / HPA / PDB / probes.
    port: null
    http: false
    # Single replica + a stable consumer group means Kafka assigns partitions to
    # this instance. Scale by raising replicas up to the partition count; do NOT
    # CPU-autoscale a partition-bound consumer (rebalances churn throughput).
    replicas: 1
    hpa:
      enabled: false
      min: 1
      max: 1
      cpu: 80
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
    healthPath: /healthz
    readyPath: /readyz
    readOnlyRootFilesystem: true

# ─────────────────────────────────────────────────────────────────────────────
# Non-secret environment shared by all services (rendered into a ConfigMap).
# Service code reads these by name (validated against each service's config).
# Point the *_DATABASE_URL hosts at your managed Postgres (or the in-cluster
# pgbouncer Service when `pgbouncer.enabled: true` — see note below).
# ─────────────────────────────────────────────────────────────────────────────
env:
  # Kafka brokers (comma-separated). Managed MSK/Confluent/Redpanda or Strimzi.
  KAFKA_BROKERS: "kafka-bootstrap:9092"
  # Kafka SASL_SSL (managed/multi-broker).
  #
  # These ARE read by every client in the platform — the Go services via
  # internal/kafkaauth, the Python services via app/kafka_security.py. Unset
  # means PLAINTEXT, which is the bundled single broker.
  #
  # KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD belong in `secrets`, not in this
  # ConfigMap. Setting a SASL protocol without them is a deliberate startup
  # error: a client that quietly fell back to plaintext would be a deployment
  # that believes it is authenticated and is not.
  #
  # KAFKA_SASL_MECHANISM defaults to PLAIN. MSK IAM is not supported — use
  # SCRAM-SHA-512 there. KAFKA_SSL_CA_LOCATION is only needed for a private CA.
  # KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  # KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  # KAFKA_SSL_CA_LOCATION: "/etc/ssl/kafka/ca.crt"

  # auth-svc publishes JWKS; every other service fetches + caches it from here.
  JWKS_URL: "http://auth-svc:8001/.well-known/jwks.json"
  JWT_ISSUER: "task-board"
  # ⚠️ TWO THINGS AT ONCE — read both before changing it.
  #
  # 1. THE WRITE RATE ON auth-svc's DATABASE. Every expiry costs one
  #    /auth/refresh, and refresh ROTATES the token, which is a write. Session
  #    upkeep is therefore (concurrent users ÷ this value) writes/sec, and it is
  #    load that cannot be cached, batched or skipped.
  #
  # 2. THE REVOCATION WINDOW. Suspending or removing a user revokes their
  #    refresh tokens at once, but an access token already issued stays valid
  #    until it expires — /auth/refresh is where deactivation is enforced and a
  #    live access token never passes through it. This is how long a removed
  #    employee keeps working access, and how long a demoted admin keeps
  #    org_admin in their claims.
  #
  # 3600 buys a 4× cut in refresh writes for a 4× wider window. Right for a
  # large deployment, wrong for a security-sensitive small one. If the window
  # matters more, the answer is a per-request revocation denylist, not a shorter
  # TTL — that removes the trade instead of picking a side of it.
  JWT_ACCESS_TTL_SECONDS: "3600"
  JWT_REFRESH_TTL_SECONDS: "2592000"
  JWT_KID: "ed25519-1"
  JWT_PRIVATE_KEY_PATH: "/keys/ed25519_private.pem"
  JWT_PUBLIC_KEY_PATH: "/keys/ed25519_public.pem"

  # Public web origin (CORS + invite/deep links). Override per environment.
  WEB_ORIGIN: "https://app.example.com"
  INVITE_BASE_URL: "https://app.example.com/invite"
  WEB_BASE_URL: "https://app.example.com"

  # Refresh-cookie hardening — MUST be true in production (TLS-only cookie).
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "lax"

  # Internal service base URLs (in-cluster Service DNS).
  TB_MESSAGING_INTERNAL_BASE: "http://messaging-svc:8004"
  AUTH_INTERNAL_BASE: "http://auth-svc:8001"

  # ── Media tier (non-secret half) ───────────────────────────────────────────
  #
  # LIVEKIT_URL is the PUBLIC wss:// address browsers dial for media signalling,
  # not the in-cluster Service — the client connects to it directly. Route
  # /livekit through the Ingress to the livekit Service and point this at it.
  #
  # messaging-svc treats all three LIVEKIT_* values as one unit: with none set,
  # calling is cleanly disabled and /calls/{id}/token answers 503; with a
  # PARTIAL set it refuses to start, because a half-configured SFU is a
  # deployment mistake that would otherwise surface only when someone tried to
  # start a meeting.
  LIVEKIT_URL: "wss://app.example.com/livekit"
  # STUN/TURN URLs handed to clients by ws-gateway's /turn-credentials.
  # TURN_URLS must point at the coturn fleet's PUBLIC address; without it the
  # endpoint returns STUN only and everyone behind a symmetric NAT fails to
  # connect while the API looks healthy.
  STUN_URLS: "stun:stun.l.google.com:19302"
  TURN_URLS: "turn:app.example.com:3478"

  # ws-gateway connection caps.
  #
  # WS_MAX_CONNECTIONS is a MEMORY BUDGET expressed as a socket count. It is
  # paired with the ws-gateway memory limit above — 64Ki per socket MEASURED
  # (loadtest/ws-step.sh), so 2Gi carries ~25,900 and this is set to 25000.
  # The two must move together: a cap the memory limit cannot reach never
  # fires, and the pod is OOM-killed instead of refusing with a 1013.
  #
  # Was "50000", derived from an estimated 40Ki per socket. The estimate was
  # 1.6x optimistic, so the cap sat ~2x beyond what 2Gi can hold.
  #
  # WS_MAX_CONNS_PER_USER bounds one person's tabs and devices, not capacity.
  WS_MAX_CONNECTIONS: "25000"
  WS_MAX_CONNS_PER_USER: "20"

  # Email / SMTP (non-secret parts; credentials go in `secrets`).
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_FROM: "no-reply@example.com"
  SMTP_STARTTLS: "true"

  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

# ─────────────────────────────────────────────────────────────────────────────
# Secret environment (rendered into a Secret). PRODUCTION: leave these empty and
# set `existingSecret` to a Secret managed by External Secrets Operator /
# sealed-secrets. The values below are dev placeholders only.
#
# *_DATABASE_URL: one per service (database-per-service). Host them on your
# managed Postgres or via the in-cluster pgbouncer (pgbouncer.enabled: true),
# in which case point the host at `taskboard-pgbouncer:6432`.
#
# ⚠️ THIS KEY WAS MISSING. Everything below was indented under `env:` above,
# which meant templates/secret.yaml — which ranges over `.Values.secrets` —
# rendered an EMPTY Secret, and every credential here (seven database
# passwords, the Redis password, TB_INTERNAL_TOKEN, the SMTP password) was
# written into the ConfigMap instead. ConfigMaps are not encrypted at rest by
# default, are readable by anything with configmap RBAC, and are routinely
# captured in support bundles and `kubectl get -o yaml` output.
#
# The move is transparent to running services: every Deployment does envFrom on
# BOTH the ConfigMap and the Secret, so the resulting environment is identical —
# only the object holding the values changes.
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  # In-transit TLS to the managed DB: use sslmode=verify-full and point
  # sslrootcert at the CA bundle you mount (managed-DB CA / org PKI). The chart's
  # NetworkPolicy already scopes egress to your DB CIDR (networkPolicy.egress).
  AUTH_DATABASE_URL: "postgresql://taskboard:CHANGE_ME@postgres:5432/authdb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  TASK_DATABASE_URL: "postgresql://taskboard:CHANGE_ME@postgres:5432/taskdb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  NOTIFICATION_DATABASE_URL: "postgres://taskboard:CHANGE_ME@postgres:5432/notificationdb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  MESSAGING_DATABASE_URL: "postgres://taskboard:CHANGE_ME@postgres:5432/messagingdb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  # OPTIONAL read replica for messaging-svc. Unset means every read goes to the
  # primary, exactly as before.
  #
  # Replicas do not raise the write ceiling — only sharding does — they take the
  # heavy READS off the primary, which buys headroom while sharding is planned.
  # Only a deliberately-chosen set of lag-tolerant queries is routed here (the
  # forward tree and forward-activity digests today); the hot inbox paths stay
  # on the primary because they are read-after-write and a lagging replica would
  # hide a message the user just sent.
  #
  # A configured-but-unreachable replica is a BOOT FAILURE, not a silent
  # fallback: falling back would hide that the headroom you paid for is not
  # being used.
  # MESSAGING_DATABASE_REPLICA_URL: "postgres://taskboard:CHANGE_ME@postgres-replica:5432/messagingdb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  EMAIL_DATABASE_URL: "postgres://taskboard:CHANGE_ME@postgres:5432/emaildb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  TELEMETRY_DATABASE_URL: "postgresql://taskboard:CHANGE_ME@postgres:5432/telemetrydb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  INTEGRATIONS_DATABASE_URL: "postgresql://taskboard:CHANGE_ME@postgres:5432/integrationsdb?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt"
  # Managed Redis with a publicly-trusted cert verifies out of the box via
  # rediss:// (TLS). Self-signed Redis CAs are NOT validated by ws-gateway's
  # go-redis client — see docs/OPERATIONS.md §7.
  # One URL is a single-node client. SEVERAL, comma-separated, make ws-gateway
  # and delivery-svc use a Redis Cluster client — credentials/TLS come from the
  # first, the rest are seed addresses.
  #
  # The keyspace differs between the two: cluster mode hash-tags keys so a
  # user's presence entry and replay outbox share a slot. A cluster therefore
  # starts empty from this service's point of view — acceptable, since standing
  # one up means a new Redis anyway, but seven days of replay history does not
  # migrate and clients do one REST backfill after the cutover.
  #
  # Sequence matters: route fan-out first (WS_FANOUT_MODE=routed). While every
  # gateway still consumes every event it also writes every recipient's outbox,
  # and a cluster would distribute that amplified load rather than remove it.
  # RTC signalling and the presence broadcast still use classic pub/sub, which
  # is cluster-wide broadcast and does not shard.
  REDIS_URL: "rediss://:CHANGE_ME@redis:6379/0"
  # Shared secret for internal service-to-service calls (X-Internal-Token).
  #
  # ALSO authorizes routed fan-out delivery: delivery-svc presents it to push
  # events to a gateway, and anyone holding it can deliver an arbitrary payload
  # to any connected user. Treat it accordingly.
  TB_INTERNAL_TOKEN: "CHANGE_ME_internal_token"

  # ── Media tier credentials (livekit.enabled / coturn.enabled) ──────────────
  #
  # LIVEKIT_KEYS is "<apiKey>: <apiSecret>" — the format LiveKit's server
  # expects, note the space after the colon. The SECRET can mint anyone into any
  # room, so it carries the same weight as a database password; messaging-svc
  # holds the same pair and is the only component that decides who gets a token.
  # Its LIVEKIT_API_KEY/LIVEKIT_API_SECRET below must match this pair exactly or
  # every call fails authorization at the SFU.
  LIVEKIT_KEYS: "CHANGE_ME_livekit_key: CHANGE_ME_livekit_secret_at_least_32_chars"
  LIVEKIT_API_KEY: "CHANGE_ME_livekit_key"
  LIVEKIT_API_SECRET: "CHANGE_ME_livekit_secret_at_least_32_chars"
  # coturn's static-auth-secret. ws-gateway mints short-lived TURN credentials
  # by HMAC-ing over this, so the two MUST match or every relay auth fails —
  # and fails only for the users who actually need a relay.
  TURN_SECRET: "CHANGE_ME_turn_secret"
  # SMTP credentials.
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""

# If set, the chart will NOT render its own Secret; every service's envFrom will
# reference this externally-managed Secret instead (External Secrets Operator,
# sealed-secrets, vault-injector, CSI). The keys above must exist in it.
existingSecret: ""

# JWT signing keys (Ed25519) for auth-svc, mounted read-only at /keys. In prod,
# point `existingKeysSecret` at an externally-managed Secret holding
# ed25519_private.pem / ed25519_public.pem and leave `data` empty.
signingKeys:
  enabled: true
  existingKeysSecret: ""
  mountPath: /keys
  data: {}
  # ed25519_private.pem: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  # ed25519_public.pem: |
  #   -----BEGIN PUBLIC KEY-----
  #   ...

# ─────────────────────────────────────────────────────────────────────────────
# Ingress — routes external traffic to the HTTP services. TLS via cert-manager.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# Media tier — the WebRTC plane. Rendered by templates/livekit.yaml and
# templates/coturn.yaml rather than by the generic services loop, because both
# need host networking and contiguous port ranges that the loop cannot express.
#
# WITHOUT THESE, GROUP CALLS DO NOT EXIST ON KUBERNETES. messaging-svc's token
# minter reports itself unconfigured when LIVEKIT_* is absent, so
# POST /calls/{id}/token answers 503 and every attempt to start a meeting fails.
# Enable both, set LIVEKIT_KEYS and TURN_SECRET in `secrets`, and set
# LIVEKIT_URL in `env` to the public wss:// address of the SFU.
# ─────────────────────────────────────────────────────────────────────────────
livekit:
  # Off by default: it requires nodes that can expose a UDP range publicly, and
  # a chart that silently schedules an unreachable media plane is worse than one
  # that makes you opt in.
  enabled: false
  # Keep in step with packages/app's livekit-client — see the long note on the
  # `livekit` service in docker-compose.prod.yml. A server older than v1.9.1
  # does not echo the offer id the client waits for, and every group call turns
  # into a 15-second rejoin loop.
  image: livekit/livekit-server:v1.13.5
  # hostNetwork means one SFU per node — this is bounded by node count, not by
  # load. Past a few hundred concurrent streams the answer is more nodes.
  replicas: 1
  signalPort: 7880
  tcpPort: 7881
  # ⚠️ MUST be reachable from clients. A blocked range produces calls that
  # connect, list participants, and carry no media — which reads as an
  # application bug and is not one.
  udpPortRange:
    start: 50000
    end: 50200
  # Behind NAT the SFU must advertise the address clients can reach rather than
  # the one on its own interface, so it discovers the public one at startup.
  useExternalIP: true
  logLevel: info
  emptyTimeoutSeconds: 120
  # A product ceiling rather than a capacity one.
  maxParticipants: 100
  redis:
    # THE MULTI-NODE SWITCH. Participants in one room may land on different SFU
    # instances and still see each other, because the nodes coordinate through
    # Redis. Off in the compose deployment only because the SFU there cannot
    # resolve the service name on the Docker bridge — in Kubernetes a
    # hostNetwork pod still reaches a ClusterIP Service, so this is available.
    #
    # Turn it on together with replicas > 1; a single node does not need it.
    enabled: false
    address: "redis:6379"
    db: 1
  resources:
    # An SFU is CPU-bound on packet FORWARDING — it does not decode media.
    requests: { cpu: 500m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }
  nodeSelector: {}
  tolerations: []

coturn:
  enabled: false
  image: coturn/coturn:4.6-alpine
  replicas: 1
  listeningPort: 3478
  # ONE PORT PER RELAY ALLOCATION, so the width of this range is very nearly
  # the concurrent relayed-session capacity of a node.
  #
  # The compose deployment shipped 49160-49200 — 41 ports, about twenty calls,
  # for the entire platform. Because only the 10-20% of calls that cannot
  # traverse NAT need a relay, exhausting it presents as a load-dependent
  # minority of broken calls rather than an outage, which is a genuinely
  # difficult thing to diagnose from the outside.
  #
  # 20000 ports is roughly 10-20k concurrent relayed sessions per node; the real
  # ceiling above that is bandwidth, not port space.
  relayPortRange:
    start: 30000
    end: 49999
  # Defaults to ingress.host. Must match what clients are told to expect.
  realm: ""
  resources:
    # A relay is bandwidth- and packet-rate-bound. The compose limits
    # (0.5 CPU / 128M) were sized for a handful of calls.
    requests: { cpu: 250m, memory: 128Mi }
    limits: { cpu: "2", memory: 512Mi }
  nodeSelector: {}
  tolerations: []

ingress:
  enabled: true
  className: nginx
  # cert-manager issues + renews the TLS cert referenced in tls.secretName.
  clusterIssuer: letsencrypt-prod
  host: app.example.com
  tls:
    enabled: true
    secretName: taskboard-tls
  annotations: {}
  # Per-path routing on a single host. A LIST per service — several routes are
  # not under the service's own /api prefix, and when this was one string each
  # they were simply unreachable on Kubernetes:
  #   /presence, /turn-credentials  — the SPA polls presence every 20s and
  #                                   WebRTC calls cannot start without TURN
  #                                   credentials.
  #   /.well-known/jwks.json        — the stable public path any external
  #                                   verifier uses.
  #   /ext                          — inbound provider webhooks and OAuth
  #                                   callbacks; an integration cannot complete
  #                                   without it.
  # Mirrors infra/caddy/Caddyfile, which has always routed all of these. Keep
  # the two in step: a route that exists in only one deployment is a bug that
  # appears when you migrate.
  paths:
    auth-svc: [/api/auth, /.well-known/jwks.json]
    task-svc: [/api/tasks]
    notification-svc: [/api/notifications]
    messaging-svc: [/api/messaging]
    telemetry-svc: [/api/telemetry]
    integrations-svc: [/api/integrations, /ext]
    ws-gateway: [/ws, /presence, /turn-credentials]
  # Long timeout for the ws-gateway upgrade — see ingress.yaml comments.
  websocketTimeoutSeconds: 3600

# ─────────────────────────────────────────────────────────────────────────────
# PodDisruptionBudgets — keep a minimum available during voluntary disruptions
# (node drains, rollouts). Applied to every http service.
# ─────────────────────────────────────────────────────────────────────────────
pdb:
  enabled: true
  minAvailable: "50%"

# ─────────────────────────────────────────────────────────────────────────────
# Scheduled maintenance jobs.
#
# The Kubernetes equivalent of infra/systemd/*.timer. Without these a Helm
# deployment runs no rollup, no retention prune and no attachment GC at all —
# and nothing reports the absence, because a job that was never scheduled
# produces no failure.
#
# ORDERING IS LOAD-BEARING and matches the systemd units exactly:
#   02:30  backup        (not here — see the note at the bottom)
#   03:00  attachment GC
#   04:00  telemetry rollup
#   04:30  telemetry prune
# The prune runs last because it DELETES, and it refuses to drop a day the
# rollup has not yet aggregated — so rollup must precede it, and the backup
# must precede both, so the newest dump predates any deletion.
#
# Times are explicit UTC rather than inherited from the cluster, so the order
# above survives a node in another timezone.
# ─────────────────────────────────────────────────────────────────────────────
cronJobs:
  gc-attachments:
    enabled: true
    image: messaging-svc
    schedule: "0 3 * * *"
    timeZone: "Etc/UTC"
    command: ["/app/gc-attachments"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }

  telemetry-rollup:
    enabled: true
    image: telemetry-svc
    schedule: "0 4 * * *"
    timeZone: "Etc/UTC"
    command: ["python", "-m", "app.jobs.rollup"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }

  telemetry-prune:
    enabled: true
    image: telemetry-svc
    schedule: "30 4 * * *"
    timeZone: "Etc/UTC"
    command: ["python", "-m", "app.jobs.prune"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }

  # refresh_tokens is the highest-write table in the platform, and the only one
  # whose load scales with CONCURRENT USERS rather than with activity: every
  # access-token expiry costs one /auth/refresh, and refresh rotates — a row in,
  # the previous one revoked. Nothing deleted any of them, so it grew without
  # bound.
  #
  # Deletes on EXPIRY, not on revocation. A revoked row is what makes reuse
  # detection work: replaying a rotated-away token finds it, sees it revoked and
  # tears down the family. Delete it early and the same replay reads as an
  # unknown token — refused, but no longer recognised as theft. Past expires_at
  # the replay is refused anyway, so the row has nothing left to prove.
  #
  # Hourly rather than nightly. The churn is continuous, so a nightly run means
  # the table carrying the login path spends most of the day at its largest.
  refresh-token-prune:
    enabled: true
    image: auth-svc
    schedule: "17 * * * *"
    timeZone: "Etc/UTC"
    command: ["python", "-m", "app.jobs.prune_refresh_tokens"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  # ── Event-table retention ──────────────────────────────────────────────────
  #
  # Nothing in the platform ever deleted a row from the tables that make the
  # event pipeline work. `DELETE FROM outbox` appeared NOWHERE in the repository,
  # in any of the seven services that have one — so `outbox` (with its full JSON
  # payload), `consumed_events` and `idempotency_keys` held one row per event or
  # per idempotent write, forever, on the single Postgres primary.
  #
  # The failure is slow and then sudden, and it is not mainly about disk: the hot
  # paths stay index probes, and what degrades is everything around them —
  # indexes outgrowing memory, autovacuum falling behind the churn, backup
  # windows stretching, and a restore taking hours longer than the runbook says.
  # Sharding does not fix it; sharding multiplies it.
  #
  # Each job prunes only what nothing can still use: PUBLISHED outbox rows past
  # the point where replaying them could help (never unpublished, never
  # dead-lettered), dedup rows past Kafka's retention, and idempotency keys past
  # the client-retry window. Every one deletes in bounded batches with a commit
  # between them, so it competes with live traffic for milliseconds rather than
  # minutes.
  #
  # Staggered across the hour so five services do not prune the same Postgres at
  # the same moment.
  messaging-prune-events:
    enabled: true
    image: messaging-svc
    schedule: "5 2 * * *"
    timeZone: "Etc/UTC"
    command: ["/app/prune-event-tables"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }

  # First among equals: notification.events.v1 is the highest-fan-out topic in
  # the product — one outbox row per notification per recipient — so this
  # service's table grows fastest and had no bound at all.
  notification-prune-events:
    enabled: true
    image: notification-svc
    schedule: "15 2 * * *"
    timeZone: "Etc/UTC"
    command: ["/app/prune-event-tables"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }

  task-prune-events:
    enabled: true
    image: task-svc
    schedule: "25 2 * * *"
    timeZone: "Etc/UTC"
    command: ["python", "-m", "app.jobs.prune_event_tables"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  auth-prune-events:
    enabled: true
    image: auth-svc
    schedule: "35 2 * * *"
    timeZone: "Etc/UTC"
    command: ["python", "-m", "app.jobs.prune_event_tables"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  integrations-prune-events:
    enabled: true
    image: integrations-svc
    schedule: "45 2 * * *"
    timeZone: "Etc/UTC"
    command: ["python", "-m", "app.jobs.prune_event_tables"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  # LAST, and the most destructive job in the system: it erases an organization
  # across seven databases and a blob volume. Runs after everything else so the
  # most recent backup predates the deletion — a mistake should be recoverable
  # FROM the backup, not faithfully recorded BY it.
  org-purge:
    enabled: true
    image: auth-svc
    schedule: "0 5 * * *"
    timeZone: "Etc/UTC"
    command: ["python", "-m", "app.jobs.purge_orgs"]
    readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

# NOT scheduled here, deliberately: blisswork-backup and blisswork-media-disk.
# Both are about the HOST — a pg_dump of a container-local Postgres and a check
# on the media volume's free space. On Kubernetes with a managed database and
# object storage neither has a meaningful in-cluster equivalent; backups belong
# to the database provider and disk alerting to the monitoring stack. Listing
# them as disabled CronJobs would imply they merely need switching on.

# ─────────────────────────────────────────────────────────────────────────────
# NetworkPolicy — per-service least-privilege.
#
# Baseline is default-deny for BOTH ingress and egress on every pod in the
# release, then narrow allow-policies re-open exactly the flows that exist:
#   • DNS egress for all pods (so name resolution survives default-deny).
#   • Egress to the EXTERNAL datastores (Postgres / Redis / Kafka / SMTP) which
#     live outside the cluster — matched by CIDR + port, NOT pod selector.
#   • Ingress from the ingress controller to each HTTP service on its port.
#   • The intra-cluster service-to-service calls that actually happen
#     (ws-gateway→messaging, task-svc→messaging, email-worker→auth, all→auth JWKS).
#   • Prometheus scraping /metrics on each HTTP service.
#   • Egress to the OpenTelemetry collector (OTLP gRPC 4317).
# email-worker takes NO ingress — it runs no server (pure Kafka consumer).
#
# Requires a CNI that ENFORCES NetworkPolicy (Calico, Cilium, Antrea, ...). On a
# CNI without enforcement these objects are silently inert.
# ─────────────────────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Allow DNS egress to kube-dns (otherwise default-deny breaks name resolution).
  allowDNS: true
  # Namespace where kube-dns/CoreDNS runs. The selector below matches it by the
  # well-known kubernetes.io/metadata.name label (set automatically by the API
  # server on every namespace since k8s 1.21).
  dnsNamespace: kube-system

  # Who is allowed to reach the HTTP services from outside the namespace, i.e.
  # the ingress controller. Defaults to the standard ingress-nginx install,
  # which labels its namespace kubernetes.io/metadata.name=ingress-nginx.
  # Adjust namespaceSelector/podSelector to match your controller (Traefik,
  # Contour, a cloud LB controller, etc.).
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    # Optional pod-level narrowing within that namespace. Empty = any pod there.
    podSelector: {}

  # Prometheus / metrics scraper allowed to hit /metrics on the HTTP port of
  # each service. Defaults to a kube-prometheus-stack style install in a
  # `monitoring` namespace. Set podSelector to pin to the Prometheus pods.
  monitoring:
    enabled: true
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}

  # OpenTelemetry collector egress (traces/metrics via OTLP gRPC). By default the
  # collector is assumed IN-cluster, so we allow egress to it by namespace + port
  # rather than CIDR. Disable if you do not run a collector, or switch to a
  # cidr-based rule (like the datastores below) for an out-of-cluster collector.
  otelCollector:
    enabled: true
    port: 4317
    # In-cluster collector: allow egress to its namespace. Same namespace by
    # default (empty namespaceSelector = the release's own namespace via the
    # standard metadata.name label is overkill, so we match any ns here and rely
    # on the port to scope it). Tighten to the collector's namespace/pod.
    namespaceSelector: {}
    podSelector: {}

  # ───────────────────────────────────────────────────────────────────────────
  # External datastore egress. These backends are OUT of the cluster, so they
  # are matched by CIDR + port (a pod selector can't target them). The defaults
  # allow 0.0.0.0/0 on the standard ports so the chart works out of the box —
  # TIGHTEN cidr to your real managed-service ranges (RDS / ElastiCache / MSK /
  # SES subnets) before relying on these for security.
  # ───────────────────────────────────────────────────────────────────────────
  egress:
    postgres:
      enabled: true
      cidr: 0.0.0.0/0
      ports: [5432]
    redis:
      enabled: true
      cidr: 0.0.0.0/0
      ports: [6379]
    kafka:
      enabled: true
      cidr: 0.0.0.0/0
      ports: [9092]
    smtp:
      enabled: true
      cidr: 0.0.0.0/0
      # Submission (587), implicit-TLS (465) and legacy (25).
      ports: [587, 465, 25]

# ─────────────────────────────────────────────────────────────────────────────
# PgBouncer — in-cluster connection pooler (transaction pooling) in front of an
# external Postgres. ON, because the autoscaling above makes it necessary rather
# than optional: with every HTTP service scaling to 4-12 pods and each holding
# its own pgx/SQLAlchemy pool, the connection count Postgres sees is the product
# of pods × pool size, and a managed instance's `max_connections` is a hard wall
# long before CPU is.
#
# This codebase is already transaction-pooling-safe, which is the part that is
# usually the blocker and is easy to break later:
#
#   * Every org-scoped query sets `app.org_id` with
#     `set_config(..., is_local => true)` — TRANSACTION-scoped, so it cannot
#     leak onto the next client to borrow that server connection.
#   * Every advisory lock is `pg_advisory_xact_lock` /
#     `pg_try_advisory_xact_lock`, never the session-level variant, which under
#     transaction pooling would be taken on one backend and released on another
#     (which is to say, never).
#
# Anything added later that relies on session state — a session-level advisory
# lock, `SET` without LOCAL, a prepared statement held across transactions,
# LISTEN/NOTIFY, or a temp table — breaks silently and intermittently under this
# pool mode. Keep the two rules above.
# ─────────────────────────────────────────────────────────────────────────────
pgbouncer:
  enabled: true
  image: bitnami/pgbouncer:1.23.1
  replicas: 2
  port: 6432
  # Upstream Postgres (managed instance). PgBouncer fans the per-service DBs in.
  upstream:
    host: postgres
    port: 5432
  poolMode: transaction
  maxClientConn: 1000
  defaultPoolSize: 25
  # Admin/auth credentials sourced from the Secret (keys must exist there).
  authSecretName: ""   # defaults to the chart Secret when empty
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
