{{/*
Single-host Ingress fanning paths out to the HTTP services. TLS is provisioned
and renewed by cert-manager via the cluster-issuer annotation. email-worker has
no listener and is intentionally not routed.
*/}}
{{- if .Values.ingress.enabled }}
{{- $root := . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    # cert-manager watches this Ingress and issues/renews the cert into the
    # tls.secretName Secret using the named ClusterIssuer (e.g. Let's Encrypt).
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    # ── ws-gateway WebSocket upgrade ─────────────────────────────────────────
    # WebSockets are long-lived; the default 60s proxy read/send timeout would
    # drop idle connections. Raise it for the whole Ingress (nginx applies these
    # per-Ingress). On a controller that supports per-path timeouts, scope the
    # long timeout to the /ws path only. Envoy/Traefik use their own annotations.
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.websocketTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.websocketTimeoutSeconds | quote }}
    # Pin a client to one ws-gateway pod (complements the Service ClientIP
    # affinity); ideally key the upstream hash on userId at L7 instead.
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /*
            A LIST of paths per service, not one.
            This used to be a single string per service, which quietly capped
            the routable surface at one prefix each — so /presence and
            /turn-credentials (ws-gateway) and /.well-known/jwks.json (auth-svc)
            had no route at all. A Kubernetes deploy therefore had no online
            presence, no WebRTC calls, and no externally-reachable JWKS, while
            the Caddy deployment routed all three. A plain string is still
            accepted so an existing values override keeps working.
          */}}
          {{- range $name, $paths := .Values.ingress.paths }}
          {{- $svc := index $root.Values.services $name }}
          {{- if and $svc $svc.http $svc.port }}
          {{- range $path := (ternary $paths (list $paths) (kindIs "slice" $paths)) }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.livekit.enabled }}
          {{- /*
            The SFU's signalling path, routed separately because livekit is not
            a `services` entry — it needs host networking and a UDP range that
            the generic Deployment template cannot express, so it has its own
            manifest and therefore its own route here.

            SIGNALLING ONLY. Media goes directly to the node's host UDP ports
            and never passes through the Ingress; routing this path is what lets
            a browser negotiate the session, not what carries the call.

            This is a WebSocket upgrade, so it depends on the same raised
            proxy-read-timeout as /ws — which is set per-Ingress above and
            therefore already applies.
          */}}
          - path: /livekit
            pathType: Prefix
            backend:
              service:
                name: livekit
                port:
                  number: {{ .Values.livekit.signalPort }}
          {{- end }}
{{- end }}
