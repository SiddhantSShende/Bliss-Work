{{/*
Optional in-cluster PgBouncer in TRANSACTION pooling mode, sitting in front of
an external Postgres. Gated by pgbouncer.enabled.

Why: autoscaled stateless pods can each open a pool of connections; managed
Postgres has a hard max_connections. PgBouncer multiplexes many short app
transactions onto a small set of server connections, so the DB sees a bounded
count regardless of how far the HPA scales the app tier.

To use it, point the *_DATABASE_URL hosts in `secrets` at this Service
(`<release>-pgbouncer:6432`) instead of Postgres directly.

NOTE: transaction pooling disables session-level features (prepared statements
across transactions, SET, advisory locks held across statements, LISTEN/NOTIFY).
The app services use short request-scoped transactions, which is the supported
pattern. If a service needs session features, route it at `session` pool mode
instead.
*/}}
{{- if .Values.pgbouncer.enabled }}
{{- $root := . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" . }}-pgbouncer
  labels:
    {{- include "taskboard.svcLabels" (dict "root" $root "svc" "pgbouncer") | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" "pgbouncer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskboard.svcLabels" (dict "root" $root "svc" "pgbouncer") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: pgbouncer
              containerPort: {{ .Values.pgbouncer.port }}
              protocol: TCP
          env:
            # bitnami/pgbouncer reads these. POSTGRESQL_* = upstream Postgres;
            # PGBOUNCER_* = pooler behavior. Credentials come from the Secret.
            - name: POSTGRESQL_HOST
              value: {{ .Values.pgbouncer.upstream.host | quote }}
            - name: POSTGRESQL_PORT
              value: {{ .Values.pgbouncer.upstream.port | quote }}
            - name: PGBOUNCER_POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: PGBOUNCER_PORT
              value: {{ .Values.pgbouncer.port | quote }}
            # Map listen address explicitly so it binds all interfaces.
            - name: PGBOUNCER_BIND_ADDRESS
              value: "0.0.0.0"
            # Upstream auth — sourced from the chart/external Secret. These keys
            # (POSTGRESQL_USERNAME / POSTGRESQL_PASSWORD) must exist there.
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.authSecretName | default (include "taskboard.secretName" $root) }}
                  key: POSTGRESQL_USERNAME
                  optional: true
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.authSecretName | default (include "taskboard.secretName" $root) }}
                  key: POSTGRESQL_PASSWORD
                  optional: true
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-pgbouncer
  labels:
    {{- include "taskboard.svcLabels" (dict "root" $root "svc" "pgbouncer") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskboard.svcSelectorLabels" (dict "root" $root "svc" "pgbouncer") | nindent 4 }}
  ports:
    - name: pgbouncer
      port: {{ .Values.pgbouncer.port }}
      targetPort: pgbouncer
      protocol: TCP
{{- end }}
