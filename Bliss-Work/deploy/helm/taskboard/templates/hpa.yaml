{{/*
One HorizontalPodAutoscaler per HTTP service that opts in (hpa.enabled). CPU is
the portable, always-available signal, and every service scales on it.

A service may ALSO declare `hpa.podMetric: {name, averageValue}` to scale on a
custom Pods metric. That needs the Prometheus Adapter (or a cloud custom-metrics
adapter) registered with custom.metrics.k8s.io, which is why it is opt-in.

It is worth the setup for ws-gateway in particular: a websocket costs memory and
two goroutines for as long as it is open and almost no CPU while idle, so CPU
utilisation is close to uncorrelated with how full a pod actually is. The
gateway exports `ws_connections` (a GaugeFunc reading the live hub count at
scrape time) for exactly this.
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.http $svc.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskboard.svcLabels" (dict "root" $root "svc" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.hpa.min }}
  maxReplicas: {{ $svc.hpa.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.cpu }}
{{/* `with` first so the nil case never reaches a field lookup: every other
     service omits podMetric entirely, and `and a a.enabled` would evaluate the
     second operand on a nil map under any template engine that does not
     short-circuit. Nested, this is safe regardless. */}}
{{- with $svc.hpa.podMetric }}
{{- if .enabled }}
    # ── Custom Pods metric (requires the Prometheus Adapter) ──────────────────
    # Listed ALONGSIDE cpu, not instead of it: an HPA scales on whichever metric
    # asks for the most replicas, so CPU stays a floor. That matters here — if
    # the adapter is uninstalled or the metric stops reporting, the autoscaler
    # falls back to CPU rather than freezing at its current replica count.
    - type: Pods
      pods:
        metric:
          name: {{ .name }}
        target:
          type: AverageValue
          averageValue: {{ .averageValue | quote }}
{{- end }}
{{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Drain slowly so we don't thrash on bursty traffic.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- end }}
{{- end }}
