name: task-board

# Full local stack. Bring up with `make up` (or `docker compose up -d --build`).
# The Electron desktop app runs on the HOST via `npm run desktop`, not in compose.

x-svc-defaults: &svc-defaults
  restart: unless-stopped
  env_file: .env
  networks: [taskboard]

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # No host port mapping — services reach it over the internal network as
    # `postgres:5432`. (Avoids clashing with a Postgres already on the host.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [taskboard]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [taskboard]

  # Vault (dev mode) for the KMS-backed KEK provider. Opt-in: `--profile kms`.
  # One-time setup after `docker compose --profile kms up -d vault`:
  #   docker compose exec vault vault secrets enable transit
  #   docker compose exec vault vault write -f transit/keys/taskboard-dek
  # Then run a service with DATA_KEK_PROVIDER=kms DATA_KMS_BACKEND=vault-transit
  # DATA_KMS_KEY_ID=taskboard-dek VAULT_ADDR=http://vault:8200 VAULT_TOKEN=dev-root.
  vault:
    image: hashicorp/vault:1.18
    profiles: ["kms"]
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: dev-root
    ports:
      - "127.0.0.1:8201:8200" # host 8201 (8200 often taken); services use vault:8200 internally
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [taskboard]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bind all interfaces with ":port" (NOT 0.0.0.0) — the image's storage-format
      # step rejects a literal 0.0.0.0 appearing in advertised.listeners.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [taskboard]

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: kafka:9092
      TOPIC_PARTITIONS: 12
    entrypoint: ["bash", "/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    restart: "no"
    networks: [taskboard]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI + API
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [taskboard]

  # ── Application services ──────────────────────────────────────────────────────
  auth-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/auth-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/auth-svc/Dockerfile
    ports: ["127.0.0.1:${AUTH_PORT}:8001"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/readyz').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Google Cloud Translation gateway (opt-in: `--profile i18n`) ─────────────
  # Owns ALL UI translation: language list, English source catalogs, placeholder
  # protection, cache (REDIS_URL) and the Cloud Translation calls. The official Go
  # client authenticated by Application Default Credentials: the library mints and
  # refreshes its own access tokens. No service-account key, no API key, and no
  # token in any env file or image. auth-svc (TRANSLATE_GW_URL +
  # TRANSLATE_INTERNAL_TOKEN) is its only caller; no host port is published.
  #
  # THE credential configuration point (same variables in docker-compose.prod.yml):
  #   TRANSLATE_ADC_DIR                host directory, mounted READ-ONLY at /run/adc
  #   TRANSLATE_GOOGLE_CREDENTIALS     path of the credential file INSIDE the container
  #                                    (default /run/adc/credentials.json). Set it EMPTY
  #                                    to use Google's normal ADC chain instead (metadata
  #                                    server on GCE/GKE/Cloud Run; no file needed).
  # A directory (not a file) is mounted so a missing credential is just "not
  # configured" instead of Docker creating a stray directory in its place.
  # DEV: after `gcloud auth application-default login`, set in .env
  #   TRANSLATE_ADC_DIR=<your ~/.config/gcloud, as an explicit path — under `sudo docker`
  #                      $HOME is root's>
  #   TRANSLATE_GOOGLE_CREDENTIALS=/run/adc/application_default_credentials.json
  #   TRANSLATE_RUN_AS=<id -u>:<id -g>   (so the container can read the 0600 file)
  # With the profile off (or no credential) the language switcher stays English-only.
  translate-gw:
    <<: *svc-defaults
    profiles: ["i18n"]
    build:
      context: .
      dockerfile: services/translate-gw/Dockerfile
    user: "${TRANSLATE_RUN_AS:-10001}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: ${TRANSLATE_GOOGLE_CREDENTIALS-/run/adc/credentials.json}
    volumes:
      - ${TRANSLATE_ADC_DIR:-./keys/translate-adc}:/run/adc:ro
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8012/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  email-worker:
    <<: *svc-defaults
    build:
      # Repository root, not services/email-worker: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/email-worker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy } # owns emaildb (dedup state)
      kafka-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
      auth-svc: { condition: service_healthy } # resolves recipient e-mail via internal API

  task-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/task-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/task-svc/Dockerfile
    ports: ["127.0.0.1:${TASK_PORT}:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/readyz').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/notification-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/notification-svc/Dockerfile
    ports: ["127.0.0.1:${NOTIFICATION_PORT}:8003"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy } # warm JWKS cache after the signer is up
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8003/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  messaging-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/messaging-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/messaging-svc/Dockerfile
    ports: ["127.0.0.1:${MESSAGING_PORT}:8004"]
    # Chat attachment bytes. (The dev anchor declares no `volumes:`, so unlike
    # docker-compose.prod.yml there is no merge key to preserve here.)
    volumes:
      - media_blobs:/var/lib/blisswork/media
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy } # warm JWKS cache after the signer is up
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8004/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  integrations-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/integrations-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/integrations-svc/Dockerfile
    ports: ["127.0.0.1:${INTEGRATIONS_PORT}:8005"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy } # warm JWKS cache after the signer is up
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/readyz').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  telemetry-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/telemetry-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/telemetry-svc/Dockerfile
    ports: ["127.0.0.1:${TELEMETRY_PORT}:8006"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy } # warm JWKS cache after the signer is up
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/readyz').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Durable record of which task notes belong on which desktop. Reads
  # task.events.v1 and keeps one row per (org, assignee, task): OPEN from the
  # moment a task is assigned, CLOSED only when it reaches a terminal status.
  # Stores no task title or description — those stay encrypted in task-svc.
  sticky-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/sticky-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/sticky-svc/Dockerfile
    ports: ["127.0.0.1:${STICKY_PORT:-8008}:8008"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy } # warm JWKS cache after the signer is up
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/readyz').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Delivery watchdog for the desktop notes. Asks sticky-svc for open pins
  # nobody has confirmed receiving and nudges those users' clients to re-fetch,
  # so a task.assigned frame lost to a reconnect (or to the gateway's 24h replay
  # window expiring) still ends up on the desktop it was meant for.
  #
  # Deliberately a SINGLE replica: there is no throughput reason for a second
  # sweeper. Concurrent sweeps are safe anyway — sticky-svc claims the rows it
  # hands out — but one is the right number.
  sticky-relay:
    <<: *svc-defaults
    build:
      # Repository root: go.mod replaces shared-kafkaauth with the sibling
      # module services/shared/kafkaauth.
      context: .
      dockerfile: services/sticky-relay/Dockerfile
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      sticky-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Read-composition GraphQL gateway. Fronts a handful of READ paths only —
  # writes, uploads, exports, auth and realtime all keep talking to the services
  # directly, so this is an optional accelerator and not a dependency. A stack
  # without it works; the frontend simply takes its REST paths.
  graph-gw:
    <<: *svc-defaults
    build:
      # Repository root, not services/graph-gw: this service is a workspace
      # member and imports @taskboard/shared. See its Dockerfile.
      context: .
      dockerfile: services/graph-gw/Dockerfile
    ports: ["127.0.0.1:${GRAPH_PORT}:8007"]
    environment:
      # In-network addresses. The gateway sits WITH the services, so it does not
      # go back out through the edge to reach them.
      AUTH_BASE: http://auth-svc:8001
      MESSAGING_BASE: http://messaging-svc:8004
    depends_on:
      auth-svc: { condition: service_healthy }
      messaging-svc: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1, not localhost: Node binds IPv4 only and busybox wget tries
      # ::1 first. See the note in the Dockerfile.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8007/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ws-gateway:
    <<: *svc-defaults
    build:
      # Repository root, not services/ws-gateway: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    ports: ["127.0.0.1:${WS_GATEWAY_PORT}:8080"]
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Cross-region replication (opt-in) ────────────────────────────────────────
  # Bring up with: docker compose --profile crossregion up -d
  #
  # NATS JetStream carries events between regions, replacing Kafka MirrorMaker2
  # for the WAN hop. Kafka stays the in-region bus and NO other service changes,
  # which is also the rollback: stop these two containers and every region works
  # exactly as it did before. See docs/CROSS-REGION.md.
  #
  # This is ONE region's worth. A second region is the same pair with
  # BRIDGE_REGION/BRIDGE_PEER_REGIONS swapped and a NATS gateway between them
  # (infra/nats/region-a.conf, region-b.conf).
  nats:
    image: nats:2.10-alpine
    profiles: ["crossregion"]
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring: /healthz, /jsz
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    networks: [taskboard]
    healthcheck:
      # The server's own readiness endpoint — js=true additionally requires
      # JetStream to be up, which is the part the bridge depends on.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz?js-enabled-only=true || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  region-bridge:
    <<: *svc-defaults
    profiles: ["crossregion"]
    build:
      # Repository root: go.mod replaces shared-backoff and shared-kafkaauth
      # with the sibling modules services/shared/backoff and
      # services/shared/kafkaauth.
      context: .
      dockerfile: services/region-bridge/Dockerfile
    ports: ["127.0.0.1:${REGION_BRIDGE_PORT:-8009}:8080"]
    environment:
      BRIDGE_REGION: ${BRIDGE_REGION:-dev-local}
      # Empty in a single-region dev stack: there is nothing to import, and the
      # bridge says so and runs the export half only.
      BRIDGE_PEER_REGIONS: ${BRIDGE_PEER_REGIONS:-}
      KAFKA_BROKERS: kafka:9092
      NATS_URL: nats://nats:4222
      # Dev is a single NATS node, so a stream cannot be replicated at all.
      # Production MUST be 3 — see infra/nats/region-a.conf.
      BRIDGE_STREAM_REPLICAS: ${BRIDGE_STREAM_REPLICAS:-1}
      # Must stay under the dev server's jetstream.max_file_store (4 GB in
      # infra/nats/nats.conf), or JetStream refuses the stream outright with
      # "insufficient storage resources" and the bridge will not start. The
      # production default is 32 GB.
      BRIDGE_STREAM_MAX_GB: ${BRIDGE_STREAM_MAX_GB:-1}
      # The rollback switches. Either direction can be turned off on its own and
      # the bridge keeps its position, so re-enabling catches up.
      BRIDGE_EXPORT_ENABLED: ${BRIDGE_EXPORT_ENABLED:-true}
      BRIDGE_IMPORT_ENABLED: ${BRIDGE_IMPORT_ENABLED:-true}
    depends_on:
      nats: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The web app and Electron desktop client run on the HOST (npm run web / npm run desktop).

  # ── Observability stack (opt-in) ─────────────────────────────────────────────
  # Bring up with: docker compose --profile observability up -d
  # Vendor-neutral: services export OTLP to otel-collector:4317, which fans out to
  # Tempo (traces), Prometheus (metrics, scraped at :8889), and Loki (logs).
  # Grafana (http://localhost:3000, anonymous admin) visualises all three.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [taskboard]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9091:9090"] # host 9090 is commonly taken; Grafana reaches it in-network
    networks: [taskboard]

  # Pushgateway — Prometheus only ever PULLS from a scrape target, which does
  # not fit a batch/cron-shaped job: scripts/synthetic-call-check.mjs (the
  # synthetic call check, docs/OBSERVABILITY-ALERTS.md) runs, reports one
  # result, and exits, so there is no live process left for Prometheus to
  # scrape at the moment it actually ran. Pushgateway inverts the model for
  # exactly that shape of job — the script POSTs its result here once when it
  # finishes, and Prometheus scrapes THIS gateway on its normal interval,
  # seeing whatever was last pushed until the next run overwrites it.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    profiles: ["observability"]
    restart: unless-stopped
    # Container keeps its native port 9091 — that's what prometheus.yml's
    # pushgateway scrape target uses in-network. Published on host 9099, NOT
    # 9091: this file's own prometheus service two blocks up already owns
    # host port 9091 (remapped from its container port 9090). See
    # scripts/synthetic-call-check.mjs's PUSHGATEWAY_URL default, which
    # matches this.
    ports: ["127.0.0.1:9099:9091"]
    networks: [taskboard]

  # Alertmanager — routes Prometheus alerts to receivers. Dev config sends every
  # alert to a webhook sink; prod options (Slack/PagerDuty/email) are documented
  # in docs/OBSERVABILITY-ALERTS.md and stubbed in alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [taskboard]

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    networks: [taskboard]

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    networks: [taskboard]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on: [prometheus, loki, tempo]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      # Dashboard auto-loading needs TWO mounts: the provider config (how often
      # to rescan, which folder to file dashboards under) and the directory of
      # dashboard JSON itself — see grafana-dashboards.yaml's own comment for
      # why these are separate paths and cannot share one mount.
      - ./infra/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/observability/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [taskboard]

volumes:
  pgdata:
  media_blobs:
  # JetStream's file store: the cross-region replication log. Named rather than
  # anonymous so a `docker compose down` (without -v) does not discard events
  # peers have not yet sourced.
  nats_data:
  promdata:
  alertmanagerdata:
  tempodata:
  lokidata:
  grafanadata:

networks:
  taskboard:
    driver: bridge
