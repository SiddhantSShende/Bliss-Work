# pgBackRest config for continuous WAL archiving + PITR (A7 in the scaling
# roadmap). Mounted read-only into the postgres container at
# /etc/pgbackrest/pgbackrest.conf once infra/postgres/PGBACKREST-SETUP.md's
# compose changes are applied — see that file before using this.
#
# repo1-path is LOCAL DISK, not off-host. This VPS has one disk (/dev/sda1,
# ~68GB free at last check, shared with Postgres data, Kafka, media blobs, and
# everything else) — there is no second disk or S3 bucket provisioned yet.
# Local WAL archiving is still a real RPO improvement (minutes instead of the
# current ~24h nightly-dump window: see docs/BACKUPS.md) because it protects
# against logical mistakes (a bad DELETE, a bad migration) that a same-disk
# copy still recovers from — it does NOT protect against total disk/host
# loss, which is what the existing off-host rsync (scripts/backup-offsite.sh)
# already covers for the nightly logical dumps. Extending that same off-host
# shipping to this repo path (or moving repo1 to S3 once a bucket exists —
# see MEDIA_BACKEND=s3 in messaging-svc for the precedent of adding an S3
# backend to something that started local-only) is the natural next step,
# not a reason to hold off on local WAL archiving in the meantime.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# From the secret manager / the same place BACKUP_ENCRYPTION_KEY lives —
# never commit the real value here. This file ships with a placeholder.
repo1-cipher-pass=CHANGE-ME-set-via-secret-manager-not-in-git
# Conservative given shared local disk: 3 full backups, not the 14-day figure
# docs/BACKUPS.md's template used as a generic example. Revisit once this is
# shipped off-host or to object storage and local disk is no longer the only
# copy of the WAL archive.
repo1-retention-full=3
# Compress the WAL/backup stream — this disk is shared with everything else
# on the host, so smaller matters more here than on a dedicated backup host.
compress-type=zst

[taskboard]
pg1-path=/var/lib/postgresql/data
