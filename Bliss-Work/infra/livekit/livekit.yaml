# LiveKit SFU configuration.
#
# This is the media plane for group calls. Signaling and call lifecycle stay in
# ws-gateway; only the audio/video streams come here. messaging-svc mints the
# room tokens (internal/livekit/token.go) after checking the caller against the
# database, so LiveKit itself never talks to Postgres and holds no authorization
# state of its own — the token IS the grant.
#
# ── Why an SFU rather than peer-to-peer ──────────────────────────────────────
# A full mesh makes every client encode and upload N-1 copies of its camera.
# That is the client's uplink, not the server's, and it is what makes mesh calls
# fall apart at around 5 people. Here each client publishes once and subscribes
# to what it needs, so per-client cost is flat as the room grows.

port: 7880

rtc:
  # The UDP range media actually flows over. Must be published on the host and
  # open in the firewall, or calls connect and then carry no media — the most
  # confusing failure mode this service has.
  port_range_start: 50000
  port_range_end: 50200
  # TCP fallback for clients behind UDP-blocking networks (corporate proxies,
  # some hotel and airline wifi). Without it those users see a black tile.
  tcp_port: 7881
  # Behind NAT, LiveKit must advertise the address clients can actually reach
  # rather than the address it sees on its own interface, so it discovers the
  # public one at startup (via STUN / cloud metadata). On a VPS whose public IP
  # is on the NIC directly this is a no-op; leaving it on costs nothing and is
  # what makes the same config work behind a cloud NAT.
  use_external_ip: true

# ── Single-node, deliberately ────────────────────────────────────────────────
# Redis is what makes LiveKit multi-node: participants in one room may land on
# different SFU instances and still see each other. It is OFF here because the
# compose deployment CANNOT reach one — livekit runs with host networking (see
# docker-compose.prod.yml) so it is not on the `taskboard` bridge and cannot
# resolve `redis`, and that Redis publishes no host port, on purpose.
#
# Do not "fix" this by adding a redis block pointing at `redis:6379`. It will not
# resolve, and LiveKit fails at startup rather than silently degrading. A second
# SFU node needs a Redis reachable from the host network first — which means
# publishing it behind a source-IP allowlist, the way infra/host/db-allowlist.sh
# already does for Postgres.
#
# One node is not a small ceiling: room:max_participants below is 100, and the
# CPU limit in compose carries a few hundred concurrent streams.

# ── Recording (OFF) ──────────────────────────────────────────────────────────
# Call recording needs LiveKit Egress, which is a separate process that receives
# its work from this server over REDIS. The block below is what turns it on, and
# it is commented out on purpose: with no Redis reachable, adding it makes
# livekit-server FAIL AT STARTUP rather than degrade.
#
# Enable it with docker-compose.recording.yml, which publishes Redis on
# 127.0.0.1:6379 (this container is host-networked, so `redis` does not resolve)
# and starts the egress worker on the compose bridge. It carries a password, so
# it is APPENDED to a gitignored copy of this file by
# scripts/render-livekit-recording-config.sh rather than pasted in here. Editing
# either file needs a container RECREATE — a bind-mounted single file is not
# re-read on restart alone.
#
# redis:
#   address: 127.0.0.1:6379
#   password: <REDIS_PASSWORD>

# ── Room lifecycle callbacks (ON, and NOT part of recording) ─────────────────
# This is how messaging-svc finds out that somebody's browser vanished.
#
# It used to live only in the rendered recording config, and that coupling was a
# bug with a user-visible face: `docker compose up -d livekit` without the
# recording overlay silently recreated the SFU against THIS file, webhooks went
# away, and nothing logged anything. `participant_left` then never arrived,
# call_participants.left_at stayed NULL for every closed laptop, and
# ExpireHostlessCalls could not match at any grace value — so a meeting whose
# organiser shut their lid stayed LIVE and everyone in it stayed "Busy" to their
# colleagues, indefinitely. See services/messaging-svc/internal/store/
# calls_lifecycle.go, which is the whole reason these events are wanted.
#
# Webhooks need NO Redis and no egress: this server posts them itself. Recording
# is what needs Redis, which is why only that block is optional above.
webhook:
  # api_key is NOT here. It names which of LIVEKIT_KEYS' pairs signs the
  # callback, and it is supplied as LIVEKIT_WEBHOOK_API_KEY from the environment
  # (docker-compose.prod.yml) for the same reason the keys themselves are — so
  # no credential lands on disk in the repo or the image. LiveKit refuses to
  # start with urls set and no api_key resolved from anywhere, which is the
  # failure you get if that variable is missing.
  urls:
    # THE HOST IS DEPLOYMENT-SPECIFIC. Change it when running this stack
    # anywhere else; there is no interpolation in a LiveKit config file, and
    # `webhook.urls` is a list, so unlike api_key it has no environment
    # equivalent to fall back on.
    #
    # NOT /livekit/webhook — the edge proxies /livekit/* to THIS server, so that
    # URL would post the callback back to the SFU. messaging-svc is reached
    # under the /api/messaging prefix, which Caddy strips (infra/caddy/Caddyfile).
    - https://communication.rnrtechs.com/api/messaging/livekit/webhook

# Keys are supplied via the LIVEKIT_KEYS environment variable rather than this
# file, so the secret never lands on disk in the image or the repo.

logging:
  level: info
  # JSON so the log ships into the same pipeline as every other service.
  json: true

# Room defaults.
room:
  # Rooms are created implicitly when the first token-bearing participant joins,
  # because messaging-svc has already decided the room may exist — requiring an
  # explicit create call would mean a second place that can disagree about it.
  auto_create: true
  # Reap an empty room quickly. A call whose participants have all left should
  # not hold SFU resources; the database row is the durable record, not this.
  empty_timeout: 120
  # Hard ceiling per room. Well above the meeting sizes this product supports,
  # low enough that a runaway loop cannot exhaust a node.
  max_participants: 100

# TURN. coturn already runs on this host for the legacy 1:1 path; LiveKit's
# embedded TURN is left OFF so the two do not fight over ports 3478/5349.
turn:
  enabled: false

# Prometheus metrics — room/participant counts, forward jitter/latency,
# dropped-packet rate, webhook queue depth (livekit_* series). Verified
# directly against this pinned image (v1.13.5): the flat `prometheus_port` key
# still works but logs "prometheus_port is deprecated, please switch
# prometheus.port instead" at startup, so this uses the nested form. Adjacent
# to 7880/7881 rather than in the 8000s the rest of the platform's services
# use for /metrics, because this process is host-networked and has no
# compose-assigned port of its own — see infra/observability/prometheus.yml's
# livekit job and docker-compose.prod.yml's extra_hosts on the prometheus
# service for how a bridge-networked scraper reaches it.
prometheus:
  port: 7882
