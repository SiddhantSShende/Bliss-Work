# Prometheus scrape config. Scrapes each service's /metrics directly (once the
# Prometheus client is wired — Phase 5b) plus the OTEL Collector's forwarded
# metrics. Service ports are the in-container ports (compose network DNS names).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Security & reliability alert rules (Phase E). The rules/ directory is mounted
# into the prometheus container alongside this file. Add more *.yml here and
# they are picked up on reload.
rule_files:
  - /etc/prometheus/rules/*.yml

# Send firing alerts to Alertmanager (observability profile). DNS name + port
# are the in-network compose service; Prometheus pushes alerts to /api/v2/alerts.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics the OTEL Collector received over OTLP and re-exposes.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: auth-svc
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["auth-svc"]
        type: A
        port: 8001
    # Each DNS A record becomes a distinct target. Preserve the resolved
    # address as instance so every replica has independent time series.
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: task-svc
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["task-svc"]
        type: A
        port: 8002
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: notification-svc
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["notification-svc"]
        type: A
        port: 8003
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: messaging-svc
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["messaging-svc"]
        type: A
        port: 8004
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: ws-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["ws-gateway:8080"]

  # Read-composition GraphQL gateway. graphql_loader_batch_size is the series
  # that would catch it regressing into an N+1: if the p99 batch stays at 1
  # while pages grow, batching has stopped working and the gateway is costing
  # more than the client-side joins it replaced.
  - job_name: graph-gw
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["graph-gw"]
        type: A
        port: 8007
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: integrations-svc
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["integrations-svc"]
        type: A
        port: 8005
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: telemetry-svc
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["telemetry-svc"]
        type: A
        port: 8006
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # NOT SCRAPED: email-worker. It is a Kafka consumer with no HTTP listener and
  # no Prometheus client, so there is nothing to scrape — adding a job here would
  # only produce a permanently-down target. Giving it a metrics endpoint is a
  # code change to the service, tracked separately; until then its health is
  # visible only through its consumer lag (kafka-exporter, below) and its logs.

  # LiveKit and coturn run network_mode:host (docker-compose.prod.yml), so
  # neither has a compose service name — host.docker.internal resolves via the
  # extra_hosts entry on this service, the same way Caddy already reaches
  # LiveKit's 7880. Reachability of these two host ports from this bridge
  # container depends on the deployment's actual firewall rules and was not
  # verified beyond that Caddy's equivalent 7880 path already works in
  # production; confirm at deploy time rather than assuming.
  - job_name: livekit
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7882"]

  # room_total / participant_total / forward_jitter / forward_latency /
  # node_packet_total{type="dropped"} / webhook_queue_length — see
  # infra/livekit/livekit.yaml's prometheus: block for what's actually exposed
  # (verified against the pinned image, not the full published LiveKit
  # metrics list, some of which does not apply to a single-node deployment).

  - job_name: coturn
    metrics_path: /metrics
    # coturn's /metrics response carries no Content-Type header at all
    # (confirmed live: `wget -S` shows none) — Prometheus 3.x refuses to guess
    # a format for that and reports the target down with "non-compliant
    # scrape target sending blank Content-Type" unless told what to assume.
    # LiveKit's own /metrics (job above) sets a proper Content-Type and needs
    # no such hint.
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["host.docker.internal:9641"]

  # NOT SCRAPED: livekit-egress. Its health_port (docker-compose.recording.yml)
  # answers both / and /metrics with the same {"CpuLoad": N} JSON — verified
  # directly against the pinned image (v1.14.1) — not Prometheus exposition
  # format, so there is nothing here to scrape. It gets a Docker healthcheck
  # only; see docker-compose.recording.yml.

  # ── Infrastructure exporters ────────────────────────────────────────────────
  #
  # The four things that actually saturate first are the four that had no
  # instrumentation at all: every ceiling in this system announces itself as
  # connection exhaustion, Redis memory pressure, consumer lag or CPU throttling,
  # and none of that is visible from a service's own /metrics.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Per-container CPU/memory, which is how cgroup throttling and OOM-kills are
  # caught before a user reports them.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Pushgateway — the target for batch/cron-shaped jobs Prometheus cannot pull
  # from directly, specifically scripts/synthetic-call-check.mjs (see
  # docker-compose.yml's pushgateway service for the full "why a gateway at
  # all" reasoning). honor_labels: true is required for scraping a
  # Pushgateway: without it Prometheus would overwrite whatever job/instance
  # labels arrived with the push (e.g. job="synthetic_call") with this scrape
  # target's own (job="pushgateway"), which would break every alert and query
  # written against the pushed metric names.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
