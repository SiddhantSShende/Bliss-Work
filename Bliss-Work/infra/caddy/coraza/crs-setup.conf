# ─────────────────────────────────────────────────────────────────────────────
# OWASP CRS setup / tuning for the Task-Board edge.
# A trimmed `crs-setup.conf.example`. `load_owasp_crs` (in Caddyfile.waf) loads
# the CRS rule files themselves; this file only sets the CRS knobs that must be
# defined BEFORE those rules run.
# ─────────────────────────────────────────────────────────────────────────────

# ── Anomaly-scoring mode (CRS default & recommended) ──────────────────────────
# Each matching rule adds to an anomaly score; the request is blocked when the
# score crosses the threshold. Lower threshold = stricter. Start permissive
# while in DetectionOnly, then tighten.
SecAction \
  "id:900110,phase:1,pass,nolog,t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# ── Paranoia level ────────────────────────────────────────────────────────────
# PL1 = fewest false positives (recommended starting point). Raise to 2 once the
# baseline is clean and you want deeper coverage.
SecAction \
  "id:900000,phase:1,pass,nolog,t:none,\
   setvar:tx.blocking_paranoia_level=1,\
   setvar:tx.detection_paranoia_level=1"

# ── Sampling / enforcement ────────────────────────────────────────────────────
SecAction \
  "id:900400,phase:1,pass,nolog,t:none,\
   setvar:tx.sampling_percentage=100"

# ── Allowed HTTP methods / content types for a JSON API + SPA ─────────────────
SecAction \
  "id:900200,phase:1,pass,nolog,t:none,\
   setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"
SecAction \
  "id:900220,phase:1,pass,nolog,t:none,\
   setvar:'tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data| |text/plain|'"

# LiveKit Egress reports a finished recording as `application/webhook+json` —
# its own media type. Without this, CRS 920420 scores it critical (5), which
# alone exceeds the phase-1 threshold, and 949111 answers a bare 403: the file
# is written but nothing ever marks it READY, so the recording sits in
# RECORDING for ever and never becomes playable.
#
# ── Why this lives HERE and not in rules/99-tuning.conf ──────────────────────
# The include order is coraza.conf -> crs-setup -> @owasp_crs/* -> rules/*.
# Rules run in load order within a phase, so anything in rules/ executes AFTER
# 920420 has already scored and 949111 has already blocked; a
# `ctl:ruleRemoveById=920420` there is inert. This has to be set BEFORE the CRS
# reads it, which means before @owasp_crs/* is included.
#
# Scoped to the single URI: every other endpoint on this host should still
# refuse this content type. The body is NOT waved through — the JSON processor
# below keeps it parsed and inspected — and the route's real authentication is
# LiveKit's signature over the body, which messaging-svc verifies before
# believing any of it.
SecRule REQUEST_URI "@streq /api/messaging/livekit/webhook" \
  "id:1000120,phase:1,pass,nolog,t:none,\
   setvar:'tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data| |text/plain| |application/webhook+json|',\
   ctl:requestBodyProcessor=JSON"

# ── Early blocking: stop on the first rule that already exceeds threshold ──────
SecAction \
  "id:900120,phase:1,pass,nolog,t:none,\
   setvar:tx.early_blocking=1"
