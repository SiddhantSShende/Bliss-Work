# ─────────────────────────────────────────────────────────────────────────────
# Site-specific WAF tuning — Task-Board.
#
# This file is Included AFTER the OWASP CRS, so it can disable individual rules
# or add app-specific exceptions to kill false positives WITHOUT editing the CRS.
# Keep every change here so a CRS upgrade never clobbers your tuning.
#
# Rule IDs in this file must be in the 1,000,000–1,999,999 range (reserved for
# local rules) so they never collide with the CRS (900,000–999,999).
# ─────────────────────────────────────────────────────────────────────────────

# The JWKS endpoint serves a static JSON document of public keys (base64url
# blobs). CRS "suspicious string" heuristics can misfire on key material — keep
# it fast and unflagged.
SecRule REQUEST_URI "@streq /.well-known/jwks.json" \
  "id:1000100,phase:1,pass,nolog,ctl:ruleEngine=Off"

# WebSocket upgrade handshakes are long-lived and carry no inspectable body —
# don't run the body-heavy phases against the upgrade request.
SecRule REQUEST_HEADERS:Upgrade "@streq websocket" \
  "id:1000110,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-protocol"

# The httpOnly `refresh_token` cookie (auth-svc's cookies.py) is Path=/, so it
# rides on every same-origin request, including plain page loads. It is an
# opaque, server-generated token — never parsed as SQL by anything downstream,
# auth-svc's /auth/refresh handler treats it as an opaque blob — but its
# alphabet occasionally produces a run like "--" that libinjection's SQLi
# heuristic (942100) misreads as a SQL comment. That one match alone reaches
# the critical severity CRS assigns libinjection hits, which meets the
# inbound anomaly threshold on its own and 403s the whole navigation (seen
# live blocking authenticated GETs to /app/inbox and /app/meetings). Drop just
# this cookie from the rule's targets rather than lowering SQLi coverage
# generally.
SecAction \
  "id:1000130,phase:1,pass,nolog,t:none,\
   ctl:ruleRemoveTargetById=942100;REQUEST_COOKIES:refresh_token"

# NOTE: the LiveKit webhook's content-type exclusion is NOT here — it is in
# crs-setup.conf, because it has to be set BEFORE @owasp_crs/* is included.
# Anything in this file loads after the CRS, so a `ctl:ruleRemoveById` here for
# a phase-1 rule runs after that rule has already scored and is inert. Verified
# the hard way: the rule below did nothing until it moved.

# ── EXAMPLES (commented) — uncomment + adjust if a specific rule false-positives
# Disable a single noisy CRS rule globally:
# SecRuleRemoveById 920420
#
# Disable a rule for ONE path/param only (preferred — keeps coverage elsewhere):
# SecRule REQUEST_URI "@beginsWith /api/messaging/" \
#   "id:1000200,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:body"
