# Region A of a multi-region super-cluster. PRODUCTION SHAPE — see the warning
# below before trying to run it on one node.
#
# ── Why a GATEWAY and not a cluster route ────────────────────────────────────
#
# Routes form ONE cluster: every subject is flooded to every node, which over a
# WAN means paying inter-region bandwidth for traffic nobody in the other region
# subscribed to. Gateways connect distinct clusters and forward only what the
# far side has interest in — which is what makes "regions" a real boundary
# rather than one stretched cluster with a long cable.
#
# JetStream replication then happens at the STREAM layer (sources), not at the
# messaging layer: region B's EVENTS_IN_B sources region A's EVENTS_OUT_A, and
# only that stream's data crosses. See docs/CROSS-REGION.md.
#
# ── This file needs THREE nodes per region. It will not start on one. ────────
#
# JetStream + gateways means clustered JetStream, and nats-server refuses to
# start clustered JetStream without routes:
#
#   [FTL] Can't start JetStream: JetStream cluster requires configured routes
#         or solicited leafnode for the system account
#
# That is not a limitation to work around — a single-node region cannot hold a
# replicated stream, so a disk failure would lose the region's replication log.
# Verified empirically too: a "cluster" of one node routed to itself starts and
# accepts connections, but its JetStream meta-layer never leaves "Waiting for
# routing to be established" — it looks alive and is not. Use infra/nats/nats.conf
# for a single-node development server instead; it has no gateway and no domain,
# and the bridge runs against it happily with BRIDGE_PEER_REGIONS empty.
#
# ── This file is shared by all three of this region's nodes ─────────────────
#
# Only $NATS_SERVER_NAME differs between them (nats-a-1 / nats-a-2 / nats-a-3 —
# set per-container in docker-compose.crossregion.yml). Everything else,
# including the cluster route list, is identical across the three, so one
# tracked file describes the whole node instead of three that have to be kept
# in lockstep by hand.
#
# ── TLS and auth are MANDATORY here, unlike infra/nats/nats.conf ────────────
#
# Both the cluster routes (same-region, still worth encrypting since this is
# multi-tenant infra) and the gateway (leaves the region entirely, over a real
# WAN) require the file paths below to exist and be non-empty, or nats-server
# refuses to start rather than silently falling back to plaintext. Provision
# them with scripts/gen-nats-certs.sh — see docs/CROSS-REGION.md §7 for what has
# to exist on BOTH sides before a gateway to a real peer can be enabled.

server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# CLIENT port TLS — separate from, and not implied by, cluster.tls or
# gateway.tls below. Those secure node-to-node and region-to-region traffic
# only; without this block the client port (4222, what region-bridge dials)
# stays plaintext regardless of what the bridge's own NATS_TLS_* env vars ask
# for, and the connection fails as "secure connection not available" rather
# than silently running unencrypted — proven directly, not assumed. Reuses the
# same node cert: it already carries `clientAuth` alongside `serverAuth` (see
# scripts/gen-nats-certs.sh) and SANs covering nats-a-1/2/3, which is what a
# bridge connecting to any of the three needs.
tls {
  cert_file: /etc/nats/certs/server.crt
  key_file: /etc/nats/certs/server.key
  ca_file: /etc/nats/certs/ca.crt
  verify: true
  timeout: 5
}

jetstream {
  store_dir: /data/jetstream
  # NO `domain` HERE — deliberately, and not the same choice as it looks.
  # Distinct per-region domains are how JetStream is isolated over LEAF NODE
  # connections; this topology uses GATEWAYS (see the file header), and a
  # gateway between two JetStream-enabled clusters forms ONE JetStream
  # supercluster regardless of domain, with per-region isolation coming from
  # stream Placement instead (region-bridge's streams.Provision pins every
  # stream to Placement.Cluster == its own region). Verified directly: with
  # mismatched domains here, a gatewayed pair of 3-node regions reported one
  # merged 6-node meta-cluster and refused to place a new stream ("no suitable
  # peers for placement") — the domain and the gateway were fighting each
  # other, not cooperating. BRIDGE_PEER_API_PREFIXES stays in the bridge's
  # config surface for a possible future leaf-node topology, but is unused by
  # this one and should stay empty.
  max_file_store: 64GB
}

cluster {
  name: region-a
  listen: 0.0.0.0:6222
  # Three nodes minimum: JetStream needs a quorum to hold R=3, and R=3 is what
  # keeps one disk failure from losing events peers have not sourced yet.
  #
  # CREDENTIALS ARE EMBEDDED IN EACH URL, NOT LEFT TO THE authorization{} BLOCK
  # BELOW. Verified directly, the hard way: nats-server's `authorization` block
  # is NOT consulted when a server dials an EXPLICITLY listed route — only
  # routes discovered implicitly use it to decide what to present. A route list
  # with plain URLs and only the block below produces a connect/reject loop
  # (thousands of "authentication error" / "Authorization Violation" log lines
  # per second, not a handful at startup) because every node dials its peers
  # with no credentials at all and every peer correctly refuses them. The block
  # stays, because it IS what this server checks incoming connections against —
  # it is only the outbound half that needs the URL form too.
  #
  # __NATS_CLUSTER_PASSWORD__ is a render-time placeholder, not a
  # nats-server $VAR — see scripts/render-nats-conf.sh. That is deliberate, not
  # a style choice: nats-server's own $VAR substitution only replaces a token
  # that IS the variable; a variable concatenated with literal text in the same
  # token (exactly this case — `user:$VAR@host`) is left un-substituted rather
  # than rejected, so the failure is silent until routes refuse to connect.
  # Verified by direct A/B test: identical config, password embedded via
  # nats-server's $VAR produced the same connect/reject loop as no password at
  # all; the literal string did not.
  routes: [
    nats://nats-cluster:__NATS_CLUSTER_PASSWORD__@nats-a-1:6222
    nats://nats-cluster:__NATS_CLUSTER_PASSWORD__@nats-a-2:6222
    nats://nats-cluster:__NATS_CLUSTER_PASSWORD__@nats-a-3:6222
  ]
  authorization {
    user: nats-cluster
    password: __NATS_CLUSTER_PASSWORD__
    timeout: 2
  }
  tls {
    cert_file: /etc/nats/certs/server.crt
    key_file: /etc/nats/certs/server.key
    ca_file: /etc/nats/certs/ca.crt
    verify: true   # mutual TLS — a node presenting no cert, or the wrong CA, is refused
    timeout: 5
  }
}

gateway {
  name: region-a
  listen: 0.0.0.0:7222
  # PLACEHOLDER — not this region's own infrastructure. Fill in when region B's
  # real host is known — see scripts/render-nats-conf.sh and
  # infra/host/nats-gateway-allowlist.sh for what else has to be true first.
  #
  # `name` is a nats-server $VAR (a pure token substitutes fine — verified
  # directly). `url` is a placeholder for scripts/render-nats-conf.sh, not
  # a $VAR, and for the SAME reason the cluster routes above are: it has to
  # carry the gateway password embedded (explicit gateways read authorization{}
  # no more reliably than explicit routes do — assumed rather than separately
  # proven, given the routes case already cost real debugging time and this is
  # the same class of config), and a variable concatenated with literal text in
  # one token is exactly the substitution nats-server silently does not do.
  gateways: [
    { name: $PEER_REGION_NAME, url: __PEER_REGION_GATEWAY_URL__ }
  ]
  # Gateway TLS is over a real WAN, so this is the one place verify is not
  # optional at any deployment size. The two regions' CAs are exchanged
  # out-of-band when the peer is provisioned — see docs/CROSS-REGION.md §7 —
  # and each region's ca.crt here must be the PEER's CA, not its own, or the
  # handshake fails closed (which is the safe failure).
  tls {
    cert_file: /etc/nats/certs/server.crt
    key_file: /etc/nats/certs/server.key
    ca_file: /etc/nats/certs/gateway-peer-ca.crt
    verify: true
    timeout: 5
  }
  authorization {
    user: nats-gateway
    password: __NATS_GATEWAY_PASSWORD__
    timeout: 2
  }
}
