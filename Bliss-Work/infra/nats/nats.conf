# NATS JetStream — single node, for local development.
#
# One region's worth of NATS: enough to run the bridge's export path and see
# events land on the outbound stream. For the two-region loop you want
# region-a.conf + region-b.conf, which add the gateway that makes cross-region
# sourcing possible.
#
# PRODUCTION differs in three ways, all of them mandatory:
#   1. `cluster { … }` with at least three routes, so JetStream can hold R=3.
#      A single node means R=1 means one disk failure loses the replication log.
#   2. `gateways { … }` to the peer regions — see region-a.conf.
#   3. Authentication. This file has none, which is fine on a loopback-only dev
#      network and is not fine anywhere else. Use an operator/account NKEY setup
#      and point the bridge at it with NATS_CREDENTIALS.

server_name: nats-dev
listen: 0.0.0.0:4222
http: 0.0.0.0:8222          # /healthz, /varz, /jsz — the monitoring endpoints

jetstream {
  store_dir: /data/jetstream
  # Bounded so a runaway stream cannot fill the container's disk. The bridge
  # bounds its own streams too (BRIDGE_STREAM_MAX_GB); this is the backstop for
  # everything else that might use this server.
  max_memory_store: 256MB
  max_file_store: 4GB
}

# Keep a slow or dead consumer from growing the server's write queue without
# bound — the NATS-side equivalent of the bridge's own publish window.
max_payload: 8MB
write_deadline: "10s"
