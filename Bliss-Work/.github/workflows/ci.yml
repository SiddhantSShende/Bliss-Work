name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-flight runs for the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # LINT — static analysis across all three language ecosystems.
  # ───────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint (Python · ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff==0.8.6"
      - name: ruff check
        run: |
          ruff check \
            services/auth-svc \
            services/task-svc \
            services/email-worker \
            services/integrations-svc \
            services/shared/kafka_security \
            services/shared/crypto \
            services/shared/tracing \
            services/shared/internal_auth
      - name: ruff format --check
        # Formatting drift is surfaced but does not fail the build (no repo
        # style config committed yet); flip to blocking once a style is agreed.
        continue-on-error: true
        run: |
          ruff format --check \
            services/auth-svc \
            services/task-svc \
            services/email-worker \
            services/integrations-svc \
            services/shared/kafka_security \
            services/shared/crypto \
            services/shared/tracing \
            services/shared/internal_auth

  lint-go:
    name: Lint (Go · golangci-lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway, shared/kafkaauth, shared/internalauth]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: services/${{ matrix.service }}
          args: --timeout=5m

  lint-js:
    name: Lint (JS/TS · eslint + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc) — all workspaces
        run: npm run typecheck --workspaces --if-present
      - name: ESLint
        # `npm run lint --workspaces` was a NO-OP: --workspaces excludes the
        # root, and no workspace defines a `lint` script — so this step checked
        # nothing for as long as it existed, while looking green.
        #
        # eslint.config.mjs at the root already covers every workspace (flat
        # config, own ignores), so run it directly. Blocking, because its
        # headline rule is react/no-danger — the guard that keeps
        # dangerouslySetInnerHTML out of the codebase. A non-blocking XSS guard
        # is not a guard.
        run: npm run lint
      - name: Check migration filenames and duplicated SQL blocks
        # Runs here rather than in each service's own suite because the rule is
        # ONE rule over seven migration directories in three languages — a copy
        # per service would be the duplication this very check exists to catch,
        # and the four services with no Go/pytest coverage of their migrations
        # would still be unguarded.
        #
        # No database and no npm install beyond what this job already did: it
        # only reads filenames and file contents.
        run: node scripts/check-migrations.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD — compile the front-end bundles (web + desktop renderer).
  # ───────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (web + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @taskboard/web
      - run: npm run build -w @taskboard/desktop

      # The desktop app and the web app render the SAME packages/app, so they
      # should never differ in feature set — but they silently did for weeks
      # (the 0.1.0 installer had no Integrations, Mentions, Workspace apps or
      # Export Tasks while the web app had all four, and its updater could never
      # fetch a fix). Compare the built bundles, since that is what users run.
      - name: Check web/desktop bundle parity
        run: node scripts/check-bundle-parity.mjs

      # A `github` provider on this PRIVATE repo is unreadable by
      # electron-updater and fails silently at runtime — that is exactly how
      # 0.1.0 became permanently un-updatable. Catch it in the static config
      # here; release.yml re-checks the value actually baked into the artifact.
      # The website and the web app each keep their own hand-maintained copy of
      # the installer filenames, in separate repos, synced by nothing but a
      # comment. Pin the web app's copy to build.<os>.artifactName — the only
      # thing that decides what actually lands on the download host — so it can
      # neither 404 nor drift from the website's copy.
      - name: Check download links match what the desktop build produces
        run: node scripts/check-download-links.mjs

      - name: Check the desktop update feed is the generic VPS feed
        run: |
          node -e '
            const pkg = require("./apps/desktop/package.json");
            const pub = pkg.build?.publish?.[0] ?? {};
            const wantUrl = "https://communication.rnrtechs.com/downloads";
            if (pub.provider !== "generic" || pub.url !== wantUrl) {
              console.error(
                `apps/desktop/package.json build.publish must be ` +
                `{provider:"generic", url:"${wantUrl}"}, got ` + JSON.stringify(pub));
              process.exit(1);
            }
            console.log("✓ desktop publish config is the generic VPS feed");
          '

  # ───────────────────────────────────────────────────────────────────────────
  # TEST — unit/integration tests per ecosystem.
  # ───────────────────────────────────────────────────────────────────────────
  test-python:
    name: Test (Python · pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # telemetry-svc was MISSING from this list. Its unit suite existed and
        # had never run in CI once — so every change to it merged on the
        # strength of whoever remembered to run pytest locally, and ruff was the
        # only automated check it got. A test that does not run is not a test.
        #
        # Keep this in step with the directories under services/ that have a
        # pytest.ini; the pip-audit matrix below carries the same obligation.
        service: [auth-svc, task-svc, telemetry-svc, email-worker, integrations-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps (runtime + dev/test)
        working-directory: services/${{ matrix.service }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (unit — BLOCKING; integration suites run via -m integration)
        # Unit suites are self-contained (no live Postgres/Kafka) and now GATE
        # the build. The `integration` marker selects the testcontainers suites,
        # which run in their own job with Docker available.
        working-directory: services/${{ matrix.service }}
        run: |
          . .venv/bin/activate
          pytest -m "not integration" --cov=app --cov-report=term-missing

  test-python-shared:
    # Each services/shared/<pkg> is its own local package (installed by every
    # service that needs it via a local path requirement, not copied), so its
    # own suite needs its own job — it has no app/ directory and
    # pytest --cov=app above would not reach it.
    name: Test (Python · shared ${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [kafka_security, crypto, tracing, internal_auth]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps
        working-directory: services/shared/${{ matrix.pkg }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: pytest
        working-directory: services/shared/${{ matrix.pkg }}
        run: |
          . .venv/bin/activate
          pytest

  test-integration:
    name: Test (Python · integration / testcontainers)
    runs-on: ubuntu-latest
    # ubuntu-latest runners have Docker, so testcontainers spins a real Postgres.
    strategy:
      fail-fast: false
      matrix:
        # auth-svc: RLS isolation. integrations-svc: mentions API + claim→task
        # idempotency against a real Postgres. task-svc: the internal by-title
        # delete endpoint's org-scoping (see docs/AUTH_AUTHZ_REMEDIATION_PLAN.md
        # Phase 1). Extend as integration suites grow.
        service: [auth-svc, integrations-svc, task-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create venv and install deps (runtime + dev/test)
        working-directory: services/${{ matrix.service }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest -m integration (real Postgres via testcontainers)
        working-directory: services/${{ matrix.service }}
        run: |
          . .venv/bin/activate
          pytest -m integration -p no:cacheprovider

  test-go:
    name: Test (Go · go test -race)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway, shared/kafkaauth, shared/internalauth]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: go build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      - name: go test -race
        working-directory: services/${{ matrix.service }}
        run: go test -race -count=1 ./...

  # ws-gateway presence against a REAL Redis.
  #
  # Split from the matrix above because it needs a service container and only
  # one service uses it. The tests skip themselves when REDIS_TEST_URL is unset,
  # so the matrix job stays a pure unit run — but presence correctness lives in
  # Redis semantics (ZADD's added-count, exclusive score bounds, TTLs), and a
  # fake would test this package's assumptions rather than Redis's behaviour.
  # Those assumptions are exactly what changed when presence stopped being a SET
  # and started expiring, which is the bug that had users showing online for
  # days after their gateway was killed.
  test-go-integration:
    name: Test (Go · ws-gateway presence vs Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/ws-gateway/go.sum
      - name: go test -race (integration)
        working-directory: services/ws-gateway
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: go test -race -count=1 ./internal/store/ -run Integration -v

  # messaging-svc's object-store backend against a real S3 API.
  #
  # Same reasoning as the Redis job: what this code depends on is the SERVER's
  # behaviour — that a seek becomes a ranged GET, that a server-side copy commits
  # a content-addressed key, that a prefix delete erases exactly one org. A stub
  # would assert our beliefs about S3 rather than S3.
  test-go-s3:
    name: Test (Go · messaging-svc blobs vs MinIO)
    runs-on: ubuntu-latest
    services:
      minio:
        image: bitnami/minio:latest
        ports: ["9000:9000"]
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: blisswork-test
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/messaging-svc/go.sum
      - name: go test -race (object store)
        working-directory: services/messaging-svc
        env:
          S3_TEST_ENDPOINT: 127.0.0.1:9000
          S3_TEST_BUCKET: blisswork-test
        run: go test -race -count=1 ./internal/blob/ -run S3Integration -v

  test-js:
    name: Test (JS/TS · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: vitest / npm test (all workspaces)
        run: npm test --workspaces --if-present

  # ───────────────────────────────────────────────────────────────────────────
  # SECURITY-SCAN — dependency + filesystem + image vulnerability scanning.
  # Non-blocking where appropriate, but always surfaced in the job log / SARIF.
  # ───────────────────────────────────────────────────────────────────────────
  security-trivy-fs:
    name: Security (Trivy · filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # Uploading SARIF needs code scanning, which on a PRIVATE repo needs a paid
      # GitHub Code Security licence. Without one this step fails with "Code
      # scanning is not enabled for this repository" — and because it was
      # blocking, it failed the whole job, which failed CI, which is what made
      # Deploy Production and Release Desktop skip. A results-storage feature we
      # don't have a licence for must not gate shipping.
      #
      # The security signal is NOT lost: the blocking table scan below still
      # fails the build on any CRITICAL. This step only decides whether the
      # findings also land in the Security tab. Same posture as the semgrep
      # upload in security-extra.yml. Drop continue-on-error once a Code
      # Security licence is in place.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy filesystem scan (table, fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security-trivy-image:
    name: Security (Trivy · image)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          [auth-svc, task-svc, email-worker, notification-svc, messaging-svc, ws-gateway, integrations-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: taskboard/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: taskboard/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Surfaced but non-blocking — base-image CVEs shouldn't gate merges.
          exit-code: "0"

  security-go:
    name: Security (Go · govulncheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-svc, messaging-svc, ws-gateway, shared/kafkaauth, shared/internalauth]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: services/${{ matrix.service }}
        run: govulncheck ./...

  security-python:
    name: Security (Python · pip-audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # telemetry-svc omitted here too, so its dependencies were never audited
        # for known vulnerabilities. It carries the same FastAPI/SQLAlchemy/
        # aiokafka stack as its siblings, so it was exposed to every advisory
        # they were — with nothing watching.
        service: [auth-svc, task-svc, telemetry-svc, email-worker, integrations-svc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"
      - name: pip-audit
        run: pip-audit -r services/${{ matrix.service }}/requirements.txt

  security-npm:
    name: Security (npm · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high+, production deps)
        # Blocking, scoped to production deps, WITH a justified allowlist.
        #
        # Plain `npm audit --audit-level=high --omit=dev` is all-or-nothing:
        # either it blocks merges on advisories that have no fix and cannot be
        # exploited here, or someone makes it non-blocking and it stops
        # protecting anything. The gate fails on everything except a small set
        # of advisories, each recorded in scripts/audit-gate.mjs with a reason,
        # evidence that this app doesn't reach the vulnerable path, and a review
        # date. A NEW advisory always fails — the allowlist keys on the advisory
        # id, not the package.
        run: node scripts/audit-gate.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # HELM-LINT removed 2026-08-27: deploy/helm/taskboard was deleted from the
  # repo in commit 3bcc7778 (2026-08-24). This job used to degrade to a
  # ::warning:: and skip lint/template/kubeconform when the chart was absent
  # rather than fail, so its removal produced zero CI signal for weeks — that
  # silent-skip behavior is itself the reason to delete the job outright now
  # instead of leaving a permanent no-op. If a Helm chart is rebuilt (see
  # INFRASTRUCTURE.md's "Helm chart completed" update note, and Part B.1 of
  # the scaling roadmap), re-add this job WITHOUT the presence-check escape
  # hatch — a missing chart should fail the job, not skip it.
  # ───────────────────────────────────────────────────────────────────────────
  # E2E — full stack via docker compose, seeded, then the cross-org authz suite.
  # (Preserved from the original pipeline; gated behind cheaper checks.)
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (compose · seed · security-authz)
    runs-on: ubuntu-latest
    needs: [lint-js, test-go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.example .env && npm run gen:keys
      # auth-svc runs as uid 10001 and mounts ./keys read-only, but gen:keys
      # writes the private key 0600 owned by whoever ran it (uid 1001 on a
      # runner). The container therefore could not read its OWN signing key,
      # died in lifespan startup with PermissionError, never went healthy, and
      # took the whole compose stack — and this job — down with it.
      #
      # Chowning to the container user is what production already does (its
      # keypair is 0600 owned by 10001); loosening the mode instead would put a
      # world-readable private key in every developer's checkout.
      - name: Give the dev keypair to the container user (uid 10001)
        run: sudo chown -R 10001:10001 keys
      - run: docker compose up -d --build
      - run: bash scripts/wait-for.sh
      - run: npm run seed
      - name: Cross-org authorization regression
        run: npm run test:authz
      - name: Internal-service-secret identity regression
        run: npm run test:internal-token-identity
      - if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-logs
          path: compose-logs.txt
