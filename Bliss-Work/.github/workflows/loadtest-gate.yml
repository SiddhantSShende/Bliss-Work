name: Load Test Gate

# A12 in the scaling roadmap: turn "we load-tested it once, by hand" into a
# standing tripwire against the baselines already measured and documented in
# loadtest/README.md. Nightly, NOT per-PR — this is deliberately a capacity
# tripwire, not a merge gate, so it never blocks or slows down a PR.
#
# Safety: this workflow only ever stands up and targets the ephemeral
# docker-compose stack it builds in THIS job, on THIS runner (127.0.0.1
# published ports, torn down when the job ends — same "up -d --build" the E2E
# job in ci.yml already uses). There is no secret, host, or credential in this
# workflow that could point it anywhere else, and loadtest/ci-gate.sh carries
# the same `*-prod-*` unhealthy / load-average guard loadtest/step.sh has, as
# defense in depth if it's ever run by hand on a box that also runs prod.
on:
  schedule:
    - cron: "17 3 * * *" # nightly, ~03:17 UTC — off the hour to dodge the scheduler's thundering herd
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # let an in-flight nightly run finish; a manual dispatch queues behind it

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  k6-capacity-gate:
    name: k6 capacity gate (dev compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.example .env && npm run gen:keys
      # Same fix as ci.yml's E2E job: auth-svc runs as uid 10001 and mounts
      # ./keys read-only; gen:keys writes the private key 0600 owned by the
      # runner's own uid, so the container can't read its own signing key
      # unless this chown happens first.
      - name: Give the dev keypair to the container user (uid 10001)
        run: sudo chown -R 10001:10001 keys
      - run: docker compose up -d --build
      - run: bash scripts/wait-for.sh

      # ── Provision + seed to the same shape the documented baselines were
      # measured against. Reuses the exact scripts loadtest/README.md's own
      # Run 1/Run 2 numbers came from — an unseeded/lightly-provisioned stack
      # would make the README's thresholds meaningless (an empty DB sustains
      # ~1,000rps vs. ~400rps seeded, per the README's own Run 1 caveats).
      - name: Provision a load-test account pool
        working-directory: loadtest
        env:
          COUNT: "50" # ~1 account per 10rps of intended load (RATE=420 default in ci-gate.sh)
        run: ./provision.sh
      - name: Seed a realistic data volume (messaging)
        # Exact invocation loadtest/seed.sql and seed2.sql document in their own
        # headers (each sets `\set ON_ERROR_STOP on` internally, so a failed
        # statement aborts the load rather than continuing past it silently).
        run: |
          docker compose exec -T postgres psql -U taskboard -d messagingdb -f - < loadtest/seed.sql
          docker compose exec -T postgres psql -U taskboard -d messagingdb -f - < loadtest/seed2.sql

      # ── The gate itself: one CONST_RPS hold at ~420rps (inside the
      # documented 400-450rps sustainable-with-headroom band, short of the
      # ~500rps knee), asserted against loadtest/README.md's measured
      # baselines. See loadtest/ci-gate.sh for the exact thresholds and why.
      - name: Run the k6 capacity gate
        working-directory: loadtest
        run: ./ci-gate.sh

      - if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-gate-results
          path: |
            loadtest/results/
            compose-logs.txt
          retention-days: 14
