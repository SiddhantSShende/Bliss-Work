name: Store Release (Microsoft Store)

# Builds the BlissWork .appx package for Microsoft Store submission, on a
# Windows runner (electron-builder's `appx` target requires win32 or darwin —
# see apps/desktop/build/build-appx.sh). This is SEPARATE from release.yml
# (which builds the direct-download NSIS/dmg/AppImage installers and deploys
# them to the VPS) — Store submissions are a different distribution channel,
# reviewed manually in Partner Center, so this workflow never auto-publishes;
# it just produces a signed-by-nobody .appx as a downloadable artifact for you
# to upload to Partner Center yourself.
#
# Unlike direct-download installers, Store packages do NOT need your own code
# signing certificate — Microsoft signs the package during certification.
#
# Trigger: manually (workflow_dispatch) or push a `store-v*` tag.
#
# ── Required repository secrets ──────────────────────────────────────────────
# STORE_IDENTITY_NAME  — from Partner Center → your app → App identity (e.g. "AEIVGlobalPrivateLimited.BlissWork")
# STORE_PUBLISHER_ID   — from the same page (e.g. "CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX")
#
# Both only exist after you've reserved the app name in Partner Center — see
# apps/desktop/STORE.md. The job fails with a clear message if they're unset.
#
# ── Optional: fully automated submission ─────────────────────────────────────
# Set these to also push the build straight into a new Partner Center draft
# submission via Microsoft's msstore-cli (skipped cleanly if unset — you'd
# still review + submit for certification by hand in Partner Center):
#   AZURE_STORE_TENANT_ID  AZURE_STORE_CLIENT_ID  AZURE_STORE_CLIENT_SECRET  STORE_APP_ID
# (App registration + Partner Center API access setup: see apps/desktop/STORE.md)

on:
  push:
    tags:
      - "store-v*"
  workflow_dispatch:

concurrency:
  group: store-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build-appx:
    name: Build .appx (Microsoft Store)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Surfaced from secrets so `if:` gates can test presence without exposing values.
      STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER_ID: ${{ secrets.STORE_PUBLISHER_ID }}
      AZURE_STORE_CLIENT_ID: ${{ secrets.AZURE_STORE_CLIENT_ID }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [[ -z "$STORE_IDENTITY_NAME" || -z "$STORE_PUBLISHER_ID" ]]; then
            echo "::error::STORE_IDENTITY_NAME and/or STORE_PUBLISHER_ID repo secrets are not set." >&2
            echo "::error::Reserve the app name in Partner Center first, then add both secrets — see apps/desktop/STORE.md." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        env:
          # See release.yml — same build-time bake, same optional semantics.
          TB_GOOGLE_API_KEY: ${{ secrets.TB_GOOGLE_API_KEY }}
        run: npm run build -w @taskboard/desktop

      - name: Package .appx
        working-directory: apps/desktop
        shell: bash
        run: |
          npx --no-install electron-builder \
            --win \
            --config.win.target=appx \
            --config.appx.identityName="$STORE_IDENTITY_NAME" \
            --config.appx.publisher="$STORE_PUBLISHER_ID" \
            --publish=never

      - name: Upload .appx
        if: always()   # the .appx is built before any (spurious) publish step; capture it regardless
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blisswork-store-appx
          path: apps/desktop/release/*.appx
          if-no-files-found: error
          retention-days: 30

      # Optional: create/update a Partner Center draft submission automatically.
      # Skipped cleanly when the Azure app registration secrets are absent.
      - name: Submit to Partner Center (msstore-cli)
        if: env.AZURE_STORE_CLIENT_ID != ''
        env:
          AZURE_STORE_TENANT_ID: ${{ secrets.AZURE_STORE_TENANT_ID }}
          AZURE_STORE_CLIENT_SECRET: ${{ secrets.AZURE_STORE_CLIENT_SECRET }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
        shell: bash
        run: |
          dotnet tool install --global Microsoft.Store.CLI
          msstore reconfigure \
            --tenantId "$AZURE_STORE_TENANT_ID" \
            --clientId "$AZURE_STORE_CLIENT_ID" \
            --clientSecret "$AZURE_STORE_CLIENT_SECRET"
          msstore publish "apps/desktop/release" --appId "$STORE_APP_ID" --noCommit
          echo "Draft submission updated — review it in Partner Center before publishing."
