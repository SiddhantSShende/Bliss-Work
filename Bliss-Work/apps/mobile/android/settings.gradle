pluginManagement {
  // Groovy's native List.execute(envp, dir) (Runtime.exec/ProcessBuilder
  // under the hood) instead of Gradle's providers.exec{}.standardOutput
  // Provider API for this identical kind of "ask node where a package
  // lives" call — matches the idiom app/build.gradle's own react{} block
  // already uses for entryFile/reactNativeDir/hermesCommand/codegenDir/
  // cliFile, so this isn't a new pattern for this project.
  def reactNativeGradlePlugin = new File(
    ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    ["node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'BlissWorkMobile'

expoAutolinking.useExpoVersionCatalog()

include ':app'
