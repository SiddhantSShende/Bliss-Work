<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy — kept at PARITY with apps/web/index.html, which
      was the stricter of the two. This copy previously omitted object-src,
      base-uri, form-action and font-src, making the desktop shell the weaker
      target of the pair despite running with more local privilege.

      connect-src stays NARROWER than the web app's on purpose: a packaged
      desktop build only ever talks to the hosted backend (or localhost in dev),
      so it names those origins explicitly rather than allowing https:/wss: at
      large. blob: is in img-src for locally previewed file transfers.

      media-src carries mediastream: for call audio AND the API origins, because
      chat video/audio attachments stream from the backend. It needs the origins
      spelled out separately from img-src: media-src does NOT fall back to
      img-src, it falls back to default-src ('self'), so a <video> pointed at
      the API would be blocked with a console-only violation and no UI signal.

      %CSP_CONNECT_SRC%, %CSP_IMG_SRC% and %CSP_MEDIA_SRC% are substituted at
      build time from the SAME resolveEndpoints() call the renderer and main
      process use — see the
      cspPlugin in electron.vite.config.ts. They used to be hardcoded to the
      hosted origin while src/shared/endpoints.ts advertised full VITE_*
      overridability, so repointing a build at another backend produced an app
      whose every request was CSP-blocked, with nothing in the build output
      saying why. One source of truth now.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: %CSP_IMG_SRC%; font-src 'self' data:; media-src 'self' data: blob: mediastream: %CSP_MEDIA_SRC%; connect-src 'self' %CSP_CONNECT_SRC%; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BlissWork</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="./theme-init.js"></script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
