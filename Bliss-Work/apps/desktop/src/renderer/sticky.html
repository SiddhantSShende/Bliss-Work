<!doctype html>
<html lang="en" class="light sticky-window">
  <head>
    <meta charset="UTF-8" />
    <!--
      Same lockdown as the main window (index.html), minus connect-src: these
      windows make NO network calls of their own — every byte arrives over IPC
      from the ws-process — so connect-src is 'none' rather than an allowlist.
      They render user-supplied task titles and chat messages, so object-src,
      base-uri and form-action matter here just as much as in the main document;
      they were simply missing before.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Task</title>
    <style>
      /*
        The note is a frameless, `transparent: true` window: everything except
        the task card itself must let the desktop through, so that what floats
        is a card and not a slab of BlissWork chrome.

        Scoped to the .sticky-window class on <html> ON PURPOSE. The bundled
        app stylesheet (packages/ui theme.css) sets an OPAQUE
        `body { background: var(--color-bg) }`, and Vite injects its <link>
        AFTER this block — so a plain `body { background: transparent }` here
        has equal specificity, loses on source order, and the window paints the
        whole app page background behind the card. The class raises specificity
        above the theme rule, which makes the result independent of wherever
        the bundler decides to put the stylesheet.
      */
      html.sticky-window,
      html.sticky-window body,
      html.sticky-window #root {
        background: transparent;
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./sticky.tsx"></script>
  </body>
</html>
