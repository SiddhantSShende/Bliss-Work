# ─────────────────────────────────────────────────────────────────────────────
# Task-Board — PRODUCTION compose (single-host / small scale).
#
# INTENDED USE: one production host (or a small VM), behind TLS, for a modest
# user base or a staging/preview environment. It is the "one box" deployment.
# For real horizontal scale, HA, rolling deploys and autoscaling, a Helm chart
# on Kubernetes would be the complement to it — NOTE: no such chart exists in
# this repository today (no deploy/ or helm/ directory); comments below that
# reference one describe an intended future path, not something you can `helm
# install` right now.
#
# DIFFERENCES from the dev docker-compose.yml (which this file does NOT replace):
#   • All secrets come from the ENVIRONMENT / a secrets file (env_file: .env.prod)
#     — there are NO hardcoded dev passwords or tokens here.
#   • Per-service resource limits (deploy.resources.limits) cap blast radius.
#   • restart: unless-stopped on every long-running service.
#   • Internal service ports are NOT published to the host. Only the reverse
#     proxy (Caddy) exposes 80/443. Browsers reach services through Caddy.
#     THE ONE EXCEPTION is postgres:5432, published for admin access and gated
#     by a source-IP allowlist — see the ⚠️ note on that service, and run
#     infra/host/db-allowlist.sh on the host before bringing it up.
#   • /readyz healthchecks gate dependency ordering and the proxy's upstreams.
#   • Mailpit / observability dev conveniences are dropped.
#
# BRING UP:
#   1. Provision keys/  (see docs/OPERATIONS.md — Ed25519 keypair, gitignored).
#   2. Create .env.prod from .env.example with REAL secrets (never commit it).
#   3. Point your DNS A/AAAA record at this host and set DOMAIN in .env.prod.
#   4. docker compose -f docker-compose.prod.yml up -d --build
#
# `deploy.resources.limits` AND `deploy.replicas` are both honoured by
# `docker compose up` (Compose v2) without Swarm. The rollout keys
# (update_config / rollback_config) are not — a future Kubernetes/Helm
# deployment would own those; see the note at the top of this file.
#
# ── Horizontal scale on one host ─────────────────────────────────────────────
#
# Every stateless HTTP service below runs TWO replicas, and the Caddy edge
# distributes across them: infra/caddy/Caddyfile* resolves each compose service
# name on a timer, and Docker's embedded DNS answers it with the address of
# EVERY container behind it. There is no address list to keep in step.
#
# Before this there was one container per service, so a single process handled
# every request in the platform for that service. A slow query, a GC pause, an
# OOM or an ordinary restart was therefore felt by every user simultaneously,
# and the only lever available was a bigger box. Two replicas make a restart a
# rebalance instead of an outage, and make added capacity a flag rather than a
# migration:
#
#     docker compose -f docker-compose.prod.yml up -d --scale task-svc=4
#
# The edge picks those up within ~10s with no reload and no edit. Two is the
# baseline that survives losing one, not a ceiling.
#
# ── What the fleet costs Postgres, and why it fits ───────────────────────────
#
# Replicas multiply POOLS, not just processes, and connection slots are the
# scarcest thing in this stack — see services/auth-svc/app/db.py for the history
# (the pools once summed to 121 against a Postgres allowing 97, which surfaced
# as blanket 500s). The arithmetic at two replicas:
#
#   6 HTTP services x 10 max backends x 2 replicas   = 120
#   email-worker (asyncpg 4+4, single instance)      =   8
#                                                      ───
#                                                      128   of max_connections=200
#
# That leaves ~70 slots for psql, the exporters and headroom. Raising a replica
# count by one costs ANOTHER 10 slots for that service; past roughly 4 replicas
# each this needs pgbouncer in front of Postgres (a future Helm-based
# deployment's job — see the note at the top of this file) rather than a
# bigger max_connections, because 200 backends would not be healthy on 8 cores.
#
# ── What is deliberately NOT replicated ──────────────────────────────────────
#
#   ws-gateway     Every gateway registers WS_ADVERTISE_ADDR in Redis as "how to
#                  reach the node holding this socket", and in compose that value
#                  is the service name (.env.prod: http://ws-gateway:8080) —
#                  which under replicas resolves to ALL of them. A cross-node
#                  push would then land on a gateway that does not hold the
#                  socket, roughly (N-1)/N of the time. Secondarily, broadcast
#                  fan-out keys each gateway's Kafka group to its hostname, so
#                  the group churns on every recreate and the new one starts at
#                  the tip. A gateway fleet is a WS_FANOUT_MODE=routed +
#                  delivery-svc + per-replica advertise-address decision (see
#                  that service below), not a `--scale` one.
#   email-worker   Pure Kafka consumer. Members beyond the topic's partition
#                  count simply idle, so raise partitions first.
#   postgres,      Single-instance data and media tiers. Replicating these is a
#   redis, kafka,  different project with its own failure modes — see
#   livekit        INFRASTRUCTURE.md.
#
# NOT IN THIS FILE: call recording. It needs a LiveKit Egress worker and a Redis
# the SFU can reach, which this topology deliberately does not have — so it lives
# in docker-compose.recording.yml as an opt-in overlay. docs/RECORDING.md is the
# procedure, including what your users must be told before you enable it.
# ─────────────────────────────────────────────────────────────────────────────
name: task-board-prod

# Shared defaults for the application services. Each reads its non-secret
# config plus every secret — including the per-callee X-Internal-Token
# values — from this single .env.prod. Every application service below just
# inherits this env_file entry via `<<: *svc-defaults`; none re-lists its own.
#
# This used to be split further: auth-svc, task-svc, messaging-svc,
# integrations-svc, ws-gateway, delivery-svc and email-worker each re-listed
# `env_file:` to layer in ONLY the internal-service-secret file(s) they
# actually needed, so a service that never called a given callee never
# received that callee's secret. See the dated addendum in
# docs/AUTH_AUTHZ_REMEDIATION_PLAN.md, Phase 2, for why that per-service
# isolation was traded for a single merged file.
x-svc-defaults: &svc-defaults
  restart: unless-stopped
  env_file:
    # Copy .env.prod.example → .env.prod and fill in REAL secrets before `up`.
    # required:false so tooling (e.g. `config -q`, CI lint) works before the
    # operator has placed the secrets file on the host; `up` will fail loudly if
    # the secrets are genuinely absent.
    - path: .env.prod
      required: false
  networks: [taskboard]
  # ── Runtime hardening (mirrors the Helm securityContext) ────────────────────
  # The app services are stateless, run as non-root uid 10001, and listen on high
  # ports, so they need NO Linux capabilities and NO writable root filesystem.
  #   • cap_drop ALL: drop the entire default capability set.
  #   • read_only root + tmpfs /tmp: an exploit can't persist to disk; the only
  #     writable path is an in-memory /tmp (mounted secrets stay read-only).
  # NOTE: `no-new-privileges` is intentionally NOT set — on this host's Docker it
  # makes execve fail with EPERM for BOTH the Python venv console-script and the
  # Go static binaries (an overlayfs/no_new_privs interaction). It's redundant
  # here anyway: non-root uid 10001 + cap_drop ALL leaves nothing to escalate to.
  # PID limits are handled per-service via deploy.resources.limits.
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  # The Postgres CA bundle is mounted read-only into EVERY app service at
  # /etc/ssl/db/ca.crt so the *_DATABASE_URL `sslmode=verify-full&sslrootcert=…`
  # can validate the server's certificate chain. ws-gateway doesn't talk to
  # Postgres, but the harmless extra mount keeps the anchor DRY. Services that
  # declare their own `volumes:` (auth-svc) must re-list this mount because YAML
  # `<<:` merge REPLACES list keys, it does not concatenate them.
  volumes:
    - ./infra/postgres/certs/ca.crt:/etc/ssl/db/ca.crt:ro
  # No `ports:` — application services are internal-only and reached via Caddy.

services:
  # ── Web build + static host ────────────────────────────────────────────────
  web-builder:
    # Node 22: the root `engines` floor is >=22.13.0 and the lockfile carries
    # packages that refuse anything older (react-native 0.87, metro 0.87,
    # electron 42). On 20 every `npm ci` printed EBADENGINE for all of them.
    # Keep in step with .nvmrc and apps/web/Dockerfile.
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    restart: "no"
    working_dir: /workspace
    env_file:
      - path: .env.prod
        required: false
    environment:
      npm_config_update_notifier: "false"
      # Stamped into the bundle so you can tell WHICH commit is live from the
      # browser. `make prod-deploy` exports IMAGE_TAG as the deployed commit
      # SHA; without it (a hand-run `docker compose up`) the build says "dev".
      # Vite only exposes VITE_-prefixed vars to client code.
      VITE_BUILD_SHA: "${IMAGE_TAG:-dev}"
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/node_modules
      - web_dist:/dist
    # --ignore-scripts: apps/desktop depends on get-windows, a native module with
    # no musl prebuild whose install script fails on Alpine and takes the whole
    # `npm ci` with it. Vite needs no install scripts — esbuild and @swc ship
    # their binaries as optional dependency packages — so skipping them is both
    # the fix and one less place arbitrary install-time code runs.
    command: >-
      sh -lc "npm ci --ignore-scripts && npm run build -w @taskboard/web && rm -rf /dist/* && cp -a apps/web/dist/. /dist/"

  # Desktop installers, built the same way the web bundle is: a one-shot
  # container that runs on `docker compose up` and exits. `docker compose up`
  # therefore refreshes BOTH apps — the web bundle via web-builder above, and
  # the downloadable desktop app here — with no CI system in the loop.
  #
  # WINDOWS IS BUILT ON LINUX, via Wine in this image. The .exe target is nsis,
  # which electron-builder can produce under Wine, so Windows users get updates
  # from this host without a Windows machine anywhere.
  #
  # macOS CANNOT be built here, by Apple's design: a .dmg must be produced and
  # signed on macOS. Those installers are skipped, and skipping is safe because
  # each platform has its own update feed (latest.yml / latest-mac.yml /
  # latest-linux.yml) — leaving latest-mac.yml alone leaves mac users exactly
  # where they are rather than pointing them at something that isn't there.
  #
  # Runs under the `desktop` profile so it is opt-in:
  #     docker compose -f docker-compose.prod.yml --profile desktop up desktop-builder
  # A desktop build is ~10 minutes and downloads Electron; making every routine
  # `up` pay that (including each deploy, which runs `up -d`) would turn a
  # 40-second service restart into a coffee break. The web bundle still rebuilds
  # on every plain `up`, as before.
  desktop-builder:
    image: electronuserland/builder:wine
    profiles: [desktop]
    restart: "no"
    # Runs `bash scripts/build-desktop-container.sh` directly as PID 1 (exec-form
    # command below, no shell wrapper) — without an init, PID 1 gets Linux's
    # "no explicit handler = ignore" treatment for SIGTERM/SIGINT, so a `docker
    # compose stop` or Ctrl+C during the long, silent electron-builder --win step
    # did nothing until the grace period expired and SIGKILL hit, which no trap
    # (including the version-restore one in the script) can catch. `init: true`
    # runs tini as PID 1 instead, which forwards signals to the script properly.
    init: true
    working_dir: /workspace
    environment:
      npm_config_update_notifier: "false"
      # Leave unset to auto-bump the patch of whatever is currently published —
      # see scripts/next-desktop-version.mjs for why package.json can't be the
      # source of truth. Set explicitly for a minor/major bump.
      DESKTOP_VERSION: "${DESKTOP_VERSION:-}"
      # Baked into the main bundle so Chromium's network location provider
      # works. OPTIONAL: without it, sharing a location falls back to the
      # server's city-level IP lookup instead of a precise fix. Restrict the key
      # to the Geolocation API and put a quota on it — it ships inside the
      # installer. See apps/desktop/src/main/geo-key.ts.
      TB_GOOGLE_API_KEY: "${TB_GOOGLE_API_KEY:-}"
    volumes:
      - ./:/workspace
      # Separate from web_node_modules: this image runs a different Node major,
      # and sharing the tree would have each build clobber the other's native
      # rebuilds.
      - desktop_node_modules:/workspace/node_modules
      # Electron and its build cache are ~500MB. Persisted so a rebuild is
      # minutes rather than a fresh download every time.
      - desktop_electron_cache:/root/.cache/electron
      - desktop_builder_cache:/root/.cache/electron-builder
      # The live download directory — nginx mounts this same path read-only.
      - /home/ubuntu/BlissWork/downloads:/downloads
      - /home/ubuntu/BlissWork/downloads-backup:/downloads-backup
    # Exec form (a LIST, not a string): compose word-splits an inline string
    # command, so `bash -lc "a; b; c"` would arrive as argv ["bash","-lc","a;",
    # "b;","c"] and run only the first fragment. The script keeps the logic
    # out of YAML entirely, where $ and quote escaping are their own trap.
    command: ["bash", "scripts/build-desktop-container.sh"]

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      web-builder:
        condition: service_completed_successfully
    volumes:
      - web_dist:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Desktop app installers, served at communication.rnrtechs.com/downloads/*
      # AND blisswork.rnrtechs.com/downloads/* (both hosts proxy /downloads/* here
      # via Caddy), so there's a single installer set on the VPS. Read-only.
      #
      # Deliberately NOT inside Bliss-Website/dist: that directory is Vite build
      # output, and `npm run build` empties it — a website rebuild used to delete
      # every installer and update manifest. This path is owned by the release
      # pipeline alone (release.yml rsyncs here; VPS_PATH must match).
      - /home/ubuntu/BlissWork/downloads:/srv/downloads:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    networks: [taskboard]

  # ── Reverse proxy / TLS termination ─────────────────────────────────────────
  # Caddy is the ONLY service that publishes host ports. It terminates TLS
  # (automatic certs via Let's Encrypt / ZeroSSL using the ACME HTTP-01
  # challenge on :80) and reverse-proxies to the internal services by name.
  #
  # DNS: create an A/AAAA record for ${DOMAIN} → this host's public IP so ACME
  # can validate. For a private CA or pre-provisioned certs, mount them and use
  # `tls /etc/caddy/cert.pem /etc/caddy/key.pem` in the Caddyfile instead of the
  # automatic-HTTPS email line.
  #
  caddy:
    # Custom Caddy compiled with the Coraza WAF (OWASP CRS) — see infra/caddy/Dockerfile.
    # ROLLBACK: revert to `image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17`
    # + the plain Caddyfile mount below, and recreate.
    #
    # This was pinned to a literal `:2.11` and deliberately kept out of the
    # SHA-tag/prune/rollback bookkeeping. That is safe only while the image never
    # leaves this host: published to a shared registry, a fixed tag lets every
    # WAF or Caddyfile change overwrite the same manifest, so there is nothing to
    # roll back TO and two hosts can disagree about what `:2.11` means. It is now
    # tagged like every other built image, and `make prod-deploy` tracks it.
    build: ./infra/caddy
    image: ${REGISTRY_PREFIX:-task-board}/caddy-waf:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 challenge + HTTP→HTTPS redirect
      - "443:443"   # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      # `:?` — REQUIRED, not optional. caddy is the one service that does NOT
      # inherit `env_file: .env.prod` (it declares its own ports and volumes), so
      # these reach it only through compose INTERPOLATION, which reads `.env`.
      # Blank here is not a degraded mode: the Caddyfile gets a bare `email`
      # directive, Caddy refuses to parse it, and the TLS edge crash-loops — the
      # whole site goes down while every service behind it reports healthy.
      # Failing the deploy with a named variable beats discovering it from
      # user reports.
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env (the caddy edge reads it via interpolation, not .env.prod)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env (the caddy edge reads it via interpolation, not .env.prod)}
    # The ONLY upstream Caddy reaches by something other than a compose service
    # name. livekit runs with host networking (it needs a 200-port contiguous UDP
    # range), so it is not on the `taskboard` bridge and has no DNS name here —
    # the /livekit route in the Caddyfile proxies to host.docker.internal:7880
    # instead, which this line is what makes resolvable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/caddy/Caddyfile.waf:/etc/caddy/Caddyfile:ro  # WAF variant (Coraza, DetectionOnly)
      - ./infra/caddy/coraza:/etc/caddy/coraza:ro            # WAF engine config + CRS tuning
      - /home/ubuntu/BlissWork/Bliss-Website/dist:/srv/blisswork:ro  # BlissWork marketing site (static SPA)
      - caddy_data:/data     # persisted certs + ACME account (DO NOT lose this)
      - caddy_config:/config
    depends_on:
      nginx: { condition: service_healthy }
      auth-svc: { condition: service_healthy }
      task-svc: { condition: service_healthy }
      notification-svc: { condition: service_healthy }
      messaging-svc: { condition: service_healthy }
      ws-gateway: { condition: service_healthy }
    # Caddy had NO healthcheck, so it could not be in the deploy's health gate —
    # which is how a deploy once reported success with the TLS edge crash-looping
    # on an unparseable Caddyfile. Every service BEHIND the dead edge was healthy,
    # so the gate saw nothing wrong while the site was entirely unreachable.
    #
    # The admin API answers only when Caddy is running AND its config loaded; a
    # config Caddy refuses to parse makes it exit, so this probe fails exactly in
    # the case that used to be invisible. It listens on 127.0.0.1:2019 inside the
    # container only — nothing is exposed by probing it.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }
    networks: [taskboard]

  # ── WebRTC TURN relay (self-hosted coturn) ──────────────────────────────────
  # Relays call media for peers behind symmetric NAT. Uses HOST networking because
  # it needs a contiguous UDP relay-port range (min/max-port) that docker's
  # per-port publishing can't express. Credentials are short-lived HMAC (coturn
  # REST API): ws-gateway mints them at /turn-credentials using the SAME
  # TURN_SECRET, so coturn and the gateway never need to talk to each other. The
  # denied-peer-ip ranges stop a client from relaying to RFC1918 internal hosts
  # (TURN SSRF). Open on the host firewall: 3478/udp+tcp and 49160-49200/udp.
  # ── coturn (TURN relay) ─────────────────────────────────────────────────────
  #
  # ⚠️ THE RELAY PORT RANGE IS THE CAPACITY. coturn allocates ONE UDP port per
  # relay session, so the width of --min-port..--max-port is very nearly the
  # number of concurrent relayed calls this host can carry.
  #
  # It was 49160-49200 — 41 ports, roughly twenty calls, for the whole platform.
  # That ceiling is unusually hard to diagnose from the outside: only the
  # 10-20% of calls that cannot traverse NAT directly need a relay, so
  # exhausting it presents as a load-dependent minority of calls that connect
  # and then carry no media, while every other call works and nothing errors.
  #
  # 30000-49999 is ~20k ports. The real ceiling above that is bandwidth, not
  # port space, and the answer there is a coturn fleet behind DNS or anycast —
  # or managed TURN, which is a reasonable thing not to own.
  #
  # ⚠️ The range must be OPEN ON THE HOST (infra/host/harden-host.sh) or relays
  # fail silently for exactly the users who need them most.
  coturn:
    image: coturn/coturn:4.6-alpine@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be
    restart: unless-stopped
    network_mode: host
    command: >-
      -n --log-file=stdout --no-cli --no-tlsv1 --no-tlsv1_1
      --listening-port=3478 --min-port=30000 --max-port=49999
      --realm=${DOMAIN} --use-auth-secret --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set in .env.prod (coturn and ws-gateway mint HMAC credentials from it)}
      --fingerprint --no-multicast-peers
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --prometheus --prometheus-port=9641
    # --prometheus is coturn 4.6's own flag (verified against this exact pinned
    # image's `turnserver --help`, which documents plain GET / on this port as
    # a health check too) — no separate binary needed beyond the wget already
    # present in this alpine image. That / claim did NOT hold empirically
    # against this build (4.6.3): GET / returns 404, only /metrics returns
    # 200 (confirmed live against the running container, not just --help
    # text) — the healthcheck below targets /metrics for that reason. Same
    # network_mode:host posture as the SFU below: 9641 listens on every host
    # interface (there is no bridge to publish it to), so reaching it from the
    # bridge-networked prometheus container (see prometheus.yml) depends on the
    # SAME host firewall behavior that already lets Caddy reach LiveKit's 7880
    # today — verify 9641 is actually reachable from prometheus at deploy time;
    # this repo does not attempt to change the host firewall for it.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9641/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  # ── LiveKit SFU ─────────────────────────────────────────────────────────────
  #
  # The media plane for GROUP calls (channel calls and meetings). 1:1 calls
  # still use the peer-to-peer path through coturn above; this exists because
  # peer-to-peer does not survive a third participant — every client would have
  # to encode and upload a stream per peer.
  #
  # Only the control plane knows about authorization: messaging-svc mints a
  # short-lived, room-scoped token after checking the caller against Postgres,
  # and LiveKit trusts that token. LIVEKIT_API_SECRET is therefore a credential
  # of the same weight as a database password — anyone holding it can mint
  # themselves into any room.
  #
  # ⚠️ The UDP range MUST be reachable from clients. If 50000-50200/udp is
  # blocked, calls connect, show participants, and carry no audio or video —
  # which looks like an application bug and is not one. host networking is used
  # for exactly this reason: publishing 200 UDP ports through the bridge costs a
  # userland proxy process per port. infra/host/harden-host.sh opens the range.
  #
  # HOST NETWORKING HAS TWO CONSEQUENCES worth stating, because both have a
  # matching line elsewhere that must move with this one:
  #
  #   * This container is NOT on the `taskboard` bridge, so it cannot resolve
  #     any compose service name — `redis`, `postgres`, none of them. That is
  #     why infra/livekit/livekit.yaml runs single-node with its redis block
  #     off: pointing it at `redis:6379` would resolve to nothing.
  #   * Its 7880 signaling port listens on every host interface, NOT just
  #     loopback — it has to, or Caddy could not reach it from the bridge. ufw
  #     therefore has to keep 7880 closed to the public (harden-host.sh does not
  #     open it), and the only public door to it is the TLS-terminated
  #     /livekit route in the Caddyfile.
  livekit:
    # MUST stay in step with packages/app's livekit-client, and "in step" is
    # stricter than it sounds. This was v1.8.0 against livekit-client 2.21.0,
    # and the skew broke every group call in a way that looked like a capacity
    # limit: from 2.18.8 the client only treats a publisher negotiation as
    # finished when the server echoes the offer's id back in its answer
    # (SessionDescription.id, protobuf field 3), and v1.8.0's protocol has no
    # such field — so every answer decoded as id 0, the negotiation promise
    # never resolved, its 15s deadline fired, and the SDK dropped the session
    # and rejoined. Forever, for everyone, roughly every 15 seconds: the SFU log
    # was 230 sessions in 40 minutes, each one CLIENT_REQUEST_LEAVE at ~15.2s.
    # Nobody stayed in the room long enough to see a third person arrive.
    #
    # v1.9.1 is the first server that echoes the offer id, i.e. the minimum that
    # stops it. v1.13.5 is current stable and the one built against the protocol
    # generation client 2.21.0 comes from; it also serves the /rtc/v1 signal path
    # the client tries FIRST (the 404 in the browser console) while still
    # serving legacy /rtc, so cached clients keep working across the rollout.
    image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml"]
    environment:
      # key: secret, the format LiveKit expects. Kept in the environment rather
      # than the mounted config so the secret is not in the repo or the image.
      #
      # These two arrive by compose INTERPOLATION, like ${TURN_SECRET} on coturn
      # above — which reads `.env`, NOT the `env_file: .env.prod` that the
      # application services inherit. Bring the stack up with BOTH files
      # (`--env-file .env --env-file .env.prod`) or this resolves to ": " and
      # livekit-server refuses to start. messaging-svc reads its own copy of
      # LIVEKIT_* from .env.prod, so a mismatch here disables only the SFU.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # Which of those pairs signs the room-lifecycle callbacks the config file
      # asks for (infra/livekit/livekit.yaml, `webhook:`). Config-file-only in
      # LiveKit's own docs, but the server also reads it here — and it must come
      # from here, because the file is in the repo and this is a credential.
      #
      # Not optional: with `webhook.urls` set and no api_key resolved,
      # livekit-server exits at startup with "api_key is required to use
      # webhooks". That is the loud failure; the quiet one it replaced was
      # meetings that never ended.
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_API_KEY}"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    # GET / on the main port answers 200 "OK" without needing a valid token —
    # verified directly against this pinned image (v1.13.5), not assumed: it is
    # NOT a documented /healthz, just livekit-server's own root handler, and it
    # is the same check LiveKit Cloud/Helm deployments commonly use. It proves
    # the HTTP listener is alive, not that RTC media is flowing — this stack
    # has no cheap way to prove that beyond an actual room test (see
    # infra/observability/prometheus.yml's livekit job + livekit_* metrics for
    # the closer signal: room/participant counts and dropped-packet rate).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        # An SFU is CPU-bound on packet forwarding, not on transcoding — it does
        # not decode media. 2 cores carries a few hundred concurrent streams;
        # past that the honest fix is more SFU nodes, not a bigger limit — and
        # that step also needs a Redis the SFU can actually reach (see above).
        limits: { cpus: "2.00", memory: 1024M }
        reservations: { cpus: "0.50", memory: 256M }

  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
    restart: unless-stopped
    # IN-TRANSIT TLS (PROD-ONLY): even though Postgres is internal to the compose
    # network, prod encrypts client↔DB traffic so a compromised co-tenant /
    # sidecar / packet capture on the bridge can't read credentials or row data.
    #   • ssl=on with a server cert/key signed by our CA (see scripts/gen-db-certs.sh).
    #   • ssl_ca_file enables optional client-cert auth later; today it pins the
    #     chain the clients verify with sslmode=verify-full.
    #   • TLSv1.2 floor — drop legacy protocols.
    # The dev docker-compose.yml deliberately stays plaintext (sslmode=disable).
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgres/certs/server.key
      - -c
      - ssl_ca_file=/etc/postgres/certs/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.2
      # ── Capacity ──────────────────────────────────────────────────────────
      # Everything below was previously stock. Stock means max_connections=100
      # (97 after superuser_reserved_connections), and the services are
      # configured for 68 pooled connections PER REPLICA SET — with the OLD pool
      # sizes it was 121 at one replica each, i.e. a burst that filled overflow
      # on three services at once hit `FATAL: sorry, too many clients already`.
      # Because each service owns its own database there is no shared arbiter, so
      # it surfaced as blanket 500s across several services simultaneously rather
      # than as queueing.
      #
      # At the two replicas each service now runs (see the header note) the pools
      # can demand 128. 200 leaves real headroom over that without pretending 200
      # backends would be healthy on 8 cores — that is what the reduced pool
      # sizes are for (see services/*/app/db.py and store.go), and it is why the
      # replica counts are bounded by this number rather than by memory.
      - -c
      - max_connections=200
      # 25% of the 6144M limit below. Stock was 128MB.
      - -c
      - shared_buffers=1536MB
      # Honest now: cgroup v2 charges page cache against memory.max, so with a
      # 6144M limit and 1536MB of shared_buffers there really is ~4GB of cache
      # to plan against. Stock left this at 4GB while the container was capped
      # at 1536M total, which under-costed index scans on uncached tables.
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      # SSD-backed volume: random reads are nowhere near 4x the cost of
      # sequential, and the stock 4.0 pushes the planner toward seq scans.
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=4GB
    environment:
      # Superuser is used ONLY for init (creating per-service DBs + least-priv
      # roles). Application services connect as their own per-service users —
      # see infra/postgres/init/02-create-roles.sql and the *_DATABASE_URL vars.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Per-service role passwords, consumed by 02-create-roles.sql via psql vars.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      EMAIL_DB_PASSWORD: ${EMAIL_DB_PASSWORD}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD}
      INTEGRATIONS_DB_PASSWORD: ${INTEGRATIONS_DB_PASSWORD}
      STICKY_DB_PASSWORD: ${STICKY_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # TLS material: generate with scripts/gen-db-certs.sh (dev/staging) or mount
      # a real CA-issued server cert/key + CA bundle (prod). server.key MUST be
      # mode 0600 owned by root or the postgres user — the script sets this.
      - ./infra/postgres/certs:/etc/postgres/certs:ro
    # HOST-PUBLISHED (the ONE datastore that is) so you can point psql / DBeaver
    # / pgAdmin at this box instead of shelling into the container.
    #
    # ⚠️ ufw DOES NOT PROTECT THIS. Docker's DNAT + FORWARD rules run BEFORE the
    # ufw chains, so `default deny incoming` is irrelevant to a published port —
    # on its own, this line puts the production DB on the public internet. What
    # actually gates it is a source-IP allowlist in the DOCKER-USER chain,
    # installed by infra/host/db-allowlist.sh. That script MUST be run on the
    # host BEFORE this container is (re)created, and re-run whenever the allowed
    # IP changes. If `nmap -Pn -p 5432 <host>` from an unlisted address reports
    # anything other than `filtered`, re-run it.
    #
    # The explicit `0.0.0.0:` prefix binds IPv4 only — deliberate, because the
    # ip6tables DOCKER-USER chain carries no matching allowlist.
    ports:
      - "0.0.0.0:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        # Raised from 1536M. cgroup v2 charges the page cache against this
        # limit, so the old ceiling had to cover shared_buffers, ~100 backends
        # at 5-10MB each, AND the page cache for seven databases — on a 22 GiB
        # host with 12 GiB sitting idle. The reservation keeps a co-located
        # image build or a runaway service from squeezing the one process whose
        # cache-hit ratio decides every other service's latency.
        limits: { cpus: "2.00", memory: 6144M }
        reservations: { cpus: "1.00", memory: 2048M }
    networks: [taskboard]

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    # AUTH: requirepass is ALWAYS on in prod (no anonymous access on the shared
    # network). The matching password rides in REDIS_URL as
    #   rediss://:${REDIS_PASSWORD}@redis:6379/0   (see .env.prod.example).
    #
    # TLS — read docs/OPERATIONS.md §7 before enabling. Redis can serve TLS via
    # `--tls-port 6379 --port 0 --tls-cert-file … --tls-key-file … --tls-ca-cert-file …`
    # (mount infra/redis/certs from scripts/gen-db-certs.sh REDIS=1). HONEST
    # CAVEAT: ws-gateway connects with go-redis `ParseURL`, whose `rediss://`
    # path validates the server cert against the SYSTEM root store and does NOT
    # load a private CA from the URL. A SELF-SIGNED Redis CA therefore won't
    # verify without a ws-gateway code change. The verifying prod path is a
    # MANAGED Redis (ElastiCache / Upstash / Redis Cloud) whose cert chains to a
    # public CA — then `rediss://` "just works". This bundled Redis is left on
    # `requirepass` over the PRIVATE compose network (never exposed off-host);
    # flip in the TLS flags below only with a publicly-trusted cert or after the
    # ws-gateway custom-CA follow-up.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      # ── Memory ceiling ────────────────────────────────────────────────────
      # Without maxmemory Redis does not degrade under pressure, it gets
      # OOM-killed by the cgroup — taking replay, presence and RTC signaling
      # with it, and dropping every socket in the deployment at once.
      #
      # noeviction is deliberate. This instance is the source of truth for the
      # per-user replay outbox, so evicting a key silently loses catch-up data
      # for whichever user Redis happened to pick. Failing the write loudly is
      # recoverable — the event is still durable in Kafka and Postgres — and it
      # surfaces as an alert instead of as users quietly missing messages.
      #
      # ── Why 4gb and not 400mb ─────────────────────────────────────────────
      # SIZE THIS FROM THE OUTBOX, NOT FROM THE CONTAINER. The replay outbox
      # stores FULL EVENT COPIES, one per recipient, trimmed at maxReplayHard
      # (2000) on a 7-day TTL that is REFRESHED ON EVERY APPEND. So the resident
      # population is everyone active in the last week, not everyone online now
      # — a distinction worth about two orders of magnitude.
      #
      # A message.created event is ~500 B of JSON, and a ZSET member costs
      # ~700 B all-in once the sds header, skiplist node and dict entry are
      # counted. At 50 events/day that is ~245 KB per user per week, so 400mb
      # held roughly 1,500 weekly actives — a few hundred if any of them reached
      # the trim cap. The gateway's WS_MAX_CONNECTIONS=25000 was therefore
      # advertising a capacity the datastore could not survive by ~100x.
      #
      # This matters more than it looks because noeviction applies to the WHOLE
      # KEYSPACE. When the outbox fills the instance, presence ZADDs, the node
      # registry and the shared rate-limit buckets start failing too — so the
      # symptom is not "some users lose catch-up history", it is a presence
      # outage and a replay outage in the same instant.
      #
      # 2gb is ~8k weekly actives at the same assumptions — a 5x lift, and as
      # far as THIS HOST goes. The compose file already declares ~19 GiB of
      # memory limits on a 22 GiB box, and Postgres (6144M) and Redis are the
      # two that genuinely grow into theirs: Postgres because cgroup v2 charges
      # the page cache against the limit, Redis because the dataset is the
      # limit. Taking Redis to 4gb+ oversubscribes the host rather than the
      # ceiling, and the failure mode moves from "Redis refuses a write" to
      # "the kernel picks a victim", which is strictly worse.
      #
      # PAST 8k WEEKLY ACTIVES, RAISING THIS NUMBER IS THE WRONG MOVE. The next
      # step is Redis off-host — managed ElastiCache/Upstash, or the cluster
      # client that internal/store already supports via a comma-separated
      # REDIS_URL. That is a provisioning decision, not a config one.
      #
      # Re-derive rather than copying: the honest input is `redis-cli INFO
      # memory` plus ZCARD on a few live outbox keys, because the 500 B event
      # figure is the assumption most likely to be wrong.
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
      # ── Opt-in TLS (managed-CA / post-code-follow-up only) ──
      # - --tls-port
      # - "6379"
      # - --port
      # - "0"
      # - --tls-cert-file
      # - /etc/redis/certs/server.crt
      # - --tls-key-file
      # - /etc/redis/certs/server.key
      # - --tls-ca-cert-file
      # - /etc/redis/certs/ca.crt
    volumes:
      - redisdata:/data
      # - ./infra/redis/certs:/etc/redis/certs:ro   # uncomment with TLS above
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        # MOVES WITH --maxmemory ABOVE. The limit has to cover the dataset, the
        # AOF rewrite buffer, and the copy-on-write fork during a BGREWRITEAOF,
        # which in the worst case duplicates dirty pages. 3G against a 2gb
        # dataset is ~50% headroom for that fork; giving Redis exactly its
        # maxmemory means the cgroup kills it mid-rewrite, which is the failure
        # the ceiling exists to prevent.
        #
        # CPU raised from 0.50 for a separate reason. Redis is single-threaded
        # for command execution, so this is a share of ONE core, and presence
        # heartbeats are the largest Redis workload in the platform by design:
        # at a 45s beat with two ZADDs plus amortized EXPIREs, 1M sockets is
        # ~55k ops/sec. Half a core does perhaps 40k total. At today's scale
        # presence is only ~1.4k ops/sec so this is not yet binding — it is
        # raised now so the tier is not the thing that caps the next 10x.
        limits: { cpus: "2.00", memory: 3G }
        reservations: { cpus: "0.50", memory: 1G }
    networks: [taskboard]

  # ── Kafka ─────────────────────────────────────────────────────────────────
  # IN-TRANSIT ENCRYPTION (read docs/OPERATIONS.md §6 before changing):
  #
  #   The bundled single broker speaks PLAINTEXT — IDENTICAL to dev — and is NOT
  #   the recommended production message bus (RF=1, no HA, no auth). For real
  #   production durability AND wire encryption, run Kafka EXTERNALLY (managed
  #   MSK / Confluent Cloud / Redpanda, or self-hosted Strimzi on Kubernetes)
  #   with a SASL_SSL listener, and point the producers/consumers at it by setting
  #   KAFKA_BROKERS + the KAFKA_SECURITY_* client vars in .env.prod (§6).
  #
  #   IMPORTANT HONEST CAVEAT: the in-tree clients (aiokafka in the Python
  #   services, segmentio/kafka-go in ws-gateway) currently read ONLY
  #   KAFKA_BROKERS — they do NOT yet wire security.protocol / SASL / TLS from
  #   env. Enabling SASL_SSL end-to-end therefore needs a small CODE follow-up in
  #   each client (out of scope for this transit-hardening config change). The
  #   broker-side SASL_SSL listener recipe and the client env contract are both
  #   documented in docs/OPERATIONS.md §6 so the wiring is ready when that lands.
  #   Until then this single broker stays PLAINTEXT on the private compose
  #   network and MUST NOT be exposed off-host.
  kafka:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # ── SASL_SSL listener recipe (for an EXTERNAL/multi-broker prod cluster) ──
      # Mount infra/postgres/certs/ca.crt (or a dedicated Kafka CA) + a broker
      # keystore/truststore, then replace the listener block above with, e.g.:
      #   KAFKA_LISTENERS: SASL_SSL://:9092,CONTROLLER://:9093
      #   KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:9092
      #   KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      #   KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL
      #   KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      #   KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      #   KAFKA_SSL_KEYSTORE_LOCATION / _PASSWORD, KAFKA_SSL_TRUSTSTORE_LOCATION / _PASSWORD
      # See docs/OPERATIONS.md §6 for the full broker + client recipe.
      #
      # NOTE: single-broker KRaft. RF>1 (and the prod topic settings in
      # infra/kafka/create-topics.sh) require a MULTI-broker cluster — run Kafka
      # externally (managed MSK/Confluent/Redpanda) for HA.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 1536M }
    networks: [taskboard]

  kafka-init:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: kafka:9092
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-12}
      # On a multi-broker prod cluster set REPLICATION_FACTOR=3 (see the script).
      REPLICATION_FACTOR: ${REPLICATION_FACTOR:-1}
    entrypoint: ["bash", "/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    restart: "no"
    networks: [taskboard]

  # ── Application services ─────────────────────────────────────────────────────
  # Built from the SAME hardened Dockerfiles as dev. Pin a release tag via
  # ${IMAGE_TAG} so a host can pull a known-good build instead of building.
  auth-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/auth-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/auth-svc/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/auth-svc:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    # env_file inherited from x-svc-defaults (.env.prod, which now also
    # carries AUTH_INTERNAL_TOKEN — see the Phase 2 addendum).
    volumes:
      - ./keys:/keys:ro   # Ed25519 keypair — provisioned per-env, gitignored.
      # Re-listed (not inherited) — see the x-svc-defaults note: `<<:` replaces
      # the `volumes:` list rather than merging it.
      - ./infra/postgres/certs/ca.crt:/etc/ssl/db/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/readyz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two replicas behind the Caddy load balancer (see the header note).
      # Stateless: the rate limiter is Redis-backed and the outbox poller
      # claims rows FOR UPDATE SKIP LOCKED, so a second replica shares the work
      # rather than duplicating it.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 512M }

  email-worker:
    <<: *svc-defaults
    build:
      # Repository root, not services/email-worker: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/email-worker/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/email-worker:${IMAGE_TAG:-latest}
    # email-worker CALLS auth-svc, messaging-svc and integrations-svc's
    # /internal/* routes. env_file inherited from x-svc-defaults (.env.prod
    # now carries every *_INTERNAL_TOKEN — see the Phase 2 addendum).
    # Pure Kafka consumer — no HTTP port, no /readyz. Liveness is process-up.
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

  task-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/task-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/task-svc/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/task-svc:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    # env_file inherited from x-svc-defaults (.env.prod carries both
    # TASK_INTERNAL_TOKEN and MESSAGING_INTERNAL_TOKEN — see the Phase 2 addendum).
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/readyz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two replicas behind the Caddy load balancer (see the header note).
      # Stateless — same reasoning as auth-svc.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 512M }

  notification-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/notification-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/notification-svc/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/notification-svc:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8003/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two replicas behind the Caddy load balancer (see the header note).
      # Stateless — same reasoning as auth-svc. Its Kafka consumer
      # joins a fixed group, so partitions are split across replicas.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 384M }

  messaging-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/messaging-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/messaging-svc/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/messaging-svc:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    # env_file inherited from x-svc-defaults (.env.prod carries
    # MESSAGING_INTERNAL_TOKEN, which validates callers of its 5
    # /internal/* routes — see the Phase 2 addendum).
    # Chat attachment bytes live on a named volume. `read_only: true` from the
    # anchor still applies — a volume mount stays writable regardless — and it is
    # the ONLY writable path in the container (/tmp is a small in-memory tmpfs,
    # which is why uploads spool here and not there).
    #
    # ⚠️ YAML `<<:` merge REPLACES list keys rather than concatenating them, so
    # declaring `volumes:` here DROPS the anchor's Postgres CA mount. It must be
    # re-listed or `sslmode=verify-full` fails on the next restart. auth-svc has
    # the same trap.
    volumes:
      - ./infra/postgres/certs/ca.crt:/etc/ssl/db/ca.crt:ro
      - media_blobs:/var/lib/blisswork/media
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8004/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two replicas behind the Caddy load balancer (see the header note).
      # Safe to replicate HERE specifically because all replicas mount
      # the SAME media_blobs volume on the same host — an upload accepted by one
      # is readable by the others. A Kubernetes deployment would need to pin this
      # at 1 replica for the opposite reason: pods get separate disks there.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 384M }

  integrations-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/integrations-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/integrations-svc/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/integrations-svc:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    # env_file inherited from x-svc-defaults (.env.prod carries both
    # INTEGRATIONS_INTERNAL_TOKEN and MESSAGING_INTERNAL_TOKEN — see the Phase 2 addendum).
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/readyz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two replicas behind the Caddy load balancer (see the header note).
      # Stateless — same reasoning as auth-svc.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 384M }

  telemetry-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/telemetry-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/telemetry-svc/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/telemetry-svc:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/readyz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two replicas behind the Caddy load balancer (see the header note).
      # Stateless — same reasoning as auth-svc.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 384M }

  # Durable record of which task notes belong on which desktop. Consumes
  # task.events.v1 and keeps one row per (org, assignee, task): OPEN from
  # assignment, CLOSED only on a terminal status. Stores no task title or
  # description — those stay encrypted in taskdb.
  #
  # NOTE: stickydb is NOT created by the postgres init SQL on an existing
  # volume. Run scripts/create-sticky-db.sh once before the first deploy or this
  # container crash-loops on a missing database.
  sticky-svc:
    <<: *svc-defaults
    build:
      # Repository root, not services/sticky-svc: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/sticky-svc/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/sticky-svc:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    # env_file inherited from x-svc-defaults (.env.prod carries
    # STICKY_INTERNAL_TOKEN, which validates callers of /internal/pins/undelivered
    # — see the Phase 2 addendum).
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/readyz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two replicas behind the Caddy load balancer. Stateless — same reasoning
      # as auth-svc. The Kafka consumer group makes the pair share partitions
      # rather than double-consume.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 384M }

  # Delivery watchdog for the desktop notes: nudges users whose open pins were
  # never confirmed as received, so an assignment lost to a reconnect still
  # reaches the desktop it was meant for.
  sticky-relay:
    <<: *svc-defaults
    build:
      # Repository root: go.mod replaces shared-kafkaauth with the sibling
      # module services/shared/kafkaauth.
      context: .
      dockerfile: services/sticky-relay/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/sticky-relay:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    # env_file inherited from x-svc-defaults. sticky-relay SENDS the
    # STICKY_INTERNAL_TOKEN that sticky-svc validates.
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      sticky-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      # ONE replica, deliberately, unlike everything else here. There is no
      # throughput reason for a second sweeper. Concurrent sweeps are safe —
      # sticky-svc claims the rows it hands out — but two would only halve the
      # effective backoff for no benefit.
      replicas: 1
      resources:
        limits: { cpus: "0.25", memory: 128M }

  ws-gateway:
    <<: *svc-defaults
    build:
      # Repository root, not services/ws-gateway: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/ws-gateway:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    # env_file inherited from x-svc-defaults (.env.prod carries both
    # WS_GATEWAY_INTERNAL_TOKEN — validates /internal/push, also what
    # delivery-svc below uses to call it — and MESSAGING_INTERNAL_TOKEN,
    # used by the delivery-ack dispatcher to call /internal/messages/delivered).
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # No `replicas:` — one gateway. WS_ADVERTISE_ADDR is the compose service
      # name, which under replicas resolves to all of them and misroutes
      # cross-node pushes; see the header note and the delivery-svc block.
      resources:
        # SIZE THIS WITH WS_MAX_CONNECTIONS, NOT INDEPENDENTLY.
        #
        # A websocket costs 64 KiB here. That is MEASURED, not added up from a
        # parts list: a freshly restarted gateway holding 4,000 idle sockets sat
        # at 268.5 MB VmRSS against a 21.1 MB baseline — 64,864 bytes marginal
        # per socket — with go_memstats_sys_bytes tracking RSS almost exactly.
        # Reproduce with loadtest/ws-step.sh.
        #
        # The earlier figure here was ~40 KB, reasoned from the parts a socket
        # was believed to allocate. The parts list was incomplete: the gateway
        # runs 3.02 goroutines per connection, not two. Anything derived from
        # 40 KB was ~1.6x optimistic.
        #
        #   1 GiB - 21 MiB baseline = 1003 MiB, less 20% GC headroom = 802 MiB,
        #   / 64 KiB = ~12,800 sockets -> WS_MAX_CONNECTIONS=12000
        #
        # These two numbers are a pair: raising the cap without raising this
        # makes the cap unreachable, and the container is OOM-killed instead of
        # cleanly refusing the connection — which is the entire point of having
        # a cap. It was previously 384M against a 50,000 default (~6,000 real
        # capacity, a cap 8x out of reach).
        limits: { cpus: "1.00", memory: 1G }

  # ── delivery-svc (routed fan-out) ───────────────────────────────────────────
  #
  # OFF BY DEFAULT: this service only does anything once ws-gateway is switched
  # to WS_FANOUT_MODE=routed, and running it alongside the broadcast path is
  # harmless but pointless. Start it with:
  #
  #   docker compose --profile routed up -d delivery-svc
  #
  # WHAT IT REPLACES. Each gateway pod subscribes to Kafka under a group id
  # unique to itself, so every pod receives every event on every fan-out topic
  # and discards the ones addressed to users it does not hold. Kafka egress and
  # replay-outbox writes therefore scale with POD COUNT rather than with
  # traffic. This reads the stream ONCE under a shared consumer group, computes
  # each event's recipients once, writes the outbox once, and pushes each
  # gateway only its own users.
  #
  # MIGRATION. Delivery is idempotent end to end — the outbox write is a ZADD of
  # the same member and clients dedupe on eventId — so this can run while the
  # gateways are still broadcasting. Watch ws_push_sent_total climb and
  # ws:fanout_discarded:ratio fall, then flip gateways to routed one at a time.
  # There is no flag day and no coordinated restart.
  #
  # Same image as ws-gateway, different entrypoint: one module, one domain.
  delivery-svc:
    <<: *svc-defaults
    profiles: [routed]
    build:
      # Repository root, not services/ws-gateway: the Dockerfile needs the
      # sibling services/shared/* packages as local path dependencies.
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/ws-gateway:${IMAGE_TAG:-latest}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    entrypoint: ["/usr/local/bin/delivery-svc"]
    # env_file inherited from x-svc-defaults. delivery-svc only CALLS
    # ws-gateway nodes' /internal/push, using WS_GATEWAY_INTERNAL_TOKEN
    # (it never talks to messaging-svc).
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      # Overrides the image's default probe, which targets the gateway's 8080.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        # Holds no sockets — it is a Kafka consumer and an HTTP client, so it is
        # sized for throughput rather than for connection count. Scale it by
        # replica up to the partition count of the fan-out topics.
        limits: { cpus: "1.00", memory: 256M }

  # The web SPA is built in the `web-builder` service and served by nginx.
  # Caddy stays in front for TLS termination and request routing. The Electron
  # desktop client runs on end-user machines, not here.

  # ── Observability ────────────────────────────────────────────────────────────
  #
  # These used to exist only under the dev `observability` profile, which meant
  # production ran with no metrics, no traces and no alerting — `journalctl` and
  # a customer email were the monitoring. Every service already exports OTLP and
  # exposes /metrics; nothing was collecting any of it.
  #
  # This is the first thing to fix before scaling anything, and not as a matter
  # of taste: autoscaling, connection pooling and multi-replica rollouts all
  # change behaviour under load in ways you cannot reason about from logs. You
  # cannot safely scale what you cannot see.
  #
  # ALL of these bind to 127.0.0.1 only. They are operator tools reached over an
  # SSH tunnel, never through Caddy — Prometheus and Grafana have no auth worth
  # the name in this configuration, and /metrics is already 404'd at the edge
  # (see infra/caddy/Caddyfile's @introspection rule).
  # ── Read-composition GraphQL gateway ───────────────────────────────────────
  # OPTIONAL by design. It fronts a few READ paths; writes, uploads, exports,
  # auth and realtime all keep talking to the services directly. A stack without
  # it works, and a web bundle built without VITE_GRAPH_BASE never calls it — so
  # this can be deployed dark and switched on by rebuilding the bundle.
  graph-gw:
    <<: *svc-defaults
    build:
      # Repository root, not services/graph-gw: this service is a workspace
      # member and imports @taskboard/shared. See its Dockerfile.
      context: .
      dockerfile: services/graph-gw/Dockerfile
    image: ${REGISTRY_PREFIX:-task-board}/graph-gw:${IMAGE_TAG:-latest}
    environment:
      # In-network addresses — the gateway sits WITH the services and does not
      # go back out through the edge to reach them.
      AUTH_BASE: http://auth-svc:8001
      MESSAGING_BASE: http://messaging-svc:8004
      NODE_ENV: production
      IMAGE_TAG: ${IMAGE_TAG:-dev}
    depends_on:
      auth-svc: { condition: service_healthy }
      messaging-svc: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1, not localhost: Node binds IPv4 only and busybox wget tries
      # ::1 first. See the note in the Dockerfile.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8007/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      # Two behind the Caddy load balancer, like the other stateless services.
      # Nothing is held between requests: the DataLoader cache is per request by
      # construction, so a second replica shares load rather than splitting a
      # cache in half.
      replicas: 2
      resources:
        limits: { cpus: "1.00", memory: 512M }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Bounded retention: this shares a disk with Postgres and the media
      # volume, and an unbounded TSDB is a slow way to take the database down.
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=8GB"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9091:9090"]
    networks: [taskboard]
    # LiveKit and coturn run network_mode:host (see their own comments above)
    # and so have no compose service name to resolve — same reason Caddy
    # reaches LiveKit's 7880 via host.docker.internal rather than `livekit`.
    # The livekit/coturn scrape targets below need this to resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # Pushgateway — see docker-compose.yml's identical service (the dev stack)
  # for why this exists: Prometheus only ever PULLS, and the synthetic call
  # check (scripts/synthetic-call-check.mjs, docs/OBSERVABILITY-ALERTS.md) is
  # a batch job that runs, reports one result, and exits, so there is no live
  # process for prometheus above to scrape at the moment it actually ran.
  # Unlike the dev stack this is NOT profile-gated — every other service in
  # this file runs unconditionally, and prod's Prometheus (the one that would
  # actually page someone) needs somewhere to scrape a synthetic-call result
  # from at all times, not only when the observability profile is opted into.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    # Container keeps its native port 9091 — that's what prometheus.yml's
    # pushgateway scrape target uses in-network. Published on host 9099, NOT
    # 9091: the prometheus service above already owns host port 9091
    # (remapped from its container port 9090). See
    # scripts/synthetic-call-check.mjs's PUSHGATEWAY_URL default, which
    # matches this.
    ports: ["127.0.0.1:9099:9091"]
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.10", memory: 64M }

  # ── Infrastructure exporters ────────────────────────────────────────────────
  #
  # Services export their own /metrics, but every ceiling this deployment
  # actually hits first belongs to something that exports nothing: Postgres
  # connection exhaustion, Redis hitting maxmemory, Kafka consumer lag, and
  # cgroup CPU throttling / OOM-kills. Without these four, the saturation alerts
  # in prometheus/rules/saturation.yml have nothing to fire on.
  #
  # All are read-only and stay on the private network — none publish a port.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      # Superuser DSN: pg_stat_activity must be visible across ALL seven
      # databases, and a per-service role only sees its own.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=require"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    # Read-only host mounts: this reports on containers, it never changes them.
    #
    # Docker root is NOT /var/lib/docker on this host — Docker runs as a snap
    # package here, with its real data-root at
    # /var/snap/docker/common/var-lib-docker (see `docker info` -> "Docker
    # Root Dir"). /var/lib/docker is a leftover symlink to /tmp/docker, and
    # /tmp is tmpfs (wiped every reboot), so that mount source often doesn't
    # exist and Docker can't always recreate it — `docker compose up` with no
    # service filter (which recreates cadvisor along with everything else)
    # then fails outright with "mkdir /var/lib/docker: read-only file
    # system" before touching anything else. Mounted at its REAL path (not
    # remapped to /var/lib/docker) so cadvisor's own container introspection
    # — which correlates a container's GraphDriver path from the Docker API
    # against what it sees mounted — still lines up.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/snap/docker/common/var-lib-docker/:/var/snap/docker/common/var-lib-docker/:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on: [prometheus, loki, tempo]
    environment:
      # NOT anonymous-admin, unlike the dev stack. Bound to localhost, but a
      # box reachable by more than one person should still not hand an admin
      # console to whoever tunnels in first.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      # Same two-mount dashboard-provisioning pattern as the dev stack
      # (docker-compose.yml) — see grafana-dashboards.yaml's own comment for
      # why the provider config and the JSON directory are separate mounts.
      - ./infra/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/observability/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [taskboard]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

volumes:
  pgdata:
  redisdata:
  kafkadata:
  caddy_data:
  caddy_config:
  # Chat attachments. NOT covered by scripts/backup-db.sh's pg_dump — the media
  # leg in that script is what backs this up; losing it leaves chat history whose
  # every attachment 404s.
  media_blobs:
  web_dist:
  web_node_modules:
  desktop_node_modules:
  desktop_electron_cache:
  desktop_builder_cache:
  # Observability state. Prometheus is retention-capped in its command above;
  # the rest are small.
  promdata:
  alertmanagerdata:
  tempodata:
  lokidata:
  grafanadata:

networks:
  taskboard:
    driver: bridge
