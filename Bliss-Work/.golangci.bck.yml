# golangci-lint config for the Go services (notification-svc, messaging-svc,
# ws-gateway). The ci.yml `lint-go` job already invokes golangci-lint; this makes
# the enabled linter set explicit and adds security-relevant analysers.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck        # unchecked errors (esp. ignored Close()/Write() on security paths)
    - gosec           # security analyser (weak rand, sql building, file perms, etc.)
    - bodyclose       # unclosed HTTP response bodies (leak/DoS)
    - noctx           # HTTP requests without context (no timeout/cancel)
    - ineffassign
    - unconvert
    - misspell
    - unparam

linters-settings:
  gosec:
    excludes:
      # G104 overlaps errcheck; keep one source of truth for unchecked errors.
      - G104

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files may use weak randomness / ignore errors for fixtures.
    - path: _test\.go
      linters: [gosec, errcheck, noctx, bodyclose]
